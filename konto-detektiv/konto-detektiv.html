<!DOCTYPE html>
<html lang="hr-HR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konto usporedba</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f4f8; padding: 10px; line-height: 1.6; margin: 0; overflow-x: hidden; }
        .container { max-width: 1050px; margin: auto; background: white; padding: 20px 15px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; box-sizing: border-box; }
        
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f4f8; padding: 10px; line-height: 1.6; margin: 0; overflow-x: hidden; }

        /* ── Navigacija ── */
        .nav { max-width: 1000px; margin: 0 auto 15px; display: flex; gap: 8px; flex-wrap: wrap; }
        .nav-btn { flex: 1; min-width: 150px; padding: 11px 8px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 13px; background: #dce3ea; color: #555; transition: all 0.15s; text-align: center; }
        .nav-btn.active { background: #2c3e50; color: white; }
        .nav-btn:hover:not(.active) { background: #c8d0d8; }

        /* ── Container ── */
        .container { max-width: 1000px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .modul { display: none; }
        .modul.aktivan { display: block; }

        /* ── Gumbi ── */
        .btn { width: 100%; padding: 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; margin-bottom: 10px; }
        .btn-main { background: #2c3e50; color: white; }
        .btn-main:hover:not(:disabled) { background: #1a252f; }
        .btn-main:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-compare { background: #e67e22; color: white; display: none; }
        .btn-compare:hover { background: #ca6f1e; }
        .btn-export { background: #27ae60; color: white; display: none; width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 15px; margin-bottom: 10px; }
        .btn-export:hover { background: #1e8449; }
        .btn-print { background: #8e44ad; color: white; width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 15px; margin-bottom: 10px; display: none; }
        .btn-print:hover { background: #7d3c98; }

        /* ── Upload ── */
        .upload-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .upload-box { background: #f8f9fa; padding: 15px; border-radius: 10px; border: 2px solid #dee2e6; transition: border-color 0.2s; }
        .upload-box.detected-1200 { border-color: #27ae60; }
        .upload-box.detected-2200 { border-color: #2980b9; }
        .upload-box.detected-sken { border-color: #e67e22; }
        .upload-box strong { display: block; margin-bottom: 8px; }
        .konto-badge { display: inline-block; margin-top: 8px; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .badge-1200 { background: #d5f5e3; color: #1e8449; }
        .badge-2200 { background: #d6eaf8; color: #1a5276; }
        .badge-warn { background: #fdebd0; color: #a04000; }
        .badge-sken { background: #fef9e7; color: #7d6608; }
        .manual-box { display: none; margin-top: 12px; background: #fffbea; border: 1px solid #f0c040; border-radius: 8px; padding: 14px; }
        .manual-box p { margin: 0 0 10px; font-size: 13px; color: #7d6608; }
        .manual-konto { display: flex; gap: 8px; }
        .manual-konto button { flex: 1; padding: 8px; border: 2px solid #ccc; background: white; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; transition: all 0.15s; }
        .manual-konto button.active-1200 { border-color: #27ae60; background: #d5f5e3; color: #1e8449; }
        .manual-konto button.active-2200 { border-color: #2980b9; background: #d6eaf8; color: #1a5276; }

        /* ── Stat kartice ── */
        .header-box { display: none; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-top: 20px; }
        .stat-card { padding: 15px; border-radius: 8px; border: 1px solid #ddd; background: #fff; text-align: center; }
        .stat-card small { font-size: 11px; color: #999; display: block; margin-top: 4px; }
        .val { font-size: 1.2em; font-weight: bold; display: block; margin-top: 5px; }
        .bad { color: #e74c3c; }
        .good { color: #27ae60; }

        /* ── Tablice ── */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { background: #34495e; color: white; padding: 11px 12px; text-align: left; font-size: 13px; }
        td { border: 1px solid #eee; padding: 9px 12px; font-size: 13px; }
        tr:hover td { background: #f9f9f9; }
        .row-err { background: #fff5f5 !important; font-weight: bold; color: #c0392b; cursor: pointer; }
        .row-err:hover td { background: #ffe8e8 !important; }
        .row-ok { color: #27ae60; opacity: 0.8; }
        .row-only { color: #bbb; }
        .detalji-row { display: none; }
        .detalji-row td { background: #fdf2f2 !important; padding: 0; border-top: none; }
        .detalji-inner { padding: 10px 15px; }
        .detalji-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .detalji-col h4 { font-size: 12px; font-weight: bold; color: #7f8c8d; margin: 0 0 6px; text-transform: uppercase; }
        .detalji-stavka { font-size: 12px; padding: 4px 0; border-bottom: 1px solid #f5c6c6; color: #444; }
        .detalji-stavka:last-child { border-bottom: none; }
        .detalji-stavka span { float: right; font-weight: bold; }

        /* ── Kompenzacija ── */
        .komp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .komp-strana { background: #f8f9fa; border-radius: 10px; padding: 15px; border: 2px solid #dee2e6; }
        .komp-strana h3 { margin: 0 0 12px; font-size: 15px; color: #2c3e50; }
        .komp-strana.strana-a { border-color: #2980b9; }
        .komp-strana.strana-b { border-color: #e67e22; }
        .komp-input-red { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 6px; margin-bottom: 6px; align-items: center; }
        .komp-input-red input { padding: 6px 8px; border: 1px solid #ccc; border-radius: 5px; font-size: 13px; width: 100%; }
        .komp-input-red button { padding: 6px 10px; background: #e74c3c; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; }
        .btn-dodaj { background: #2980b9; color: white; border: none; padding: 7px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; margin-top: 5px; }
        .btn-dodaj.naranca { background: #e67e22; }
        .btn-dodaj:hover { opacity: 0.85; }
        .komp-firma { margin-bottom: 10px; }
        .komp-firma label { font-size: 13px; font-weight: bold; display: block; margin-bottom: 3px; }
        .komp-firma input { width: 100%; padding: 7px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; }
        .komp-summary { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin: 15px 0; }
        .komp-card { padding: 12px 15px; border-radius: 8px; text-align: center; }
        .komp-card.plava { background: #d6eaf8; }
        .komp-card.naranca { background: #fdebd0; }
        .komp-card.zelena { background: #d5f5e3; }
        .komp-card .naziv { font-size: 11px; color: #666; }
        .komp-card .broj { font-size: 1.3em; font-weight: bold; margin-top: 3px; }
        .komp-card.plava .broj { color: #1a5276; }
        .komp-card.naranca .broj { color: #784212; }
        .komp-card.zelena .broj { color: #1e8449; }
        .tab-header { display: flex; gap: 6px; margin: 15px 0 0; }
        .tab-btn { padding: 7px 16px; border: 1px solid #ccc; background: #f8f9fa; border-radius: 6px 6px 0 0; cursor: pointer; font-size: 13px; font-weight: bold; }
        .tab-btn.aktivan { background: #2c3e50; color: white; border-color: #2c3e50; }
        .pdf-ucitaj-btn { background: #8e44ad; color: white; border: none; padding: 7px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; margin-left: 8px; }

        /* ── Dokument za ispis ── */
        #dokumentPrint { display: none; }
        @media print {
            body > * { display: none !important; }
            #evidencijaPrint { display: block !important; }
            #dokumentPrint { display: block !important; font-family: 'Times New Roman', serif; }
            #dokumentPrint h2 { text-align: center; }
            #dokumentPrint table { width: 100%; border-collapse: collapse; }
            #dokumentPrint td, #dokumentPrint th { border: 1px solid #000; padding: 6px; font-size: 12px; }
            #dokumentPrint .potpis-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; margin-top: 60px; }
            #dokumentPrint .potpis-line { border-top: 1px solid #000; padding-top: 5px; font-size: 12px; }
        }

        #progress { margin-top: 10px; font-size: 13px; color: #555; min-height: 20px; }
        #upozorenje { display: none; background: #fef9e7; border: 1px solid #f9ca24; border-radius: 8px; padding: 12px 15px; margin-top: 10px; font-size: 13px; color: #7d6608; }
        .hint { font-size: 11px; color: #999; margin-top: 5px; font-style: italic; }
        .debug-box { margin-top: 20px; background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 8px; padding: 15px; font-size: 11px; font-family: monospace; display: none; max-height: 400px; overflow-y: auto; white-space: pre; }
        .putni-label { font-size: 12px; font-weight: bold; display: block; margin-bottom: 3px; color: #555; }
        .putni-input { width: 100%; padding: 7px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; }
        .trosak-red { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; margin-bottom: 6px; align-items: center; }
        .trosak-red input { padding: 6px 8px; border: 1px solid #ccc; border-radius: 5px; font-size: 13px; width: 100%; }
        .trosak-red button { padding: 5px 10px; background: #e74c3c; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .vozac-card { background: white; border: 1px solid #dee2e6; border-radius: 8px; padding: 12px 15px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; }
        .vozac-avatar { width: 42px; height: 42px; border-radius: 50%; background: #2c3e50; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; flex-shrink: 0; }
        .vozac-info { flex: 1; }
        .vozac-ime { font-weight: bold; font-size: 14px; color: #2c3e50; }
        .vozac-detalji { font-size: 12px; color: #666; margin-top: 2px; }
        .vozac-akcije { display: flex; gap: 6px; }
        .vozac-akcije button { padding: 5px 10px; border: none; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .sekcija-naslov { font-weight: bold; font-size: 14px; margin: 20px 0 8px; color: #2c3e50; border-bottom: 2px solid #ecf0f1; padding-bottom: 4px; }
    
        @media (max-width: 768px) {
            .container { padding: 12px 8px; border-radius: 8px; }
            .upload-grid, .komp-grid { grid-template-columns: 1fr !important; }
            .header-box { grid-template-columns: 1fr !important; }
            h2 { font-size: 18px; }
            .btn, .btn-main { width: 100%; }
            .tab-btn { font-size: 12px; padding: 6px 8px; }
            input[type=file] { max-width: 100%; }
            table { font-size: 11px; }
            td, th { padding: 4px 5px !important; }
        }
    </style>
</head>
<body>
<div class="container">
<div id="modul-usporedba" class="modul aktivan">
    <h2 style="text-align:center;margin-top:0;">📊 Konto Detektiv v25.0</h2>

    <div class="upload-grid">
        <div class="upload-box" id="boxL">
            <strong>📄 Prva datoteka:</strong>
            <input type="file" id="fileL" accept=".pdf" onchange="pregledajPDF('L')">
            <div id="badgeL"></div>
            <div class="manual-box" id="manualL">
                <p>📷 Skenirani PDF — odaberi konto:</p>
                <div class="manual-konto">
                    <button onclick="postaviKontoManual('L','1200')" id="btnKonto1200L">Konto 1200</button>
                    <button onclick="postaviKontoManual('L','2200')" id="btnKonto2200L">Konto 2200</button>
                </div>
            </div>
        </div>
        <div class="upload-box" id="boxD">
            <strong>📄 Druga datoteka:</strong>
            <input type="file" id="fileD" accept=".pdf" onchange="pregledajPDF('D')">
            <div id="badgeD"></div>
            <div class="manual-box" id="manualD">
                <p>📷 Skenirani PDF — odaberi konto:</p>
                <div class="manual-konto">
                    <button onclick="postaviKontoManual('D','1200')" id="btnKonto1200D">Konto 1200</button>
                    <button onclick="postaviKontoManual('D','2200')" id="btnKonto2200D">Konto 2200</button>
                </div>
            </div>
        </div>
    </div>

    <div id="upozorenje"></div>

    <!-- Odabir godine -->
    <div style="margin-top:15px;background:#f0f4f8;border-radius:8px;padding:12px 15px;display:flex;align-items:center;gap:15px;flex-wrap:wrap;">
        <span style="font-weight:bold;font-size:13px;">📅 Usporedi godinu:</span>
        <div style="display:flex;gap:8px;" id="godGumbi">
            <button onclick="postaviGodinu(2025)" class="god-btn" id="gBtn2025" style="padding:5px 14px;border:2px solid #ccc;background:white;border-radius:6px;cursor:pointer;font-weight:bold;font-size:13px;">2025</button>
            <button onclick="postaviGodinu(2026)" class="god-btn" id="gBtn2026" style="padding:5px 14px;border:2px solid #2980b9;background:#d6eaf8;color:#1a5276;border-radius:6px;cursor:pointer;font-weight:bold;font-size:13px;">2026</button>
        </div>
        <span id="godinaInfo" style="font-size:12px;color:#777;font-style:italic;">Ako kartica pokriva više godina, uzet će saldo 31.12. prethodne godine kao PS</span>
    </div>

    <button id="btnRun" class="btn btn-main" style="margin-top:15px;" onclick="izvrsiSve()">1. UČITAJ I ANALIZIRAJ KARTICE</button>
    <div id="progress"></div>

    <div id="brziPregled" class="header-box">
        <div class="stat-card">POČETNO (Razlika)<span id="psRazlika" class="val"></span><small id="psDetalj"></small></div>
        <div class="stat-card">TEKUĆE (Razlika)<span id="prRazlika" class="val"></span><small id="prDetalj"></small></div>
        <div class="stat-card">SALDO (Razlika)<span id="konRazlika" class="val"></span><small id="konDetalj"></small></div>
    </div>

    <button id="btnDeep" class="btn btn-compare" onclick="detaljnaUsporedba()">2. PRONAĐI TOČAN DAN GREŠKE</button>
    <button id="btnExport" class="btn-export" onclick="exportExcel()">⬇ Exportaj u Excel</button>
    <div id="tablicaRezultata"></div>

    <div style="margin-top:20px;">
        <button onclick="toggleDebug()" style="background:none;border:1px solid #ccc;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;">🔍 Prikaži učitane stavke</button>
    </div>
    <div id="debugBox" class="debug-box"></div>
</div>

<!-- ════════════════════════════════════════════════════════════
     MODUL 2: KOMPENZACIJA
════════════════════════════════════════════════════════════ -->
</div>

<script>
// ══════════════════════════════════════════════════════════════
// NAVIGACIJA
// ══════════════════════════════════════════════════════════════

let initDone = {};

function prikaziModul(naziv) {
    document.querySelectorAll('.modul').forEach(m => m.classList.remove('aktivan'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('modul-' + naziv).classList.add('aktivan');
    event.target.classList.add('active');

    if (!initDone[naziv]) {
        initDone[naziv] = true;
        if (naziv === 'putni') {
            document.getElementById('putniForma').style.display = 'block';
            initVrijemeSelect();
            if (document.querySelectorAll('.dnevnica-red').length === 0) {
                dodajDnevnicu('', '', '', 30);
            }
            if (document.querySelectorAll('#putniTroskovi .trosak-red').length === 0) {
                dodajTrosak(); dodajTrosak(); dodajTrosak();
            }
            azurirajSelectVozaca();
        }
        if (naziv === 'kompenzacija') {
            dodajRedak('A');
            dodajRedak('B');
        }
        if (naziv === 'evidencija') {
            initEvidencija();
        }
        if (naziv === 'placanje') {
            initPlacanje();
        }
    }
}

function prikaziTab(naziv) {
    document.getElementById('tab-rucni').style.display = naziv === 'rucni' ? 'block' : 'none';
    document.getElementById('tab-pdf').style.display   = naziv === 'pdf'   ? 'block' : 'none';
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('aktivan'));
    event.target.classList.add('aktivan');
}

// ══════════════════════════════════════════════════════════════
// KONTO USPOREDBA
// ══════════════════════════════════════════════════════════════

const pdfjsLib = window['pdfjs-dist/build/pdf'];
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.worker.min.js';

let podaci1200 = [], podaci2200 = [];
let kontoL = '', kontoD = '';
let jeSkenL = false, jeSkenD = false;
let zadnjiRezultati = [];
let odabranaGodina = 2026;

function postaviGodinu(god) {
    odabranaGodina = god;
    document.querySelectorAll(".god-btn").forEach(b => {
        let g = parseInt(b.id.replace("gBtn",""));
        b.style.border = g === god ? "2px solid #2980b9" : "2px solid #ccc";
        b.style.background = g === god ? "#d6eaf8" : "white";
        b.style.color = g === god ? "#1a5276" : "#333";
    });
    document.getElementById("godinaInfo").textContent =
        `Uspoređuje se godina ${god} — kartice s više godina filtriraju na ${god}, PS = saldo 31.12.${god-1}`;
}

function setProgress(msg) { document.getElementById('progress').textContent = msg; }

function cistiBroj(s) {
    if (!s) return 0;
    s = s.trim();
    let neg = s.endsWith('-') || s.startsWith('-');
    let c = s.replace(/[^\d,]/g, '').replace(',', '.');
    let n = parseFloat(c) || 0;
    return neg ? -n : n;
}

function normDatum(d) {
    if (!d) return '';
    let p = d.split('.');
    if (p.length < 3) return d;
    let g = p[2].length === 2 ? '20' + p[2] : p[2];
    return g + '-' + p[1].padStart(2,'0') + '-' + p[0].padStart(2,'0');
}

function sortDat(arr) {
    return [...arr].sort((a, b) => normDatum(a).localeCompare(normDatum(b)));
}

function fmt(n) {
    return Math.abs(n).toLocaleString('hr-HR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
}

function fmtBroj(n) {
    return Math.abs(n).toLocaleString('hr-HR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

async function detektirajKonto(file) {
    const buffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
    const page = await pdf.getPage(1);
    const content = await page.getTextContent();
    let tekst = content.items.map(it => it.str).join(' ');
    let stavki = content.items.length;
    if (stavki < 10) return 'sken';
    if (/\b1200\b/.test(tekst)) return '1200';
    if (/\b220000\b|\b2200\b/.test(tekst)) return '2200';
    if (/potra[žz]ivanja/i.test(tekst)) return '1200';
    if (/dobavlja[cč]/i.test(tekst)) return '2200';
    if (stavki < 30) return 'sken';
    return 'nepoznat';
}

async function pregledajPDF(strana) {
    const file = document.getElementById('file' + strana).files[0];
    if (!file) return;
    let konto = await detektirajKonto(file);
    let badgeEl  = document.getElementById('badge'  + strana);
    let boxEl    = document.getElementById('box'    + strana);
    let manualEl = document.getElementById('manual' + strana);
    boxEl.className = 'upload-box';
    manualEl.style.display = 'none';
    if (strana === 'L') { kontoL = konto; jeSkenL = (konto === 'sken'); }
    else                { kontoD = konto; jeSkenD = (konto === 'sken'); }
    if (konto === '1200') {
        badgeEl.innerHTML = `<span class="konto-badge badge-1200">✓ Konto 1200 — Potraživanja</span>`;
        boxEl.classList.add('detected-1200');
    } else if (konto === '2200') {
        badgeEl.innerHTML = `<span class="konto-badge badge-2200">✓ Konto 2200 — Dobavljači</span>`;
        boxEl.classList.add('detected-2200');
    } else if (konto === 'sken') {
        badgeEl.innerHTML = `<span class="konto-badge badge-sken">\uD83D\uDCF7 Skenirani PDF</span>`;
        boxEl.classList.add('detected-sken');
        manualEl.style.display = 'block';
    } else {
        badgeEl.innerHTML = `<span class="konto-badge badge-warn">⚠ Konto nije prepoznat</span>`;
        manualEl.style.display = 'block';
    }
    provjeriUpozorenje();
}

function postaviKontoManual(strana, konto) {
    document.getElementById('btnKonto1200' + strana).className = konto === '1200' ? 'active-1200' : '';
    document.getElementById('btnKonto2200' + strana).className = konto === '2200' ? 'active-2200' : '';
    let boxEl   = document.getElementById('box'   + strana);
    let badgeEl = document.getElementById('badge' + strana);
    boxEl.className = 'upload-box ' + (konto === '1200' ? 'detected-1200' : 'detected-2200');
    badgeEl.innerHTML = `<span class="konto-badge ${konto === '1200' ? 'badge-1200' : 'badge-2200'}">\uD83D\uDCF7 Konto ${konto} — skenirani PDF</span>`;
    if (strana === 'L') kontoL = konto; else kontoD = konto;
    provjeriUpozorenje();
}

function provjeriUpozorenje() {
    let upoz = document.getElementById('upozorenje');
    if (kontoL && kontoD && kontoL === kontoD && kontoL !== 'sken' && kontoL !== 'nepoznat') {
        upoz.style.display = 'block';
        upoz.textContent = `⚠ Obje datoteke izgledaju kao konto ${kontoL} — provjeri jesi li učitao ispravne PDF-ove.`;
    } else {
        upoz.style.display = 'none';
    }
}

async function citajPDF(file, label) {
    const buffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
    let sveStavke = [];
    for (let i = 1; i <= pdf.numPages; i++) {
        setProgress(`Čitam ${label}: ${i}/${pdf.numPages} stranica...`);
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        let redovi = {};
        content.items.forEach(it => {
            let y = Math.round(it.transform[5] / 3) * 3;
            if (!redovi[y]) redovi[y] = [];
            redovi[y].push(it);
        });
        Object.keys(redovi).sort((a, b) => b - a).forEach(y => {
            let tekst = redovi[y].sort((a, b) => a.transform[4] - b.transform[4]).map(it => it.str).join(' ');
            let iznosi = tekst.match(/\d{1,3}(?:\.\d{3})*,\d{2}-?/g);
            let datum  = tekst.match(/\b\d{1,2}\.\d{1,2}\.\d{2,4}\b/);
            if (iznosi && datum) {
                let saldo = cistiBroj(iznosi[iznosi.length - 1]);
                let jePS  = /PS\//i.test(tekst) || /\bPS\b/.test(tekst)
                         || /po[cč]etno stanje/i.test(tekst)
                         || /po[cč]\.\s*stanje/i.test(tekst)
                         || /\d{4}-PS\b/i.test(tekst);
                sveStavke.push({ d: datum[0], dNorm: normDatum(datum[0]), i: saldo, ps: jePS, tekst: tekst.trim() });
            }
        });
    }
    return sveStavke;
}

// Filtrira stavke na odabranu godinu.
// Ako kartica ima više godina (npr. 2025+2026), uzima:
//   - saldo zadnje stavke 31.12.(god-1) kao PS
//   - samo stavke odabrane godine za promet
function filtrirajPoGodini(podaci, god) {
    let godinaStr = String(god);
    let prethodnaStr = String(god - 1);

    // Provjeri ima li eksplicitni PS za traženu godinu
    let psEksp = podaci.find(x => x.ps && (x.d.endsWith(godinaStr) || x.d.includes('.01.' + godinaStr)));

    // Provjeri ima li stavki iz prethodne godine (kartica pokriva više godina)
    let imaPrethodne = podaci.some(x => !x.ps && x.dNorm.startsWith(prethodnaStr));

    let ps = 0;

    if (psEksp) {
        // Ima eksplicitni PS za traženu godinu — koristi ga
        ps = Math.abs(psEksp.i);
    } else if (imaPrethodne) {
        // Nema PS za godinu, ali ima prethodne stavke
        // PS = saldo zadnje stavke iz prethodne godine (31.12.prethodna)
        let prethodne = podaci.filter(x => !x.ps && x.dNorm.startsWith(prethodnaStr))
                              .sort((a,b) => a.dNorm.localeCompare(b.dNorm));
        if (prethodne.length) ps = Math.abs(prethodne[prethodne.length - 1].i);
    } else {
        // Samo tekuća godina, nema PS retka — PS = 0 ili prva stavka
        let sortirano = [...podaci].filter(x => !x.ps).sort((a,b) => a.dNorm.localeCompare(b.dNorm));
        ps = sortirano.length ? Math.abs(sortirano[0].i) : 0;
    }

    // Stavke samo za odabranu godinu (ne PS)
    let stavke = podaci.filter(x => !x.ps && x.dNorm.startsWith(godinaStr));

    return { ps, stavke };
}

function izvuciPS(podaci) {
    let { ps } = filtrirajPoGodini(podaci, odabranaGodina);
    return ps;
}

function izvuciKon(podaci) {
    let { stavke } = filtrirajPoGodini(podaci, odabranaGodina);
    let sortirano = [...stavke].sort((a, b) => a.dNorm.localeCompare(b.dNorm));
    return Math.abs(sortirano[sortirano.length - 1]?.i ?? 0);
}

function zadnjiSaldiPoDanu(podaci) {
    let { stavke } = filtrirajPoGodini(podaci, odabranaGodina);
    let mapa = {};
    stavke.forEach((s, idx) => {
        if (!mapa[s.d]) mapa[s.d] = { saldo: s.i, idx };
        else if (idx > mapa[s.d].idx) mapa[s.d] = { saldo: s.i, idx };
    });
    let rezultat = {};
    Object.keys(mapa).forEach(d => { rezultat[d] = Math.abs(mapa[d].saldo); });
    return rezultat;
}

function stavkeZaDan(podaci, datum) {
    return podaci.filter(x => x.d === datum && !x.ps);
}

function dnevniPromet(podaci) {
    let saldi = zadnjiSaldiPoDanu(podaci);
    let datumi = sortDat(Object.keys(saldi));
    let promet = {};
    let baza = izvuciPS(podaci);
    datumi.forEach(d => {
        let trenutni = saldi[d];
        promet[d] = Math.abs(trenutni - baza);
        baza = trenutni;
    });
    return promet;
}

async function izvrsiSve() {
    const fL = document.getElementById('fileL').files[0];
    const fD = document.getElementById('fileD').files[0];
    if (!fL || !fD) { alert('Molimo odaberite obje datoteke.'); return; }
    const btn = document.getElementById('btnRun');
    btn.textContent = 'Analiza u tijeku...';
    btn.disabled = true;
    document.getElementById('tablicaRezultata').innerHTML = '';
    document.getElementById('btnDeep').style.display = 'none';
    document.getElementById('btnExport').style.display = 'none';
    document.getElementById('brziPregled').style.display = 'none';
    try {
        let podaciL = await citajPDF(fL, 'Lijevi PDF');
        let podaciD = await citajPDF(fD, 'Desni PDF');
        if (kontoL === '1200' && kontoD === '2200') { podaci1200 = podaciL; podaci2200 = podaciD; }
        else if (kontoL === '2200' && kontoD === '1200') { podaci1200 = podaciD; podaci2200 = podaciL; }
        else { podaci1200 = podaciL; podaci2200 = podaciD; }
        podaci1200.sort((a, b) => a.dNorm.localeCompare(b.dNorm));
        podaci2200.sort((a, b) => a.dNorm.localeCompare(b.dNorm));
        let ps1 = izvuciPS(podaci1200), kon1 = izvuciKon(podaci1200);
        let ps2 = izvuciPS(podaci2200), kon2 = izvuciKon(podaci2200);
        let tek1 = kon1 - ps1, tek2 = kon2 - ps2;
        setProgress(`Učitano: 1200 = ${podaci1200.length} stavki, 2200 = ${podaci2200.length} stavki`);
        prikaziDebug(ps1, kon1, ps2, kon2);
        document.getElementById('brziPregled').style.display = 'grid';
        prikaziRezultat('psRazlika', ps1-ps2, 'psDetalj', `1200: ${fmt(ps1)}  |  2200: ${fmt(ps2)}`);
        prikaziRezultat('prRazlika', tek1-tek2, 'prDetalj', `1200: ${fmt(tek1)}  |  2200: ${fmt(tek2)}`);
        prikaziRezultat('konRazlika', kon1-kon2, 'konDetalj', `1200: ${fmt(kon1)}  |  2200: ${fmt(kon2)}`);
        if (podaci1200.length > 0 || podaci2200.length > 0) document.getElementById('btnDeep').style.display = 'block';
    } catch (err) {
        console.error(err);
        setProgress('Greška: ' + err.message);
        alert('Greška: ' + err.message);
    } finally {
        btn.textContent = '1. UČITAJ I ANALIZIRAJ KARTICE';
        btn.disabled = false;
    }
}

function prikaziRezultat(id, val, detaljId, detalj) {
    const el = document.getElementById(id);
    el.textContent = fmt(val);
    el.className = 'val ' + (Math.abs(val) > 0.05 ? 'bad' : 'good');
    if (detaljId) document.getElementById(detaljId).textContent = detalj;
}

function detaljnaUsporedba() {
    let promet1 = dnevniPromet(podaci1200);
    let promet2 = dnevniPromet(podaci2200);
    let sviDatumi = sortDat([...new Set([...Object.keys(promet1), ...Object.keys(promet2)])]);
    zadnjiRezultati = [];
    let html = `<p class="hint" style="margin-top:15px;">\uD83D\uDCA1 Klikni na crveni red za detalje stavki tog dana</p>`;
    html += `<table><tr><th>Datum</th><th>Promet 1200</th><th>Promet 2200</th><th>Razlika</th></tr>`;
    let imaRazlika = false, rowIdx = 0;
    sviDatumi.forEach(d => {
        let p1 = promet1[d] ?? null;
        let p2 = promet2[d] ?? null;
        if (p1 === null || p2 === null) {
            zadnjiRezultati.push({ datum: d, promet1200: p1??0, promet2200: p2??0, razlika: 0, status: p1!==null?'samo u 1200':'samo u 2200' });
            html += `<tr class="row-only"><td>${d}</td><td>${p1!==null?fmt(p1):'—'}</td><td>${p2!==null?fmt(p2):'—'}</td><td>${p1!==null?'samo u 1200':'samo u 2200'}</td></tr>`;
            return;
        }
        let diff = p1 - p2;
        zadnjiRezultati.push({ datum: d, promet1200: p1, promet2200: p2, razlika: diff, status: Math.abs(diff)>0.05?'GREŠKA':'OK' });
        if (Math.abs(diff) > 0.05) {
            imaRazlika = true;
            let rid = 'row_' + rowIdx;
            let s1 = stavkeZaDan(podaci1200, d);
            let s2 = stavkeZaDan(podaci2200, d);
            let det1 = s1.length ? s1.map(s => `<div class="detalji-stavka">${s.tekst.substring(0,50)} <span>${fmt(s.i)}</span></div>`).join('') : '<div class="detalji-stavka" style="color:#aaa;">nema stavki</div>';
            let det2 = s2.length ? s2.map(s => `<div class="detalji-stavka">${s.tekst.substring(0,50)} <span>${fmt(s.i)}</span></div>`).join('') : '<div class="detalji-stavka" style="color:#aaa;">nema stavki</div>';
            html += `<tr class="row-err" onclick="toggleDetalji('${rid}')"><td>▶ ${d}</td><td>${fmt(p1)}</td><td>${fmt(p2)}</td><td>${(diff>0?'+':'')}${diff.toFixed(2)} €</td></tr>
            <tr class="detalji-row" id="${rid}"><td colspan="4"><div class="detalji-inner"><div class="detalji-grid">
                <div class="detalji-col"><h4>Stavke 1200</h4>${det1}</div>
                <div class="detalji-col"><h4>Stavke 2200</h4>${det2}</div>
            </div></div></td></tr>`;
            rowIdx++;
        } else {
            html += `<tr class="row-ok"><td>${d}</td><td>${fmt(p1)}</td><td>${fmt(p2)}</td><td>✓</td></tr>`;
        }
    });
    if (!imaRazlika) html += `<tr><td colspan="4" style="text-align:center;color:#27ae60;padding:20px;font-weight:bold;">✅ Nema razlika!</td></tr>`;
    html += '</table>';
    document.getElementById('tablicaRezultata').innerHTML = html;
    document.getElementById('btnExport').style.display = 'block';
}

function toggleDetalji(id) {
    let row = document.getElementById(id);
    if (!row) return;
    row.style.display = row.style.display === 'table-row' ? 'none' : 'table-row';
    let td = row.previousElementSibling.querySelector('td');
    if (td) td.textContent = td.textContent.startsWith('▼') ? td.textContent.replace('▼','▶') : td.textContent.replace('▶','▼');
}

function exportExcel() {
    if (!zadnjiRezultati.length) return;
    let wb = XLSX.utils.book_new();
    let d1 = [['Datum','Promet 1200','Promet 2200','Razlika','Status']];
    zadnjiRezultati.forEach(r => d1.push([r.datum, r.promet1200, r.promet2200, r.razlika, r.status]));
    let ws1 = XLSX.utils.aoa_to_sheet(d1);
    ws1['!cols'] = [{wch:14},{wch:14},{wch:14},{wch:12},{wch:10}];
    XLSX.utils.book_append_sheet(wb, ws1, 'Usporedba');
    let d2 = [['Datum','Saldo','PS','Opis']];
    podaci1200.forEach(s => d2.push([s.d, s.i, s.ps?'DA':'', s.tekst.substring(0,80)]));
    let ws2 = XLSX.utils.aoa_to_sheet(d2);
    XLSX.utils.book_append_sheet(wb, ws2, 'Stavke 1200');
    let d3 = [['Datum','Saldo','PS','Opis']];
    podaci2200.forEach(s => d3.push([s.d, s.i, s.ps?'DA':'', s.tekst.substring(0,80)]));
    let ws3 = XLSX.utils.aoa_to_sheet(d3);
    XLSX.utils.book_append_sheet(wb, ws3, 'Stavke 2200');
    XLSX.writeFile(wb, `konto_usporedba_${new Date().toISOString().slice(0,10)}.xlsx`);
}

function prikaziDebug(ps1, kon1, ps2, kon2) {
    let out = `=== SUMMARY ===\nKonto 1200: PS=${ps1}  KON=${kon1}  TEK=${(kon1-ps1).toFixed(2)}\nKonto 2200: PS=${ps2}  KON=${kon2}  TEK=${(kon2-ps2).toFixed(2)}\n\n`;
    out += `=== STAVKE 1200 (${podaci1200.length}) ===\n`;
    podaci1200.forEach((s,i) => { out += `[${String(i).padStart(3)}] ${s.d.padEnd(12)} saldo=${String(s.i).padStart(12)}  ps=${s.ps?'DA':'--'}  | ${s.tekst.substring(0,60)}\n`; });
    out += `\n=== STAVKE 2200 (${podaci2200.length}) ===\n`;
    podaci2200.forEach((s,i) => { out += `[${String(i).padStart(3)}] ${s.d.padEnd(12)} saldo=${String(s.i).padStart(12)}  ps=${s.ps?'DA':'--'}  | ${s.tekst.substring(0,60)}\n`; });
    document.getElementById('debugBox').textContent = out;
}

function toggleDebug() {
    let b = document.getElementById('debugBox');
    b.style.display = b.style.display === 'block' ? 'none' : 'block';
}

function otвориSudreg(strana) {
    let oib = document.getElementById('kompOib' + strana).value.trim().replace(/\s/g,'');
    let statusEl = document.getElementById('oibStatus' + strana);

    if (!oib || oib.length !== 11 || !/^\d{11}$/.test(oib)) {
        statusEl.style.color = '#e74c3c';
        statusEl.textContent = '\u26a0 OIB mora imati točno 11 znamenki';
        return;
    }

    let url = `https://sudreg.pravosudje.hr/ords/r/esudreg/public/40?p40_oib=${oib}&p40_tip=2&clear=RP,40`;
    
    // Napravi privremeni link i klikni ga - zaobilazi popup bloker
    let a = document.createElement('a');
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    statusEl.style.color = '#2980b9';
    statusEl.textContent = '\u2192 Otvara Sudski registar — prepiši podatke ovdje';
}

function azurirajGumbSudreg(strana) {
    let oib = document.getElementById('kompOib' + strana).value.trim().replace(/\s/g,'');
    let statusEl = document.getElementById('oibStatus' + strana);
    if (oib.length === 11 && /^\d{11}$/.test(oib)) {
        statusEl.style.color = '#27ae60';
        statusEl.textContent = '✓ OIB ispravan — klikni gumb za otvaranje Sudskog registra';
    } else if (oib.length > 0) {
        statusEl.style.color = '#e67e22';
        statusEl.textContent = `${oib.length}/11 znamenki`;
    } else {
        statusEl.style.color = '#666';
        statusEl.textContent = 'Unesi OIB i klikni gumb — otvorit će se Sudski registar';
    }
}

function popuniPodatke(strana, naziv, adresa, mjesto) {
    if (naziv) document.getElementById('kompFirma' + strana).value = naziv;
    if (adresa) document.getElementById('kompAdresa' + strana).value = adresa;
    if (mjesto) document.getElementById('kompMjesto' + strana).value = mjesto;
}

function parsirajIznos(s) {
    if (!s) return 0;
    s = s.trim().replace(/\s/g,'');
    if (s.includes(',')) s = s.replace(/\./g,'').replace(',','.');
    return Math.abs(parseFloat(s) || 0);
}
