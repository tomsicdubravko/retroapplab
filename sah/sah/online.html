<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dubrovnik Chess — Online</title>
  <style>
    body { margin:0; min-height:100vh; background:#0f0804; color:#f0e5c8; font-family:Georgia,serif; }
    #root { min-height:100vh; }
    #boot-status { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:24px; box-sizing:border-box; background:linear-gradient(160deg,#0f0804 0%,#2a1a08 62%,#0f0804 100%); color:#e0b85a; font-family:Georgia,serif; text-align:center; z-index:9999; }
    #boot-status.boot-hidden { display:none; }
    #boot-status strong { display:block; margin-bottom:10px; font-size:20px; letter-spacing:2px; }
    #boot-status span { display:block; max-width:520px; color:#c0964a; font-size:14px; line-height:1.55; }
    button { font-family:Georgia,serif; }
    @keyframes pulseDest { 0% { background: rgba(224,184,90,0.82); } 100% { background: rgba(224,184,90,0); } }
    @keyframes pulseSrc  { 0% { background: rgba(224,184,90,0.45); } 100% { background: rgba(224,184,90,0); } }
    .sq-anim-dest { animation: pulseDest 1.1s ease-out forwards; }
    .sq-anim-src  { animation: pulseSrc  0.85s ease-out forwards; }
    @keyframes fadeInResult { from { opacity: 0; } to { opacity: 1; } }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script src="vendor/mqtt.min.js"></script>
  <script src="chess-engine.js"></script>
</head>
<body>
  <div id="root"></div>
  <div id="boot-status" role="status" aria-live="polite">
    <div>
      <strong>Dubrovnik Chess</strong>
      <span>Ucitavanje online igre...</span>
    </div>
  </div>
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script>
    (function() {
      var status = document.getElementById("boot-status");
      if (!status) return;
      var msg = status.querySelector("span");
      function setBootMessage(text) {
        if (msg) msg.textContent = text;
      }
      window.hideBootStatus = function() {
        status.className = "boot-hidden";
      };
      window.addEventListener("error", function(event) {
        if (!event || !event.message) return;
        setBootMessage("Online igra se nije mogla pokrenuti: " + event.message);
      });
      setTimeout(function() {
        if (document.getElementById("root").childElementCount > 0) {
          window.hideBootStatus();
          return;
        }
        var missing = [];
        if (!window.mqtt) missing.push("MQTT");
        if (!window.React) missing.push("React");
        if (!window.ReactDOM) missing.push("ReactDOM");
        if (missing.length) {
          setBootMessage("Nedostaje " + missing.join(", ") + ". Provjeri mapu vendor pokraj online.html.");
        } else {
          setBootMessage("Biblioteke su ucitane, ali online stranica se nije prikazala. Otvori konzolu preglednika za detalje greske.");
        }
      }, 2000);
    })();
  </script>
  <script src="online-app.js"></script>
</body>
</html>
