<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dubrovnik Chess 1950</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f0804;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Georgia, serif;
      overflow: hidden;
    }
    .bg-glow {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 520px; height: 520px;
      background: radial-gradient(ellipse, rgba(224,184,90,0.06) 0%, transparent 70%);
      pointer-events: none;
      opacity: 0;
      animation: fadeIn 2s ease-out 0.6s forwards;
    }
    .splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px 16px;
      position: relative;
      z-index: 1;
    }
    .grb {
      width: 62px; height: 62px;
      object-fit: contain;
      filter: drop-shadow(0 0 12px rgba(224,184,90,0.45));
      opacity: 0;
      animation: scaleIn 0.7s cubic-bezier(.22,.8,.36,1) 0.1s forwards;
      margin-bottom: 10px;
    }
    .vlaho-wrap {
      opacity: 0;
      animation: fadeIn 0.3s ease-out 0.5s forwards;
      margin-bottom: 14px;
      filter: drop-shadow(0 0 14px rgba(224,184,90,0.2));
    }
    .vlaho-svg {
      display: block;
      animation: revealDown 1.5s cubic-bezier(.4,0,.2,1) 0.6s both;
    }
    .grad-wrap {
      opacity: 0;
      animation: fadeIn 0.4s ease-out 2.2s forwards;
      margin-bottom: 16px;
      width: 100%;
      max-width: 420px;
      filter: drop-shadow(0 0 18px rgba(224,184,90,0.12));
    }
    .grad-svg {
      display: block;
      width: 100%;
      animation: revealRight 2.1s cubic-bezier(.4,0,.2,1) 2.3s both;
    }
    .text-block { text-align: center; }
    .t-olimp {
      color: #8a6838;
      font-size: 9px;
      letter-spacing: 5px;
      opacity: 0;
      animation: textIn 0.6s ease-out 4.5s forwards;
      margin-bottom: 3px;
    }
    .t-year {
      font-size: 40px;
      font-weight: bold;
      letter-spacing: 10px;
      opacity: 0;
      margin-bottom: 3px;
      line-height: 1;
      color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
      background-image: linear-gradient(
        105deg,
        #f0e5c8 0%, #f0e5c8 35%,
        #f5ead5 42%, #fdf8ed 50%, #f5ead5 58%,
        #f0e5c8 65%, #f0e5c8 100%
      );
      background-size: 300% 100%;
      background-position: 100% center;
      animation:
        textIn    0.6s ease-out    4.9s forwards,
        goldSweep 4.5s ease-in-out 5.9s forwards;
    }
    .t-city {
      color: #e0b85a;
      font-size: 18px;
      letter-spacing: 9px;
      font-weight: bold;
      opacity: 0;
      animation: textIn 0.6s ease-out 5.3s forwards;
    }
    .enter-btn {
      margin-top: 22px;
      background: transparent;
      border: 1.5px solid #4a3010;
      color: #8a6838;
      padding: 11px 36px;
      font-family: Georgia, serif;
      font-size: 11px;
      letter-spacing: 5px;
      cursor: pointer;
      border-radius: 6px;
      opacity: 0;
      animation: fadeIn 0.8s ease-out 6.0s forwards;
      transition: border-color 0.3s, color 0.3s, box-shadow 0.3s;
    }
    .enter-btn:hover {
      border-color: #e0b85a;
      color: #e0b85a;
      box-shadow: 0 0 12px rgba(224,184,90,0.2);
    }
    @keyframes fadeIn  { from { opacity: 0; } to { opacity: 1; } }
    @keyframes scaleIn { from { opacity: 0; transform: scale(0.7); } to { opacity: 1; transform: scale(1); } }
    @keyframes textIn  { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes revealDown  { from { clip-path: inset(0 0 100% 0); transform: translateY(16px) scale(0.96); opacity: 0; } to { clip-path: inset(0 0 0% 0); transform: translateY(0) scale(1); opacity: 1; } }
    @keyframes revealRight { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0% 0 0); } }
    @keyframes goldSweep {
      from { background-position: 100% center; }
      to   { background-position:   0% center; }
    }
    .skip-btn { position:fixed; top:16px; right:20px; background:transparent; border:none; color:#4a3010; font-family:Georgia,serif; font-size:10px; letter-spacing:3px; cursor:pointer; padding:8px 12px; opacity:0; animation:fadeIn 0.5s ease-out 1s forwards; transition:color .3s; z-index:10; }
    .skip-btn:hover { color:#8a6838; }
  </style>
</head>
