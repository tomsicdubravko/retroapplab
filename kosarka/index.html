<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title></title>
<script src="js/ime-igre.js"></script>
<script src="js/tekstovi.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/stil.css">
</head>
<body>
<div id="splash">
  <div class="sp-sadrzaj">
    <div class="sp-zoom"><img class="sp-img" src="img/splash-landscape.webp" alt=""><div class="sp-glow"></div></div>
    <div class="sp-crno"></div>
    <div class="sp-naslov"></div>
    <div class="sp-pod"></div>
    <div class="sp-tap"><b></b><small></small></div>
    <div class="sp-bar"><i></i></div>
  </div>
</div>
<script src="js/splash.js"></script>
<div id="game"></div>

<div id="hud">
  <div id="topbar">
    <div class="cards blue" id="cardsBlue"></div>
    <div id="board">
      <div class="sc"><span id="s0">0</span></div>
      <div class="mid"><span id="shot">14</span><span id="target"></span></div>
      <div class="sc red"><span id="s1">0</span></div>
    </div>
    <div class="cards red" id="cardsRed"></div>
  </div>
  <div id="stam"><div></div></div>
</div>
<div id="msg"></div>
<div id="hype"><div class="ray"></div><span class="t"></span><span class="s"></span></div>
<div id="taunt"></div>
<div id="edge"></div>
<div id="flashOv"></div>
<canvas id="minimap" width="260" height="244"></canvas>
<div id="scbar"><span data-t="hud.vrijemeNapada"></span><div class="tr"><div class="fl"></div></div></div>
<div id="legend"><span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span><b data-t="legenda.kretanje"></b><span><kbd data-t="legenda.razmak"></kbd></span><b data-t="legenda.sutBlok"></b><span><kbd>E</kbd></span><b data-t="legenda.dodaj"></b><span><kbd>Q</kbd></span><b data-t="legenda.dribling"></b><span><kbd>Shift</kbd></span><b data-t="legenda.sprint"></b></div>
<div id="hint" data-t="hud.iznesiLoptu"></div>
<div id="meter"><div id="mz"></div><div id="mf"></div></div>
<div id="fb" class="bb"></div>

<button id="muteBtn" class="icon" data-t-aria="hud.zvuk">🔊</button>
<button id="pauseBtn" class="icon" data-t-aria="hud.pauza">❚❚</button>

<div id="touch">
  <div id="joyZone"><div id="joyBase"><div id="joyKnob"></div><i></i><i></i><i></i><i></i></div></div>
  <div id="btns">
    <button id="bSteal" class="tb red" data-t-aria="gumb.kradi"><b class="ic"></b><span data-t="gumb.kradi"></span></button>
    <button id="bPass" class="tb blue" data-t-aria="gumb.dodaj"><svg class="hold" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48"/></svg><b class="ic"></b><span data-t="gumb.dodaj"></span></button>
    <button id="bShoot" class="tb orange" data-t-aria="gumb.sut"><b class="ic"></b><span data-t="gumb.sut"></span></button>
  </div>
</div>

<div id="menu" class="overlay">
  <div class="card">
    <h1 class="bb" id="menuNaslov"></h1>
    <p data-t="izbornik.opis"></p>
    <p style="margin-top:-4px" data-t-html="izbornik.ekipe"></p>
    <div class="row"><span class="l" data-t="izbornik.tezina"></span>
      <div class="seg" id="segDiff"><button data-v="0" data-t="tezina.0"></button><button data-v="1" class="on" data-t="tezina.1"></button><button data-v="2" data-t="tezina.2"></button></div></div>
    <div class="row"><span class="l" data-t="izbornik.igraSeDo"></span>
      <div class="seg" id="segTarget"><button data-v="11">11</button><button data-v="21" class="on">21</button><button data-v="31">31</button></div></div>
    <button class="big" id="startBtn" data-t="izbornik.igraj"></button>
    <button class="big" id="tourBtn" data-t="izbornik.turnir"></button>
    <button class="big" id="karBtn" data-t="izbornik.karijera"></button>
    <div class="modes"><button class="big alt" id="triceBtn" data-t="izbornik.trice"></button><button class="big alt" id="soloBtn" data-t="izbornik.solo"></button></div>
    <div class="modes"><button class="big alt" id="mpBtn" data-t="izbornik.online"></button><button class="big alt" id="localBtn" data-t="izbornik.lokalno"></button></div>
    <div class="help" id="helpKeys" data-t-html="izbornik.pomocTipke"></div>
    <div class="help" id="helpTouch" style="display:none" data-t-html="izbornik.pomocDodir"></div>
  </div>
</div>

<div id="pauseOv" class="overlay hidden">
  <div class="car">
    <h1 class="bb" data-t="pauza.naslov"></h1>
    <button class="big" id="resumeBtn" data-t="opce.nastavi"></button>
    <button class="big alt" id="quitBtn" data-t="opce.izbornik"></button>
  </div>
</div>

<div id="tHud" class="hidden">
  <div id="tBoard">
    <div class="sc"><span id="tPts">0</span><small data-t="trice.bodovi"></small></div>
    <div class="mid"><span id="tClock">32.0</span><small id="tStName" data-t="trice.stalak.0"></small></div>
    <div class="sc gold"><span id="tBest">0</span><small data-t="trice.rekord"></small></div>
  </div>
  <div id="tRacks"></div>
</div>
<div id="tAim" class="hidden">
  <div id="tMeterX" class="tm"><div class="z2"></div><div class="z"></div><div class="f"></div><b>X</b></div>
  <div id="tMeterY" class="tm v"><div class="z2"></div><div class="z"></div><div class="f"></div><b>Y</b></div>
</div>
<button id="tShoot" class="hidden" aria-hidden="true" tabindex="-1"><svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><circle cx="24" cy="24" r="17"/><path d="M7 24h34M24 7v34M12 11c6 6 6 20 0 26M36 11c-6 6-6 20 0 26"/></svg><span data-t="gumb.sut"></span></button>
<div id="tOver" class="overlay hidden">
  <div class="card" style="text-align:center">
    <div id="tResPts" class="bb">0<small> / 18</small></div>
    <div id="tResRate" class="bb"></div>
    <div id="tResInfo"></div>
    <div id="tResRec" class="hidden" data-t="trice.noviRekord"></div>
    <div id="tTop"></div>
    <button class="big" id="tAgain" data-t="trice.opet"></button>
    <button class="big alt" id="tMenuBtn" data-t="opce.izbornik"></button>
  </div>
</div>
<div id="mpOv" class="overlay hidden">
  <div class="card">
    <h1 class="bb" style="font-size:42px" data-t="online.naslov"></h1>
    <p id="mpStatus"></p>
    <div id="mpHost">
      <div class="row"><span class="l" data-t="online.nacin"></span>
        <div class="seg" id="segMp"><button data-v="coop" class="on" data-t="online.coop"></button><button data-v="vs" data-t="online.vs"></button><button data-v="team" data-t="online.team"></button></div></div>
      <button class="big" id="mpHostBtn" data-t="online.napravi"></button>
    </div>
    <div id="mpCodeBox" class="hidden" style="text-align:center;margin-top:6px">
      <span class="l" data-t="online.kodIgre"></span>
      <div id="mpCode" class="bb" style="font-size:68px;letter-spacing:.22em;color:var(--amber);line-height:1">----</div>
      <button class="big alt" id="mpShare" data-t="online.posalji"></button>
    </div>
    <div id="mpJoin" style="margin-top:16px;border-top:1px solid var(--line);padding-top:12px">
      <span class="l" data-t="online.imasKod"></span>
      <div style="display:flex;gap:8px"><input id="mpCodeIn" maxlength="4" autocomplete="off" autocapitalize="characters" data-t-ph="online.primjer" data-t-aria="online.kodIgre"
        style="flex:1;min-width:0;height:52px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--fg);font:400 30px 'Bebas Neue',Impact,sans-serif;letter-spacing:.2em;text-align:center;text-transform:uppercase">
        <button class="big" id="mpJoinBtn" style="margin:0;width:auto;padding:0 18px;font-size:22px" data-t="online.pridruzi"></button></div>
    </div>
    <button class="big hidden" id="mpGo" data-t="opce.kreni"></button>
    <button class="big alt" id="mpBack" data-t="opce.natrag"></button>
  </div>
</div>
<div id="locOv" class="overlay hidden">
  <div class="card">
    <h1 class="bb" style="font-size:42px" data-t="lokalno.naslov"></h1>
    <p data-t-html="lokalno.opis"></p>
    <div id="locTeams"></div>
    <div id="locMsg"></div>
    <div class="lkeys">
      <div data-t-html="lokalno.tipkeA"></div>
      <div data-t-html="lokalno.tipkeB"></div>
      <div data-t-html="lokalno.kontroler"></div>
    </div>
    <button class="big" id="locGo" data-t="opce.kreni"></button>
    <button class="big alt" id="locBack" data-t="opce.natrag"></button>
  </div>
</div>
<div id="karOv" class="overlay hidden">
  <div class="card">
    <h1 class="bb" style="font-size:40px" data-t="karijera.naslov"></h1>
    <div id="karBody"></div>
  </div>
</div>
<div id="karRez" class="overlay hidden">
  <div class="card" style="text-align:center">
    <div class="kr-t bb"></div>
    <div class="kr-l"></div>
    <div class="kr-p"></div>
    <button class="big" id="karNastavi" data-t="opce.nastavi"></button>
  </div>
</div>
<div id="tourOv" class="overlay hidden">
  <div class="card">
    <div id="tourHead"></div>
    <div id="rivalBox"></div>
    <div class="pcards" id="tourCards"></div>
    <div id="repBox"></div>
    <div id="tourBracket"></div>
    <button class="big" id="tourPlay" data-t="turnir.igraj"></button>
    <button class="big alt" id="tourMenu" data-t="opce.izbornik"></button>
  </div>
</div>
<div id="over" class="overlay hidden">
  <div class="card" style="text-align:center">
    <div id="overTitle" class="bb"></div>
    <div id="overScore" class="bb"></div>
    <div class="pcards" id="overCards" style="margin-top:12px"></div>
    <button class="big" id="againBtn" data-t="kraj.novaIgra"></button>
    <button class="big alt" id="menuBtn" data-t="opce.izbornik"></button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- redoslijed je bitan: sve skripte dijele globalni opseg, main.js pokreće igru -->
<script src="js/osnova.js"></script>
<script src="js/botovi.js"></script>
<script src="js/profil.js"></script>
<script src="js/scena.js"></script>
<script src="js/igraci.js"></script>
<script src="js/efekti.js"></script>
<script src="js/lopta.js"></script>
<script src="js/hud.js"></script>
<script src="js/pravila.js"></script>
<script src="js/nastavak.js"></script>
<script src="js/kontrole.js"></script>
<script src="js/ai.js"></script>
<script src="js/utakmica.js"></script>
<script src="js/nacini/lokalno.js"></script>
<script src="js/nacini/solo.js"></script>
<script src="js/nacini/turnir.js"></script>
<script src="js/nacini/brza-igra.js"></script>
<script src="js/nacini/trice.js"></script>
<script src="js/nacini/online.js"></script>
<script src="js/trgovina.js"></script>
<script src="js/karijera.js"></script>
<script src="js/razvoj.js"></script>
<script src="js/main.js"></script>
</body>
</html>
