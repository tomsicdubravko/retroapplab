<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pčelica</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#07131b;font-family:Trebuchet MS,Segoe UI,sans-serif;touch-action:manipulation}
#splash{position:fixed;inset:0;overflow:hidden;background:#07131b;cursor:pointer}
canvas{position:absolute;inset:0;width:100%;height:100%}

/* cinematic vignette */
.vignette{position:absolute;inset:0;pointer-events:none;background:
radial-gradient(ellipse at 50% 48%,transparent 25%,rgba(0,0,0,.10) 58%,rgba(0,0,0,.72) 100%)}
.glow{position:absolute;left:50%;top:45%;width:55vw;height:55vw;max-width:620px;max-height:620px;
transform:translate(-50%,-50%);border-radius:50%;background:rgba(255,207,62,.08);
filter:blur(45px);pointer-events:none}

.logo{position:absolute;top:12.5%;left:50%;transform:translateX(-50%) translateY(18px);
opacity:0;text-align:center;color:#ffd33d;font-weight:1000;letter-spacing:.14em;font-size:clamp(42px,11vw,82px);
text-shadow:0 3px 0 #a95e08,0 7px 0 #55310b,0 14px 28px rgba(0,0,0,.55);
animation:logoIn 1s 1.55s cubic-bezier(.2,.85,.2,1) forwards;white-space:nowrap}
.logo small{display:block;margin-top:8px;font-size:clamp(10px,2.4vw,15px);letter-spacing:.45em;color:#fff4c5;
font-weight:700;text-shadow:0 2px 8px #000;opacity:.9}
@keyframes logoIn{to{opacity:1;transform:translateX(-50%) translateY(0)}}

.tap{position:absolute;left:50%;bottom:9%;transform:translateX(-50%) scale(.95);opacity:0;
color:#fff8d9;font-size:clamp(15px,4vw,20px);font-weight:800;letter-spacing:.08em;
text-shadow:0 2px 12px #000;animation:tapIn .8s 2.2s ease forwards,tapPulse 1.35s 3s ease-in-out infinite alternate}
@keyframes tapIn{to{opacity:.95}}
@keyframes tapPulse{to{transform:translateX(-50%) scale(1.06);text-shadow:0 0 22px rgba(255,220,100,.85)}}

/* bee */
.bee{position:absolute;left:50%;top:51%;width:170px;height:150px;transform:translate(-50%,-50%) scale(.45);
opacity:0;z-index:5;animation:beeEnter 1.25s .15s cubic-bezier(.16,.9,.2,1) forwards,beeFloat 2.8s 1.4s ease-in-out infinite}
@keyframes beeEnter{0%{opacity:0;transform:translate(-62vw,-35vh) rotate(-18deg) scale(.45)}
65%{opacity:1;transform:translate(-50%,-50%) rotate(5deg) scale(1.08)}
100%{opacity:1;transform:translate(-50%,-50%) rotate(0) scale(1)}}
@keyframes beeFloat{0%,100%{margin-top:0;margin-left:0}25%{margin-left:6px}50%{margin-top:-10px;margin-left:0}75%{margin-left:-6px}}
.wing{transform-box:fill-box;transform-origin:center;animation:wing 0.12s linear infinite alternate}
@keyframes wing{to{transform:scaleY(.72) rotate(3deg)}}

/* little dust / pollen */
.pollen{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffd94a;box-shadow:0 0 10px #ffd94a;
opacity:0;animation:pollen 2.4s linear infinite}
@keyframes pollen{0%{opacity:0;transform:translate(0,20px) scale(.4)}15%{opacity:.9}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1.2)}}

/* portal hint */
.portal{position:absolute;left:50%;bottom:16%;width:70px;height:25px;transform:translateX(-50%) scale(.7);
border-radius:50%;border:2px solid rgba(113,214,255,.7);box-shadow:0 0 18px #28bdf4,inset 0 0 15px #1677b2;
opacity:0;animation:portalIn 1s 1.1s ease forwards,portalPulse 2s 2.1s ease-in-out infinite}
@keyframes portalIn{to{opacity:.9;transform:translateX(-50%) scale(1)}}
@keyframes portalPulse{50%{transform:translateX(-50%) scale(1.12);opacity:.65}}

/* fade-out state: pauses CSS animations + hides after the transition so nothing keeps running invisibly */
#splash.fade-out{transition:opacity .65s,transform .65s;opacity:0;transform:scale(1.035);pointer-events:none}
#splash.fade-out .bee,#splash.fade-out .wing,#splash.fade-out .tap,#splash.fade-out .portal,#splash.fade-out .pollen{
  animation-play-state:paused !important;
}
</style>
</head>
<body>
<div id="splash">
  <canvas id="scene"></canvas>
  <div class="glow"></div>
  <div class="vignette"></div>
  <div class="portal"></div>
  <div id="pollen"></div>

  <div class="bee">
    <svg width="170" height="150" viewBox="0 0 170 150">
      <defs>
        <radialGradient id="gold" cx="35%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#fff6a0"/><stop offset="55%" stop-color="#ffd044"/><stop offset="100%" stop-color="#e9900b"/>
        </radialGradient>
        <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
          <stop stop-color="#fff" stop-opacity=".96"/><stop offset="1" stop-color="#9edcff" stop-opacity=".55"/>
        </linearGradient>
      </defs>
      <g class="wing">
        <ellipse cx="43" cy="46" rx="34" ry="20" fill="url(#wing)" stroke="#9bd7ff" stroke-width="2"/>
      </g>
      <g class="wing" style="transform-origin:127px 46px">
        <ellipse cx="127" cy="46" rx="34" ry="20" fill="url(#wing)" stroke="#9bd7ff" stroke-width="2"/>
      </g>
      <polygon points="85,138 77,118 93,118" fill="#241914"/>
      <ellipse cx="85" cy="85" rx="46" ry="40" fill="url(#gold)" stroke="#603800" stroke-width="2.5"/>
      <path d="M52 70Q85 82 118 70Q116 84 114 94Q85 106 56 94Z" fill="#2b201a"/>
      <path d="M64 106Q85 114 106 106Q102 116 96 121Q85 124 74 121Z" fill="#2b201a"/>
      <ellipse cx="61" cy="94" rx="8" ry="5" fill="#ff7675" opacity=".65"/>
      <ellipse cx="109" cy="94" rx="8" ry="5" fill="#ff7675" opacity=".65"/>
      <ellipse cx="68" cy="74" rx="10" ry="13" fill="#17100c"/>
      <ellipse cx="102" cy="74" rx="10" ry="13" fill="#17100c"/>
      <circle cx="65" cy="69" r="4.5" fill="#fff"/>
      <circle cx="99" cy="69" r="4.5" fill="#fff"/>
      <circle cx="72" cy="78" r="2" fill="#fff" opacity=".8"/>
      <circle cx="106" cy="78" r="2" fill="#fff" opacity=".8"/>
      <path d="M77 88Q85 97 93 88" stroke="#683d00" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M72 48Q62 30 50 34" stroke="#2b201a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <circle cx="49" cy="34" r="5" fill="#ff9f43"/>
      <path d="M98 48Q108 30 120 34" stroke="#2b201a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <circle cx="121" cy="34" r="5" fill="#ff9f43"/>
    </svg>
  </div>

  <div class="logo">PČELICA<small>MALI SVIJET · VELIKA AVANTURA</small></div>
  <div class="tap">✨ Dodirni za početak ✨</div>
</div>

<script>
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d');
let W,H,DPR,t=0;
let running=true; // stops the draw loop once the splash is dismissed
let grassBlades=[];
function initGrass(){
  grassBlades=[];
  for(let x=0;x<W;x+=18){
    grassBlades.push({
      x,
      baseY:H*.73+Math.random()*H*.27,
      tipXOff:-4-Math.random()*3,
      tipYOff:-(6+Math.random()*10),
      swayPhase:Math.random()*Math.PI*2,
      swaySpeed:1.1+Math.random()*.6
    });
  }
}
function resize(){
  DPR=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
  canvas.width=W*DPR; canvas.height=H*DPR; canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  initGrass();
}
addEventListener('resize',resize);resize();

const stars=Array.from({length:55},()=>({x:Math.random(),y:Math.random()*.48,r:.5+Math.random()*1.6,a:.2+Math.random()*.6}));
const clouds=Array.from({length:7},()=>({x:Math.random(),y:.13+Math.random()*.25,s:.6+Math.random()*1.2}));
function draw(){
  if(!running) return;
  t+=.016;
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#102b43');g.addColorStop(.48,'#246f94');g.addColorStop(.67,'#6eaf58');g.addColorStop(1,'#174c46');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  // sunset glow
  const rg=ctx.createRadialGradient(W*.5,H*.47,5,W*.5,H*.47,Math.max(W,H)*.58);
  rg.addColorStop(0,'rgba(255,218,105,.24)');rg.addColorStop(1,'rgba(255,218,105,0)');
  ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);

  // stars
  stars.forEach(s=>{ctx.globalAlpha=s.a*(.65+.35*Math.sin(t*2+s.x*9));ctx.fillStyle='#fff2bd';ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);ctx.fill()});
  ctx.globalAlpha=1;

  // moon
  ctx.fillStyle='#fff1ad';ctx.shadowColor='#ffe78a';ctx.shadowBlur=25;
  ctx.beginPath();ctx.arc(W*.82,H*.18,Math.min(W,H)*.055,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  ctx.fillStyle='#102b43';ctx.beginPath();ctx.arc(W*.845,H*.165,Math.min(W,H)*.048,0,Math.PI*2);ctx.fill();

  // subtle portal ring around the moon - hints at the hidden night world, mirroring the whirlpool hint below
  const mr=Math.min(W,H)*.055;
  ctx.save();
  ctx.strokeStyle='rgba(180,200,255,.55)';ctx.lineWidth=1.4;
  for(let k=0;k<2;k++){
    ctx.beginPath();
    ctx.arc(W*.82,H*.18,mr+8+k*7+Math.sin(t*1.3+k)*2,0,Math.PI*2);
    ctx.stroke();
  }
  ctx.restore();

  // clouds
  clouds.forEach(c=>{
    const x=((c.x*W+t*5*c.s)% (W+180))-90,y=c.y*H;
    ctx.fillStyle='rgba(220,247,255,.12)';
    ctx.beginPath();ctx.ellipse(x,y,65*c.s,17*c.s,0,0,Math.PI*2);
    ctx.ellipse(x-35*c.s,y+5,35*c.s,14*c.s,0,0,Math.PI*2);
    ctx.ellipse(x+35*c.s,y+4,42*c.s,15*c.s,0,0,Math.PI*2);ctx.fill();
  });

  // distant hills
  ctx.fillStyle='#315f48';ctx.beginPath();ctx.moveTo(0,H*.64);
  for(let x=0;x<=W;x+=80)ctx.quadraticCurveTo(x+40,H*(.56+.025*Math.sin(x)),x+80,H*.64);
  ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();

  // meadow
  const mg=ctx.createLinearGradient(0,H*.62,0,H);
  mg.addColorStop(0,'#7fc84b');mg.addColorStop(1,'#315e32');ctx.fillStyle=mg;
  ctx.beginPath();ctx.moveTo(0,H*.63);
  for(let x=0;x<=W;x+=40)ctx.quadraticCurveTo(x+20,H*(.60+.015*Math.sin(x*.02)),x+40,H*.63);
  ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();

  // water strip + secret whirlpool
  ctx.fillStyle='#187da2';ctx.beginPath();ctx.moveTo(0,H*.79);
  for(let x=0;x<=W;x+=30)ctx.quadraticCurveTo(x+15,H*(.775+.008*Math.sin(x*.05+t)),x+30,H*.79);
  ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
  const px=W*.18,py=H*.83;
  ctx.strokeStyle='rgba(143,231,255,.8)';ctx.lineWidth=2;
  for(let k=0;k<3;k++){ctx.beginPath();ctx.ellipse(px,py,22+k*7,6+k*2,0,0,Math.PI*2);ctx.stroke()}
  ctx.globalAlpha=.7;ctx.fillStyle='#bff6ff';ctx.font='bold 11px Segoe UI';ctx.textAlign='center';ctx.fillText('?',px,py-22);ctx.globalAlpha=1;

  // foreground grass silhouettes - fixed blades that gently sway, instead of re-randomizing every frame
  ctx.strokeStyle='rgba(20,60,32,.75)';ctx.lineWidth=2;
  grassBlades.forEach(b=>{
    const sway=Math.sin(t*b.swaySpeed+b.swayPhase)*3;
    ctx.beginPath();
    ctx.moveTo(b.x,b.baseY);
    ctx.lineTo(b.x+b.tipXOff+sway,b.baseY+b.tipYOff);
    ctx.stroke();
  });

  requestAnimationFrame(draw);
}
draw();

const pollen=document.getElementById('pollen');
for(let i=0;i<18;i++){
  const p=document.createElement('i');p.className='pollen';
  p.style.left=(35+Math.random()*30)+'%';p.style.top=(42+Math.random()*20)+'%';
  p.style.setProperty('--x',(Math.random()*120-60)+'px');p.style.setProperty('--y',(Math.random()*-110-20)+'px');
  p.style.animationDelay=(Math.random()*2)+'s';pollen.appendChild(p);
}

document.getElementById('splash').addEventListener('pointerdown',()=>{
  const splash = document.getElementById('splash');
  splash.classList.add('fade-out');
  running = false; // stop the canvas draw loop so it doesn't keep running invisibly forever
  setTimeout(() => { location.href = 'igra.html'; }, 650); // nakon izblijeđivanja otvori igru
});
</script>
</body>
</html>
