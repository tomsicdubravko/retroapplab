<!DOCTYPE html>
<html lang="hr">
<head>

<style>
:root{
  --paper:#EEF1F4; --surface:#FFFFFF; --ink:#17212B; --muted:#5A6876; --rule:#D3DAE1; --rule-strong:#AEB9C4;
  --in-bg:#EAF1FB; --in-ink:#1A4A94; --in-focus:#1A4A94; --sum-bg:#F3F5F8; --head-bg:#E3E8EE;
  --ok:#11734F; --ok-bg:#E3F3EC; --err:#B3261E; --err-bg:#FBE9E7; --link:#1A4A94;
  --font:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans",Arial Narrow,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#11161C; --surface:#1A2129; --ink:#E4E9EE; --muted:#97A4B1; --rule:#2C3640; --rule-strong:#44515E;
    --in-bg:#1C2D45; --in-ink:#A9C8F5; --in-focus:#6FA2EE; --sum-bg:#202933; --head-bg:#25303B;
    --ok:#5CCB9A; --ok-bg:#16322A; --err:#F2867D; --err-bg:#3A1F1D; --link:#8FB6F2;
  }
}
:root[data-theme="dark"]{
  --paper:#11161C; --surface:#1A2129; --ink:#E4E9EE; --muted:#97A4B1; --rule:#2C3640; --rule-strong:#44515E;
  --in-bg:#1C2D45; --in-ink:#A9C8F5; --in-focus:#6FA2EE; --sum-bg:#202933; --head-bg:#25303B;
  --ok:#5CCB9A; --ok-bg:#16322A; --err:#F2867D; --err-bg:#3A1F1D; --link:#8FB6F2;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.4;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--rule)}
.bar{max-width:1180px;margin:0 auto;padding:10px 16px 0;display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.who h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.06em;line-height:1.15}
.who .period{margin:2px 0 0;font-family:var(--cond);font-size:15px;font-weight:500;color:var(--ink);letter-spacing:.02em}
.who .firm{margin:3px 0 0;font-size:14px;font-weight:600;color:var(--in-ink)}
.who .firm.empty{font-weight:400;color:var(--muted);font-style:italic}
.who{border-left:4px solid var(--in-ink);padding-left:12px}
.btn{display:inline-flex;align-items:center;gap:7px}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
@media (max-width:640px){ .kontcard{margin-left:0;width:100%} .btn:not(.cta) span{display:none} .btn.cta{margin-left:0} .btn{padding:7px 9px} }
.actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.actions .btn:not(.cta){border-color:transparent;background:none;color:var(--muted);padding:6px 9px}
.actions .btn:not(.cta):hover{background:var(--sum-bg);color:var(--ink)}
.btn.cta{background:#11734F;border-color:#11734F;color:#fff;font-weight:700;padding:9px 16px;margin-left:8px;box-shadow:0 2px 6px rgba(17,115,79,.25);letter-spacing:.01em}
.btn.cta:hover{background:#0d5f41;border-color:#0d5f41}
.btn.cta .ico{width:20px;height:20px}
.btn{border:1px solid var(--rule-strong);background:var(--surface);border-radius:6px;padding:6px 12px;cursor:pointer}
.btn:hover{background:var(--sum-bg)}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,.src:focus-visible{outline:2px solid var(--in-focus);outline-offset:1px}
.status{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;gap:28px;flex-wrap:wrap;align-items:center}
.cards{display:flex;gap:10px;flex-wrap:wrap}
.fig.card{border:1px solid var(--rule);border-radius:10px;background:var(--surface);padding:8px 14px;min-width:150px;cursor:pointer;text-align:left;font:inherit;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.fig.card:hover{border-color:var(--rule-strong);background:var(--sum-bg)}
.fig.card:focus-visible{outline:2px solid var(--in-focus);outline-offset:2px}
.fig.card span{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.fig.card b{font-size:19px}
.fig.card.neg b{color:var(--err)}
.balcard{display:flex;align-items:center;border:1.5px solid var(--rule);border-radius:10px;padding:7px 14px;background:var(--surface);cursor:pointer;text-align:left;font:inherit;color:var(--ink);min-width:170px}
.balcard:hover{background:var(--sum-bg)}
.balcard:focus-visible{outline:2px solid var(--in-focus);outline-offset:2px}
.balcard .klbl{color:var(--muted)}
.balrow{display:flex;align-items:center;gap:8px}
.balcard b{font-size:16px;font-weight:700}
.balcard small{font-size:12px;color:var(--muted);font-family:var(--cond)}
.dot{width:11px;height:11px;border-radius:50%;flex:none}
.balcard.ok .dot{background:var(--ok);box-shadow:0 0 0 3px var(--ok-bg)}
.balcard.ok b{color:var(--ok)}
.balcard.none .dot{background:var(--rule-strong)}
.balcard.none b{color:var(--muted);font-weight:600}
.balcard.bad{border-color:var(--err);background:var(--err-bg)}
.balcard.bad .dot{background:var(--err)}
.balcard.bad b{color:var(--err)}
.kontcard{margin-left:auto;display:flex;align-items:center;gap:12px;border:1.5px solid;border-radius:10px;padding:8px 16px 8px 12px;cursor:pointer;text-align:left;font:inherit;min-width:240px}
.kontcard.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.kontcard.bad{background:var(--err-bg);border-color:var(--err);color:var(--err)}
.kontcard:hover{filter:brightness(.97)}
.kontcard:focus-visible{outline:2px solid var(--in-focus);outline-offset:2px}
.kico{font-size:24px;line-height:1;font-weight:700;width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:currentColor}
.kontcard .kico{color:inherit}
.kontcard.ok .kico{background:var(--ok);color:#fff}
.kontcard.bad .kico{background:var(--err);color:#fff;font-size:17px}
.ktxt{display:flex;flex-direction:column}
.klbl{font-size:11px;font-weight:700;letter-spacing:.08em}
.ktxt b{font-size:16px;font-weight:700;color:inherit}
.ktxt small{font-size:12px;opacity:.85}
.fig{display:flex;flex-direction:column;min-width:120px}
.fig span{font-size:12px;color:var(--muted)}
.fig b{font-family:var(--cond);font-size:20px;font-weight:600}
.fig.ok b{color:var(--ok)} .fig.bad b{color:var(--err)}
.tabs{max-width:1180px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tab{border:1px solid transparent;border-bottom:none;background:none;padding:8px 14px;border-radius:6px 6px 0 0;cursor:pointer;color:var(--muted);white-space:nowrap;font-weight:500}
.tab[aria-selected="true"]{background:var(--paper);border-color:var(--rule);color:var(--ink);position:relative;top:1px}
main{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
section[hidden]{display:none}
h2{font-size:16px;font-weight:600;margin:0 0 4px}
.lead{color:var(--muted);margin:0 0 14px;max-width:72ch}
.sheet{background:var(--surface);border:1px solid var(--rule);border-radius:8px;overflow-x:auto;margin-bottom:20px}
table{border-collapse:collapse;width:100%;min-width:640px}
th{font-size:12px;font-weight:500;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule-strong);background:var(--surface);position:sticky;top:0}
th.n,td.n{text-align:right}
td{padding:3px 10px;border-bottom:1px solid var(--rule);vertical-align:middle}
td.aop{color:var(--muted);text-align:center;width:52px;font-size:12px}
td.v{width:158px}
td.v:last-child{width:200px}
tr.sec td{background:var(--head-bg);font-weight:600;font-size:13px;padding:7px 10px}
tr.sum td{background:var(--sum-bg);font-weight:600}
tr.l1 td.lbl{padding-left:18px} tr.l2 td.lbl{padding-left:32px} tr.l3 td.lbl{padding-left:46px}
input.num,input.txt{width:100%;border:1px solid transparent;background:var(--in-bg);color:var(--in-ink);border-radius:4px;padding:4px 7px;text-align:right}
input.txt{text-align:left}
input.num:hover,input.txt:hover{border-color:var(--rule-strong)}
input.num:focus,input.txt:focus{outline:none;border-color:var(--in-focus);background:var(--surface)}
.calc{display:block;text-align:right;padding:4px 8px}
.calc.text{text-align:left;padding-left:0}
.calc.zero{color:var(--muted)}
.calc.err{color:var(--err)}
.src{display:inline-block;margin-left:6px;font-size:11px;font-weight:500;color:var(--link);background:none;border:none;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.adj{white-space:nowrap;font-size:11.5px;color:var(--muted);display:flex;justify-content:flex-end;align-items:center;gap:6px;margin-top:2px;padding-right:2px}
.basecell .calc{font-weight:600}
input.num.base-in{width:96px;font-size:12px;padding:2px 6px}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px 16px;padding:16px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.form label.wide{grid-column:span 2}
.form input,.form select{border:1px solid var(--rule);background:var(--in-bg);color:var(--in-ink);border-radius:5px;padding:6px 8px;font-size:14px;min-width:0;width:100%}
.form input:focus,.form select:focus{outline:none;border-color:var(--in-focus);background:var(--surface)}
.form .hint{color:var(--muted);font-size:12px}
fieldset{border:none;margin:0;padding:0}
legend{font-weight:600;font-size:14px;padding:14px 16px 0}
.grid2 table{min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:20px}
.note{font-size:12.5px;color:var(--muted);padding:10px 12px;border-top:1px solid var(--rule)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:0 0 14px}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:6px;border:1px solid var(--rule)}
tr.dim td{color:var(--muted)}
tfoot td{font-weight:600;background:var(--sum-bg);border-top:1px solid var(--rule-strong)}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:500}
.drop{display:flex;flex-direction:column;gap:4px;align-items:flex-start;border:2px dashed var(--rule-strong);border-radius:10px;padding:22px 20px;margin:0 0 18px;cursor:pointer;background:var(--surface)}
.drop:hover,.drop.over{border-color:var(--in-focus);background:var(--in-bg)}
.drop span{color:var(--muted);font-size:13px}
.drop:focus-within{outline:2px solid var(--in-focus)}
.btn.primary{background:var(--in-ink);color:var(--surface);border-color:var(--in-ink);font-weight:600}
.btn.primary:hover{opacity:.9;background:var(--in-ink)}
select.tsel{width:100%;border:1px solid var(--rule);background:var(--surface);border-radius:4px;padding:3px 6px;font-size:13px}
tr.warn td{background:var(--err-bg)}
details[open] summary{border-bottom:1px solid var(--rule)}
.pill.bad.warn{background:#FFF4D6;color:#8A5A00}
.okline{margin:4px 0;color:var(--ok);font-weight:600}
.upute{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:6px 22px 18px;max-width:860px;line-height:1.55}
.upute h2{margin:22px 0 6px;font-size:16px}
.upute table{min-width:0;margin:8px 0}
.upute td,.upute th{border-bottom:1px solid var(--rule);padding:6px 8px;vertical-align:top}
.upute th{position:static}
.upute li{margin:3px 0}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.bad{background:var(--err-bg);color:var(--err)}
@media (max-width:640px){ .top{position:static} .form label.wide{grid-column:auto} .fig b{font-size:17px} .status{gap:16px} }
@media print{ .top .actions,.tabs{display:none} .top{position:static} section[hidden]{display:block} input{background:none!important;border:none!important} }
@media (max-width:640px){ .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%} .fig.card{min-width:0;padding:6px 8px} .fig.card b{font-size:14px} .fig.card span{font-size:9.5px;letter-spacing:.04em} .balcard{width:100%} .status{gap:10px} }
.tabs::-webkit-scrollbar{display:none}
.tabs{-ms-overflow-style:none;scroll-behavior:smooth}
#tab-exp{color:#11734F;font-weight:700}
@media (max-width:640px){ .tabs{-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent);padding-right:24px} .tab{padding:8px 11px} }
#gate{position:fixed;inset:0;z-index:100;background:rgba(17,22,28,.55);display:grid;place-items:center;padding:16px;backdrop-filter:blur(3px)}
#gate[hidden]{display:none}
.gatecard{background:var(--surface);border-radius:14px;padding:26px 28px;width:min(400px,100%);display:flex;flex-direction:column;gap:10px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.gatecard img{align-self:center;border-radius:14px}
.gatecard h2{text-align:center;font-size:20px;margin:0}
.gatecard .lead{text-align:center;margin:0}
.gatecard label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.gatecard input{border:1px solid var(--rule);background:var(--in-bg);color:var(--ink);border-radius:6px;padding:9px 10px;font-size:15px}
.gatecard input:focus{outline:none;border-color:var(--in-focus);background:var(--surface)}
.gatecard .btn.primary{padding:10px;font-size:15px;justify-content:center}
.gatecard .src{align-self:center}
.installbtn{justify-content:center}
.installbtn[hidden],.gatecard [hidden]{display:none}
.lic{margin:4px 0 0;font-size:12px;color:var(--muted)}
.lic:empty{display:none}
.lic.warn{color:#8A5A00;font-weight:600}
.lic.demo{color:#8A5A00}
</style>

<header class="top">
  <div class="bar">
    <div class="who"><h1 id="hName">ZAVRŠNI RAČUN</h1><p class="period" id="hPeriod"></p><p class="firm" id="hSub"></p><p class="lic" id="hLic"></p></div>
    <div class="actions">
      <button class="btn" id="btnSave" type="button" title="Spremi"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h11l3 3v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M7 3v5h8V3"/><rect x="7" y="13" width="10" height="8" rx="1"/></svg><span>Spremi</span></button>
      <button class="btn" id="btnLoad" type="button" title="Učitaj"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v1"/><path d="M3 7v11a2 2 0 0 0 2 2h12.5a2 2 0 0 0 1.9-1.4L22 12H7.5a2 2 0 0 0-1.9 1.4L3 20"/></svg><span>Učitaj</span></button>
      <input type="file" id="loadFile" accept=".json,application/json" hidden>
      <button class="btn" id="btnPrint" type="button" title="Ispiši"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 14h12v7H6z"/></svg><span>Ispiši</span></button>
      <button class="btn" id="btnNew" type="button" title="Novi obrazac"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M12 12v6M9 15h6"/></svg><span>Novi obrazac</span></button>
      <button class="btn cta" id="btnFina" type="button" title="Izvezi u FINA-in GFI-POD obrazac"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M12 11v7M9 15l3 3 3-3"/></svg><span>Izvezi FINA GFI</span></button>
    </div>
  </div>
  <div class="status" id="status"></div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</header>

<script>
// Mini Excel formula engine: parses and evaluates the subset of Excel used in the workbook.
const Engine = (() => {
  class XLErr extends Error { constructor(code) { super(code); this.code = code; } }
  const ID = 'A-Za-zČĆŽŠĐčćžšđ_';
  const reSheet = new RegExp(`^([${ID}][${ID}0-9]*)!`);
  const reCell = /^([A-Z]{1,3})([0-9]+)/;
  const reNum = /^[0-9]+(\.[0-9]+)?([eE][+-]?[0-9]+)?/;
  const reFn = new RegExp(`^([${ID}][${ID}0-9.]*)\\(`);

  function colNum(c) { let n = 0; for (const ch of c) n = n * 26 + ch.charCodeAt(0) - 64; return n; }
  function colStr(n) { let s = ''; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = (n - m - 1) / 26; } return s; }

  function tokenize(src) {
    const t = []; let i = 0;
    while (i < src.length) {
      const ch = src[i], rest = src.slice(i);
      if (ch === ' ') { i++; continue; }
      if (ch === '"') {
        let j = i + 1, v = '';
        while (j < src.length) { if (src[j] === '"') { if (src[j + 1] === '"') { v += '"'; j += 2; continue; } break; } v += src[j++]; }
        t.push({ t: 'str', v }); i = j + 1; continue;
      }
      let m;
      if ((m = rest.match(reFn)) && !rest.match(/^[A-Z]{1,3}[0-9]+\(/)) { t.push({ t: 'fn', v: m[1].toUpperCase() }); i += m[0].length; continue; }
      let sheet = null, consumed = 0;
      if ((m = rest.match(reSheet))) { sheet = m[1]; consumed = m[0].length; }
      const r2 = rest.slice(consumed);
      if ((m = r2.match(reCell))) {
        let len = consumed + m[0].length, a = m[0], b = null;
        const after = rest.slice(len);
        const m2 = after.match(/^:([A-Z]{1,3}[0-9]+)/);
        if (m2) { b = m2[1]; len += m2[0].length; }
        t.push({ t: 'ref', sheet, a, b }); i += len; continue;
      }
      if ((m = rest.match(/^#(REF!|N\/A|VALUE!|DIV\/0!|NAME\?)/))) { t.push({ t: 'errlit', v: m[0] }); i += m[0].length; continue; }
      if ((m = rest.match(reNum))) { t.push({ t: 'num', v: parseFloat(m[0]) }); i += m[0].length; continue; }
      const two = src.substr(i, 2);
      if (['<>', '<=', '>='].includes(two)) { t.push({ t: 'op', v: two }); i += 2; continue; }
      if ('+-*/^&=<>(),'.includes(ch)) { t.push({ t: 'op', v: ch }); i++; continue; }
      throw new Error('Nepoznat znak u formuli: ' + src.slice(i));
    }
    return t;
  }

  function parse(src, sheet) {
    const toks = tokenize(src.replace(/^=/, '')); let p = 0;
    const peek = () => toks[p], next = () => toks[p++];
    const isOp = (v) => peek() && peek().t === 'op' && peek().v === v;
    function cmp() {
      let l = cat();
      while (peek() && peek().t === 'op' && ['=', '<>', '<', '>', '<=', '>='].includes(peek().v)) { const o = next().v; l = { k: 'bin', o, l, r: cat() }; }
      return l;
    }
    function cat() { let l = add(); while (isOp('&')) { next(); l = { k: 'bin', o: '&', l, r: add() }; } return l; }
    function add() { let l = mul(); while (isOp('+') || isOp('-')) { const o = next().v; l = { k: 'bin', o, l, r: mul() }; } return l; }
    function mul() { let l = pow(); while (isOp('*') || isOp('/')) { const o = next().v; l = { k: 'bin', o, l, r: pow() }; } return l; }
    function pow() { let l = un(); while (isOp('^')) { next(); l = { k: 'bin', o: '^', l, r: un() }; } return l; }
    function un() {

 skupine*"}, {"r": 73, "no": "7.", "label": "Umanjenje članarine na područjima općina i gradova - potpomognutim područjimma IV. razvojne skupine*"}, {"r": 74, "no": "8.", "label": "UKUPNA UMANJENJA NA POPPOMOGNITIM PODRUČJIMA - članak 8. stavak 4. Zakona (r. br. 4. + r. br. 5. + r. br. 6. + r. br. 7.)"}, {"r": 75, "no": "9.", "label": "OBRAČUNANI IZNOS NAKON UMANJENJA (r. br. 3. - r. br. 8.)"}, {"r": 76, "no": "10.", "label": "UPLAĆENI PREDUJAM"}, {"r": 77, "no": "11.", "label": "RAZLIKA ZA UPLATU (r. br. 9. - r. br. 10.)"}, {"r": 78, "no": "12.", "label": "RAZLIKA ZA POVRAT (r. br. 10. - r. br. 9.)"}, {"r": 79, "no": "13.", "label": "MJESEČNI PREDUJAM ZA NAREDNO RAZDOBLJE - članak 10. stavak 1. Zakona (r. br. 9. / broj mjeseci)"}], "kont": [{"r": 12, "text": "Pogreška signalizira da Datum Od i/ili Datum Do izvještajnog razdoblja nisu popunjeni ili nisu ispravno popunjeni."}, {"r": 13, "text": "Od 2025. godine je u primjeni novi NKD2025 pa je obrazac prilagođen novim djelatnostima. U ovoj verziji nije moguće predavati obrazac za starije godine od 2025. Za 2024. godinu objavljena je verzija 5.x, a za ranije godine 4.x."}, {"r": 14, "text": "Pogreška signalizira da oznaka primjene MSFI/HSFI, Vrste poslovnog subjekta ili oznaka poslovne aktivnosti nije ispravno popunjena."}, {"r": 15, "text": "Pogreška signalizira da Vrsta izvještaja nije popunjena ili je pogrešno popunjena"}, {"r": 16, "text": "Pogreška signalizira da oznaka konsolidacije nije upisana (DA ili NE) ili da je označeno da je izvještaj konsolidiran, a vrsta poslovnog subjekta je takva da ne može imati konsolidaciju. Konsolidirani izvještaj se ne predaje za statističke potrebe, može imati samo šifru svrhe predaje 2 (javna objava)."}, {"r": 17, "text": "Pogreška signalizira da Šifra svrhe predaje nije popunjena ili je pogrešno popunjena. Kontrola također javlja grešku ako je odabrana javna objava za vrstu subjekta koji ne može imati javnu objavu. U tom slučaju ispravite svrhu ili ispravite vrstu subjekta."}, {"r": 18, "text": "Ako se predaje izvještaj u likvidaciji (vrsta izvještaja 30) - nije moguće predaja izvještaja sa svrhom predaje 3 (statistika i javna objava). Za društva u likvidaciji za statističke i druge potrebe financijski izvještaj predaje se za svaku kalendarsku godinu, a u svrhu javne objave vrsta izvještaja 30 predaje se za razdoblje od datuma početka do datuma kraja likvidacije - bez obzira koliko dugo ona trajala. S obzirom da ta dva razdoblja ne mogu po definiciji biti ista - nije moguća predaja izvještaja sa svrhom 3. Isto tako, za izvještaj u likvidaciji koji se predaje u svrhu javne objave, s obzirom da stupac \"tekuća\" godina predstavlja ukupno razdoblje likvidacije, a ne samo tekuću godinu - podaci za prehtodnu godinu se ne unose pa će u slučaju da kod takvog izvještaja popunite prethodnu godinu kontrola javiti pogrešku. S obzirom da likvidacija u pravilu ne počinje 1.1. i ne završava 31.12. kontrola će upozoriti ako je takav datum početka ili datum kraja razdoblja kod javne objave."}, {"r": 19, "text": "Pogreška signalizira da Oznaka revizije i/ili OIB revizora nisu popunjeni ili su pogrešno popunjeni (ako je izvještaj revidiran mora biti popunjen i OIB revizora, a ako nije revidiran polje OIB revizora mora biti prazan). Ako je predaja samo u statističke svrhe, ne predaje se revidiran izvještaj pa se u oznaku revizije i pored Revizorskog izvješća na popisu dokumentacije obavezno upisuje \"NE\"."}, {"r": 20, "text": "Pogreška signalizira da Mišljenje revizora nije popunjeno ili je pogrešno popunjeno (ako je izvještaj revidiran mora biti popunjeno oznakom 2,3,4 ili 5, a ako nije revidiran polje Mišljenje revizora treba biti popunjeno oznakom 1)."}, {"r": 21, "text": "Pogreška signalizira da OIB nije upisan ili je pogrešna duljina OIB-a."}, {"r": 22, "text": "Pogreška signalizira da Matični broj nije upisan ili je pogrešan. Moguće je da je pogrešno odabrana i Vrsta poslovnog subjekta (privatne osobe bez djelatnosti nemaju matični broj, obrtnici moraju imati matični koji počinje s brojem 9, slobodna zanimanja s brojem 8, a OPG-ovi s brojem 5."}, {"r": 23, "text": "Pogreška signalizira da Matični broj subjekta nije upisan ili je pogrešno označena Vrsta poslovnog subjekta (ako je Trgovački sud registarsko tijelo mora biti upisan u suprotnom polje mora biti prazno)"}, {"r": 24, "text": "Pogreška signalizira da Naziv poslovnog subjekta nije popunjen ili je pogrešno popunjen"}, {"r": 25, "text": "Pogreška signalizira da Poštanski broj i/ili mjesto nisu popunjeni ili su pogrešno popunjeni. Broj pošte je zasebno polje i upisuje se tamo, ne smije se upisivati u naziv naselja."}, {"r": 26, "text": "Pogreška signalizira da adresa (ulica i broj) ili telefon poduzetnika nisu popunjeni ili nisu ispravno popunjeni."}, {"r": 27, "text": "Pogreška signalizira da adresa e-pošte obveznika nije popunjena ili je pogrešno popunjena, a to znači da sadrži razmak ili neki specijalni znak koji adresa e-pošte ne bi smjela sadržavati. U polje adrese e-pošte upišite samo jednu adresu."}, {"r": 28, "text": "Pogreška signalizira da šifra grada/općine nije upisana ili je pogrešno upisana"}, {"r": 29, "text": "Pogreška signalizira da šifra Statusa autonomnosti nije upisana ili je upisana nepostojeća šifra."}, {"r": 30, "text": "Kontrola uspoređuje vrstu subjekta u zaglavlju referentne stranice i šifru autonomnosti. Samo trgovačka društva mogu imati autonomnost različitu od 10. Obrtnici, slobodna zanimanja, zadruge, ustanove i ostali obveznici poreza na dobit mogu imati samo šifru autonomnosti 10. Ako ova kontrola javlja pogrešku pogrešno je upisana vrstu subjekta ili šifra autonomnosti."}, {"r": 31, "text": "Kontrola provjerava da li je za ovisna društva pod kontrolom matice izvan RH (šifra autonomnosti 3 ili 6) upisana postojeća šifra zemlje sjedišta nadređenog društva. Isto tako kontrola javlja pogrešku ako je šifra autonomnosti drugačija od 3 ili 6, a upisana je šifra zemlje sjedišta nadređenog društva."}, {"r": 32, "text": "Matični broj nadređenog društva (odnosno dostupni identifikator za nadređena društva iz inozemstva) može biti upisan samo kod šifri autonomnosti 2, 3, 5 i 6. Kontrola javlja pogrešku ako je matični broj nadređenog društva upisan, a šifra autonomnosti je različita od ove četiri. Isto tako, kontrola javlja pogrešku ako je šifra autonomnosti jedna od navedenih, a matični broj nadređenog društva nije upisan. Matični broj nadređenog društva (ako je upisan) mora biti različit od matičnog broja poslovnog subjekta za koji se izvještaj predaje."}, {"r": 33, "text": "Ova kontrola javlja pogrešku ako je izvještaj konsolidiran, a upisan je oznaka autonomnosti uz koju se ne popunjava konsolidirani izvještaj (obveznik nije matično društvo u grupi)."}, {"r": 34, "text": "Status autonomnosti različit od 10 mogu imati samo poduzetnici koji su obveznici javne objave. Svi ostali obveznici poreza na dobit (obrtnici, slobodna zanimanja, OPG-ovi, zadruge, ustanove...) moraju imati status autonomnosti 10. Pogreška na ovoj kontroli znači da je upisana ili pogrešna šifra autonomnosti ili je odabrana pogrešna vrsta poslovnog subjekta."}, {"r": 35, "text": "Ova pogreška signalizira da je upisana nepostojeća šifra države nadređenog (matičnog) društva ako je upisana."}, {"r": 36, "text": "Pogreška signalizira da šifra djelatnosti nije upisana ili je upisana pogrešna (ili je upisana za vrstu subjekta koji je nema). Samo fizičke osobe bez djelatnosti mogu imati šifru \"00000\", a takvi subjekti ne mogu imati matični broj ili MBS stoga u polje matičnog broja upisuju osam nula (00000000). Isto tako sve ostale vrste subjekata moraju imati upisanu postojeću šifru djelatnosti različitu od \"00000\"."}, {"r": 37, "text": "Pogreška signalizira da oznaka veličine nije upisana ili je upisana nepostojeća šifra."}, {"r": 38, "text": "Pogreška signalizira da oznaka vlasništva nije upisana ili je upisana nepostojeća šifra."}, {"r": 39, "text": "Obrtnici, slobodna zanimanja, te ostali obveznici poreza na dobit ne mogu imati državno vlasništvo. Pogreška signalizira da je upisana oznaka državnog vlasništva, a odabrana je vrsta subjekta koja takvo vlasništvo ne može imati. Ispravite šifru vlasništva ili vrstu subjekta na referentnoj stranici."}, {"r": 40, "text": "Pogreška signalizira da postotak domaćeg i stranog kapitala nije dobro popunjen. Zbrojno moraju dati 100 i moraju biti upisani cijeli brojevi."}, {"r": 41, "text": "Pogreška signalizira da je broj mjeseci poslovanja izvan granica dopuštenog ili nije upisan za onaj stupac podataka za koji su upisani neki podaci u Bilanci."}, {"r": 42, "text": "Pogreška signalizira da nije popunjen ili je pogrešno popunjen podataka o osobi za kontaktiranje, telefonu, adresa e-pošte. Kod adrese e-pošte osobe za kontakt provjerava se ispravnost adrese (ne smije imati razmake, slova čžšđ, specijalne znakove itd.)"}, {"r": 43, "text": "Matični broj i naziv knjigovodstvenog servisa unose se samo ako je vanjski servis sastavio financijski izvještaj, ako je izvještaj sastavljen u računovodstvu obveznika, ova polja se ne popunjavaju. Ako postoji servis, adresa e-pošte obveznika i e-pošte za kontakt ne može biti isti. Obje adrese e-pošte su obvezne zbog komunikacije i zbog slanja potvrde o predaji putem web-a."}, {"r": 44, "text": "Ime i prezime osobe ovlaštene za zastupanje mora biti upisano u za to predviđeno polje na Referentnoj stranici."}, {"r": 46, "text": "Pozicije ukupno aktiva (AOP 065) i ukupno pasiva (AOP 126) moraju biti jednake uz dopušteno odstupanje od 0,14€ zbog zaokruživanja i veće od nule u svakoj godini u kojoj je poslovni subjekt poslovao, tj. gdje je broj mjeseci poslovanja veći od nule. Ukupno aktiva i ukupno pasiva mogu biti nula samo kod završne likvidacijske bilance za javnu objavu (svrha predaje 2 i vrsta izvještaja 30) ili ako je označeno da se tvrka briiše po skraćenom postupku bez likvidacije (Polje \"Subjekt se briše sa zadnjim danom razdoblja izvještavanja.."}, {"r": 47, "text": "Pozicije izvanbilančni zapisi u aktivi (AOP 066) moraju biti jednaki izvanbilančnim zapisima u pasivi (AOP 127) u oba stupca podataka - tekuća godina i prethodna godina. Zbog zaokruživanja iznosa, kontrola dozvoljava razliku od 0,14€."}, {"r": 48, "text": "Stavka Dobit poslovne godine (AOP 088) i Gubitak poslovne godine (AOP 089) ne mogu biti istovremeno popunjene u stupcu prethodne ili tekuće godine."}, {"r": 49, "text": "Stavka Dobit poslovne godine (AOP 088) u i Gubitak poslovne godine (AOP 089) u Bilanci moraju biti jednake stavkama Dobit razdoblja (AOP 187) i Gubitak razdoblja (AOP 188) u Računu dobiti i gubitka. Iznimka su obveznici primjene MSFI-a koji su imali prekinuto poslovanje. Kod njih vrijedi da AOP 087 mora biti jednak AOP-u 200, a AOP 089 mora biti jednak AOP-u 201. Zbog zaokruživanja iznosa dopušteno je odstupanje od 0,14€. Ova kontrola ne vrijedi kod konsolidiranih izvještaja."}, {"r": 50, "text": "Kod obveznika organizacijskog oblika d.d., d.o.o ili j.d.o.o. AOP oznaka 068 mora biti veća od nule za svaki stupac u kojem je broj mjeseci poslovanja veći od nula (za godine u kojima je subjekt poslovao). Ako ova kontrola javlja pogrešku, moguće je da je krivo označena vrsta obveznika na Referentnoj stranici ili podaci nisu upisani."}, {"r": 51, "text": "AOP 090 u Bilanci se popunjava samo u konsolidiranom izvještaju. Kontrola javlja pogrešku ako je ova AOP oznaka popunjena, a izvještaj nije konsolidiran, a upozorenje ako izvještaj jeste konsolidiran, a ova stavka je jednaka nuli. Provjeravaju se podaci u oba stupca podataka ako je u oba broj mjeseci poslovanja veći od nule."}, {"r": 52, "text": "=\"Oznaka veličine može biti: 1-mikro, 2-mali, 3-srednji i 4-veliki. Ova kontrola javlja pogrešku ako se izračunata i upisana veličina ne slažu. \"&\"Uvjeti veličine za konsolidirane grupe su isti kao za pojedinačne izvještaje, razlika je samo u tome da konsolidirana grupa po definiciji ne može imati veličinu mikro.\"&\" Ako izračunata veličina nije jednaka upisanoj ili oznaka veličine nije upisana u opće podatke ova kontrola javlja pogrešku. Prema upisanim podacima, izračunata veličina je \"&N52&IF(OR(S3=\"\",S3=\"\"),\", ali u opće podatke veličina nije ni upisana.\",\", a upisana veličina je \"&S3&\".\")"}, {"r": 53, "text": "Samo neaktivni poduzetnik može imati nepopunjen RDG i PodDop za stupac prethodne ili tekuće godine, a istovremeno imati broj mjeseci poslovanja veći od nule u istom tom stupcu. Aktivni poduzetnik mora imati podatke u svakom stupcu u kojem je broj mjeseci poslovanja veći od nule. Ako obveznik ima podatke u RDG-u i/ili Dodatnim podacima, ne može biti poslovno neaktivan."}, {"r": 54, "text": "Pogreška u ovoj kontroli signalizira da je obveznik uz izvještaj obvezan predati i revizorsko izvješće jer je obveznik revizije. Kontrola upozorava ako je označeno da je poduzetnik podnio revizorsko izvješće a nije obveznik što je dopušteno iz razloga što može biti obveznik iz nekih razloga koji se ne odnose na ovaj izvještaj (npr. obveznik od državnog interesa). Revizorsko izvješće obavezno je uz vrste izvještaja 10 i 11."}, {"r": 55, "text": "Samo vrste izvještaja 10, 11, 20 i 30 mogu biti konsolidirane. Kontrola javlja pogrešku ako je označeno da je neka druga vrsta izvještaja konsolidirana. Konsolidirani izvještaj može se predati samo za javnu objavu."}, {"r": 56, "text": "Kod obveznika koji imaju šifru autonomnosti 1 ne smiju biti popunjene AOP oznake RDG-a koje se odnose na pozicije vezane uz grupu, tj. AOP oznake: 129, 132, 158, 160, 161, 162, 169 i 170 u stupcu tekućeg razdoblja."}, {"r": 57, "text": "Kod obveznika koji imaju šifru autonomnosti 1 ne smiju biti popunjene AOP oznake Dodatnih podataka koje se odnose na pozicije vezane uz grupu, tj. AOP oznake: 242, 245, 263 i 298 u stupcu tekućeg razdoblja."}, {"r": 58, "text": "Broj zaposlenih ne može biti veći od 30.000 (u konsolidaciji 65.000). Isto tako, kontrola upozorava ako je broj zaposlenih u bilo kojem polju veći od 1000."}, {"r": 59, "text": "U Bilanci samo AOP oznake 067, 069 do 084, 087 i 090 mogu biti negativne. Kontrola javlja pogrešku ako je bilo koja druga AOP oznaka osim ovih negativna."}, {"r": 60, "text": "U Računu dobiti i gubitka samo AOP oznake 135, 146 do 155, 174, 182, 185, 186, 189, 192, 195, 198, 199, 202 do 229 mogu biti negativne. Kontrola javlja pogrešku ako je bilo koja druga AOP oznaka negativna."}, {"r": 61, "text": "U Izvještaju o novčanim tokovima po indirektnoj metodi AOP oznake 003, 007, 021 do 027, 035 do 039, 049 i 050 mogu biti nula ili pozitivne. Kontrola će javiti pogrešku ako je u neku od ovih AOP oznaka upisan negativan podatak."}, {"r": 62, "text": "U Izvještaju o novčanim tokovima po indirektnoj metodi AOP oznake 006, 018, 028 do 030, 032, 040 do 045 mogu biti nula ili negativne. Kontrola javlja pogrešku ako je u neku od ovih AOP oznaka upisana pozitivna vrijednost."}, {"r": 63, "text": "U Izvještaju o novčanim tokovima po direktnoj metodi AOP oznake 001 do 006, 015 do 021, 029 do 033, 043 i 044 mogu biti nula ili pozitivne. Kontrola će javiti pogrešku ako je u neku od ovih AOP oznaka upisan negativan podatak."}, {"r": 64, "text": "U Izvještaju o novčanim tokovima po direktnoj metodi AOP oznake 007 do 013, 022 do 024, 026, 027 i 034 do 039 mogu biti nula ili negativne. Kontrola će javiti pogrešku ako je u neku od ovih AOP oznaka upisan pozitivan podatak."}, {"r": 65, "text": "Ako je izvještaj konsolidiran, AOP oznaka 186 u obrascu Račun dobiti i gubitka mora biti jednaka AOP oznaci 202 uz dopušteno odstupanje od 0,14€ zbog zaokruživanja iznosa. Kod obveznika MSFI-a koji su imali prekinuto poslovanje AOP 199 mora biti jednak AOP oznaci 202 uz dopušteno odstupanje od 0,14€."}, {"r": 66, "text": "AOP oznaka 186 u obrascu Račun dobiti i gubitka mora biti jednaka AOP oznaci 205 kod obveznika primjene MSFI-a, uz dopušteno odstupanje od 0,14€ zbog zaokruživanja iznosa. Ako je subjekt obveznik MSFI-a i ima prekinuto poslovanje tada AOP 199 mora biti jednak AOP-u 205 uz dopušteno odstupanje od 0,14€."}, {"r": 67, "text": "AOP oznaka 226 u obrascu Račun dobiti i gubitka mora biti jednaka AOP oznaci 227 u konsolidiranom izvještaju obveznika primjene MSFI-a, uz dopušteno odstupanje od 0,14€ zbog zaokruživanja iznosa."}, {"r": 68, "text": "U konsolidiranom izvještaju svi obveznici moraju imati popunjenu AOP oznaku 202 (a obveznici primjene MSFI standarda i AOP 227) u stupcu svake godine u kojoj je poslovni subjekt poslovao (broj mjeseci poslovanja veći od nula)."}, {"r": 69, "text": "Svi obveznici primjene MSFI-a moraju popuniti i izvještaj o Sveobuhvatnoj dobiti tj. moraju popuniti AOP oznake 205 do 226. Obveznici primjene HSFI-a ne mogu popuniti ovaj izvještaj."}, {"r": 70, "text": "Veliki poduzetnici su obveznici primjene MSFI-a, ne mogu odabrati primjenu HSFI-a na Referentnoj stranici, osim ako je konsolidirani izještaj, tada i za izvještaj velike grupe može označiti i HSFI."}, {"r": 71, "text": "Podatke koji se odnose na prekinuto poslovanje mogu popuniti samo obveznici primjene MSFI-a. Ova pogreška se javlja ako je obveznik primjene HSFI-a popunio bilo koju od AOP oznaka 189 do 201."}, {"r": 72, "text": "Ako je popunjen izvještaj o novčanim tokovima po indirektnoj metodi tada AOP oznaka 001 mora biti jednaka AOP oznaci 182 u Računu dobiti i gubitka, a AOP oznaka 003 mora biti jednaka AOP oznaci 144 u Računu dobiti i gubitka. Dopuštena je razlika od 0,14€ zbog zaokruživanja iznosa. Kontrola javlja pogrešku ako je razlika u bilo kojem stupcu veća od dopuštene."}, {"r": 73, "text": "Ako je obrazac Promjene Kapitala popunjen, vrijednost upisanih podataka u obrascu Promjene kapitala mora i u prethodnoj i u tekućoj godini odgovarati istovrsnim pozicijama u Bilanci. U obrascu Promjene kapitala AOP oznaka 24 za podatke iz stupca prethodne godine, a AOP 51 za podatke iz stupca tekuće godine stupci 4 do 16, moraju odgovarati AOP oznakama Bilance (redom): 068, 069, 071, 072, 073, 074, 075, 076, 078, 079, 080, 081, 082, 083, 084, 087 a stupac 21 mora odgovarati AOP oznaci 090. Dopušteno je odstupanje od 0,14€ zbog zaokruživanja."}, {"r": 74, "text": "Ni jedan iznos u dodatnim podacima ne može biti negativan. Iznimno, na AOP oznakama 282 do 284 moguć je i negativan iznos. U slučajnu negativnog iznosa na ovim AOP oznakama kontrola će javiti upozorenje, a u slučaju negativnog iznosa na bilo kojem drugom AOP-u u Dodatnim podacima kontrola javlja pogrešku jer negativni iznosi nisu dopušteni."}, {"r": 76, "text": "Prihod od posredništva (provizija od posredovanja), AOP 246 mora biti manji ili jednak stavci Prihod od trgovine (prodaje roba i usluga nabavljenih isključivo za daljnju prodaju i trgovačkih usluga) - ukupni, AOP 244."}, {"r": 77, "text": "Prihod od građevinske djelatnosti kao podugovaratelj (podizvođač) (AOP 249) mora biti manji ili jednak zbroju stavki Prihod od građevinske djelatnosti - radova na zgradama (AOP 247) + Prihod od građevinske djelatnosti - radova na ostalim građevinama (AOP 248)."}, {"r": 78, "text": "Zbroj AOP oznaka 243+244+247+249+250 do 253 (prihodi po djelatnostima) mora biti jednak zbroju ukupnih prihoda od prodaje (AOP 129+130). U iznimnim slučajevima zbroj prihoda po djelatnosti može biti i veći. Kontrola javlja pogrešku ako je zbroj prihoda po djelatnosti manji od prihoda od prodaje, a upozorenje ako je veći. Kontrola zanemaruje razliku od 0,14€ zbog zaokruživanja."}, {"r": 79, "text": "AOP oznaka 260 mora biti manja ili jednaka AOP oznaci 253."}, {"r": 80, "text": "Ako su dodatni podaci popunjeni, zbroj AOP oznaka 254+255 mora biti jednak zbroju AOP oznaka 129+130 u RDG-u uz dopušteno odstupanje od 0,14€."}, {"r": 81, "text": "AOP 280 mora biti manji ili jednak AOP-u 279."}, {"r": 82, "text": "AOP 242 ne smije biti veći od AOP oznake 129."}, {"r": 83, "text": "AOP 245 ne smije biti veći od AOP oznake 244."}, {"r": 84, "text": "AOP 245 ne smije biti veći od AOP oznake 242."}, {"r": 85, "text": "AOP 256 ne smije biti veći od AOP oznake 131."}, {"r": 86, "text": "AOP 257 ne smije biti veći od AOP oznake 132."}, {"r": 87, "text": "AOP 259 ne smije biti veći od AOP oznake 258."}, {"r": 88, "text": "AOP 263 ne smije biti veći od AOP oznake 138."}, {"r": 89, "text": "AOP 275 ne smije biti veći od AOP oznake 274."}, {"r": 90, "text": "AOP 286 ne smije biti veći od AOP oznake 157."}, {"r": 91, "text": "AOP 289 ne smije biti veći od AOP oznake 168."}, {"r": 92, "text": "AOP 296 ne smije biti veći od AOP oznake 290."}, {"r": 93, "text": "Troškovi energije (AOP 264) trebali bi biti veći od nule ako je poslovni subjekt aktivan."}, {"r": 94, "text": "Tekući izdaci za odvoz i zbrinjavanje otpada, odvodnju i tretman otpadnih voda te ostali tekući izdaci za zaštitu okoliša (AOP 265) trebali bi biti veći od nule."}, {"r": 95, "text": "Iznos na stavci Prihodi od subvencija-ukupni (AOP 258), u pravilu ne bi smio biti veći od zbroja AOP oznaka 132 + 133."}, {"r": 96, "text": "Troškovi robe i usluga nabavljenih za daljnju prodaju, a uključenih u vlastite proizvode i/ili usluge (AOP 266) ne bi smjeli biti veći od zbroja prihoda svih djelatnosti (osim prihoda od trgovine - AOP 244). Kontrola upozorava ako je AOP 266 veći od zbroja AOP-a 243 + 247 + 248 + 250 do 253."}, {"r": 97, "text": "Troškovi robe i usluga nabavljenih za daljnju prodaju, a uključenih u vlastite proizvode i/ili usluge (AOP 266) trebali bi biti manji ili jednaki AOP oznaci 138."}, {"r": 98, "text": "Kontrola upozorenja na broj zaposlenih upozorava ako je promjena broja zaposlenih iz godine u godinu neuobičajeno velika ili ako je razlika između broja zaposlenih prema satima rada i prosjeka broja zaposlenih veća od 20%. Ako se javi ovo upozorenje, provjerite upisane podatke jer postoji mogućnost da je broj zaposlenih u nekom polju pogrešno upisan."}, {"r": 99, "text": "Kontrola broja neplaćenih osoba upozorava ako je broj neplaćenih osoba neuobičajeno velik (veći od 3 i veći od 10% prosjeka broja zaposlenih na referentnoj stranici). Provjerite upisani broj neplaćenih osoba pod AOP oznakom 299."}, {"r": 100, "text": "Porezi koji ne ovise o dobitku i pristojbe (AOP 276) trebali bi biti veći od nule."}, {"r": 101, "text": "AOP 297 mora biti manji ili jednak AOP oznaci 290 osim u iznimnim situacijama. Ako se kontrola javlja, provjerite upisane podatke pod navedenim AOP oznakama."}, {"r": 102, "text": "AOP 298 mora biti manji ili jednak sumi AOP oznaka 290 i 295 osim u iznimnim situacijama. Ako se kontrola javlja, provjerite upisane podatke pod navedenim AOP oznakama."}, {"r": 103, "text": "Poslovni subjekt koji je u stavci Status autonomnosti odabrao 2, 3, 5, 6 ili 7, (član grupe), trebao bi imati neki od poslovnih prihoda ostvaren unutar grupe (AOP 129 ili 132). Ako zaista nisu realizirani poslovni prihodi unutar grupe kontrolu zanemarite."}, {"r": 104, "text": "Ako su dodatni podaci popunjeni, zbroj AOP oznaka 231 do 233 trebao bi biti manji ili jednak zbroju AOP oznaka 023+026+028+030+056+059+061+062."}, {"r": 105, "text": "Ako su dodatni podaci popunjeni, zbroj AOP oznaka 234 do 236 trebao bi biti manji ili jednak zbroju AOP oznaka 031+046+125."}, {"r": 106, "text": "Ako su dodatni podaci popunjeni, zbroj AOP oznaka 237 do 239 trebao bi biti manji ili jednak zbroju AOP oznaka 100+102+103+104+112+114+115+116."}, {"r": 107, "text": "Ako su dodatni podaci popunjeni, zbroj AOP oznaka 240 i 241 trebao bi biti manji ili jednak zbroju AOP oznaka 064+105+106+117+118."}, {"r": 108, "text": "Ako su Dodatni podaci popunjeni, Prihodi od prodaje s poduzetnicima unutar grupe, rezidentima RH, AOP 242 moraju biti manji ili jednaki stavci Prihodi od prodaje u zemlji, AOP 254. Ako je iznos na AOP poziciji 242 veći - javlja se pogreška."}, {"r": 109, "text": "Ako su Dodatni podaci popunjeni, Prihodi od prodaje unutar grupe ostvareni s nerezidentima RH (razlika AOP oznaka 129 i 242) moraju biti manji ili jednaki stavci Prihodi od prodaje u inozemstvu, AOP 255."}, {"r": 112, "text": "Bilanca i Račun dobiti i gubitka predaju se u svim slučajevima. Podaci moraju biti popunjeni u onim stupcima u kojima je broj mjeseci poslovanja veći od nule. Izuzetak su poduzetnici koji nisu bili poslovno aktivni. Oni na Referentnoj stranici upisuju broj mjeseci poslovanja, ali moraju označiti da su bili poslovno neaktivni te tada mogu Račun dobiti i gubitka imati prazan i za stupac u kojem je broj mjeseci poslovanja veći od nule, ali se smatra kao da je popunjen."}, {"r": 113, "text": "Obrazac Dodatni podaci obavezno se popunjava ako se izvještaj predaje za statističke svrhe ili istovremeno za statističke svrhe i za javnu objavu. Dodatni podaci se popunjavaju uz vrste izvještaja 10, 11, 20, 30 i 40. Obveznici koji su na referentnoj stranici označili da su poslovno neaktivni ne moraju popuniti dodatne podatke. U tom će slučaju kontrola upozoriti da su Dodatni podaci prazni. Kontrola javlja pogrešku ako obrazac Dodatni podaci nije popunjeni kada je predaja u statističke svrhe ili je popunjen, a predaja je samo u svrhu javne objave. Dodatni podaci mora biti popunjen u svim stupcima u kojima je broj mjeseci poslovanja veći od nule."}, {"r": 114, "text": "Bilješke uz financijske izvještaje predaju se u svrhu javne objave (samo za javnu objavu ili za javnu objavu i statistiku) uz sve vrste izvještaja, a ne predaju se ako je svrha predaje samo u statističke potrebe. Pogreška je kada je u Općim podacima označeno \"NE\", a treba biti \"DA\" ili nije upisano ni \"NE\" ni \"DA\"."}, {"r": 115, "text": "Izvještaj o novčanim tokovima moraju popuniti srednji i veliki poduzetnici ako predaju izvještaj u svrhu javne objave. Ovisno o primjeni računovodstvenih politika poduzetnik popunjava jedan izvještaj, po indirektnoj ili direktnoj metodi. Kontrola javlja pogrešku ako su popunjena oba izvještaja, ili nije ni jedan, a poduzetnik ga je dužan popuniti. Ovaj izvještaj se ne popunjava ako je svrha predaje samo statistika te ako je veličina poduzetnika mikro ili mali. U svakoj godini (tekuća ili prethodna) gdje je broj mjeseci poslovanja veći od nule, moraju biti upisani podaci i u ovaj izvještaj."}, {"r": 116, "text": "Izvještaj o promjenama kapitala moraju popuniti svi srednji i veliki poduzetnici koji predaju izvještaj u svrhu javne objave. Ovaj izvještaj se ne popunjava ako je svrha predaje samo za statističke potrebe te ako je veličina poduzetnika mikro ili mali."}, {"r": 117, "text": "Godišnje izvješće dužni su dostaviti srednji i veliki poduzetnici i to kada se izvještaj predaje za potrebe javne objave, i za vrste izvještaja 10 i 11."}, {"r": 118, "text": "Odluka o raspodjeli dobiti ili pokriću gubitka predaje se za sve veličine poduzetnika, uz izvještaje s oznakom vrste izvještaja 10 i 11. Za vrste izvještaja 20 i 30 ova odluka može se predati, ali nije obvezna dok se uz ostale vrste izvještaja kao ni uz konsolidirane izvještaje ne predaje."}, {"r": 119, "text": "Odluka o utvrđivanju godišnjeg izvještaja predaje se za sve veličine poduzetnika, i to za izvještaje s oznakom vrste izvještaja 10 i 11 - ako je svrha predaje javna objava. Kod vrsta izvještaja 20 i 30 odluka se može predati ali i ne mora (zavisi od stečajnog ili likvidacijskog upravitelja)."}, {"r": 120, "text": "Izvještaji s oznakom vrste izvještaja 11 ne mogu biti istovremeno predani u svrhu javne objave i statistike jer se izvještaj za statistiku predaje za kalendarsku godinu, dok se izvještaj za javnu objavu predaje za poslovnu godinu koja je kod vrste izvještaja 11 različita od kalendarske, pa shodno tome podaci za dva različita razdoblja ne mogu biti identični."}, {"r": 121, "text": "Kontrola na datum od i datum do te na broj mjeseci poslovanja. Ako izvještaj nije vrste izvještaja 30 te za svrhu javne objave, broj mjeseci poslovanja ne može biti veći od 12 i ne može biti nula u stupcu tekuće godine. Ako stvarno razdoblje poslovanja u tekućoj godini nije 1.1. do 31.12., broj mjeseci poslovanja mora odgovarati trajanju razdoblja datuma od i datuma do Računa dobiti u gubitka. Ako su u stupcu prethodne godine upisani podaci i broj mjeseci poslovanja mora biti veći od nule (vrijedi i obratno). Samo kod predaje vrste // ---------- automatska stopa članarine TZ ----------
function tzSuggest() {
  const R = M.tzRules, nkd = String(E.inputs['RefStr!C42'] || ''), op = String(E.inputs['RefStr!C39'] || '');
  let best = null;
  if (nkd) for (const [p, g] of R.groups) if (nkd.startsWith(p) && (!best || p.length > best[0].length)) best = [p, g];
  const group = best ? best[1] : 0;
  return { nkd, op, group, rate: group ? R.rates[group] : 0, potp: R.potp[op] || 0 };
}
function applyTz() {
  if (E.inputs['_tzManual']) return;
  const s = tzSuggest();
  if (s.nkd) E.setInput('ČLANARINE!K68', s.rate);
  if (s.op) E.setInput('ČLANARINE!M70', s.potp || '');
  saveState(); for (const n of numInputs) n.show(); recalc();
}

const UPUTE_HTML = "<h2>Prije početka</h2>\n<p>Aplikacija iz prošlogodišnjeg GFI-POD-a i bruto bilance za tekuću godinu automatski priprema završni račun i sve povezane obračune i kontrole.</p>\n<p>Na kraju se podaci prenose u FINA-in GFI-POD obrazac.</p>\n<p>Aplikacija je usklađena s bruto bilancom iz knjigovodstvenog programa PSPnet. Ako koristite drugi program, stojimo na raspolaganju za prilagodbu Vašem postojećem sustavu: pošaljite nam bruto bilancu iz svog programa i uskladit ćemo učitavanje i mapiranje konta.</p>\n<p><strong>Vaši podaci ostaju kod Vas.</strong> Aplikacija sve obrađuje lokalno, u pregledniku na Vašem računalu. Bruto bilanca, GFI obrasci i svi upisani iznosi nikamo se ne šalju i ne spremaju se ni na kakav server. Čuvaju se samo u Vašem pregledniku i u datotekama koje sami spremite.</p>\n<p><strong>Za početak su potrebne 3 datoteke</strong></p>\n<p>Za svakog klijenta pripremi:</p>\n<ol>\n<li><strong>Prošlogodišnji GFI-POD</strong> klijenta (Excel, .xls), onaj koji je predan FINA-i.</li>\n<li><strong>Bruto bilancu u PDF-u</strong> iz programa, sa stanjem <strong>prije zaključnih knjiženja</strong>: ispis na 31.12., ali bez završne temeljnice. Bilanca sa završnom temeljnicom ne valja, jer aplikacija zaključna knjiženja radi sama.</li>\n<li><strong>Prazan FINA-in GFI-POD obrazac</strong> za godinu koja se predaje, skinut s FINA-ine stranice. Jedan obrazac služi za sve klijente.</li>\n</ol>\n<p>Za učitavanje datoteka računalo mora biti spojeno na internet.</p>\n<h2>Korak po korak</h2>\n<p>Cijeli unos za jednog klijenta ide ovim redom, na kartici <strong>Uvoz</strong>:</p>\n<ol>\n<li>Klikni <strong>Novi obrazac</strong> (gore desno) da kreneš od praznog. Prethodni klijent neka je prije toga spremljen (vidi Spremanje).</li>\n<li>U dio <strong>Prethodna godina</strong> ubaci prošlogodišnji GFI-POD. Zelenim slovima mora pisati:<ul>\n<li>Učitani podaci o tvrtki (naziv, OIB, adresa, djelatnost, sjedište),</li>\n<li>Učitana prošla godina (broj pozicija u Bilanci, RDG-u i Dodatnim podacima),</li>\n<li>Stopa članarine TZ određena prema djelatnosti i sjedištu.</li>\n</ul>\n</li>\n<li>U dio <strong>Tekuća godina – bruto bilanca</strong> ubaci PDF bruto bilance. Provjeri da pored naziva firme piše zeleno <strong>Zbroj konta = promet u razdoblju</strong>. Ako piše crveno, PDF nije dobro pročitan.</li>\n<li>Pregledaj dvije tablice konta (RDG i bilanca). <strong>Crveno</strong> označeno konto nema poziciju i neće se prenijeti: odaberi mu poziciju u padajućem izborniku u tom retku.</li>\n<li>Klikni <strong>Prenesi u obrazac</strong>. Ispod gumba mora pisati <strong>Aktiva i pasiva se slažu</strong>.</li>\n<li>Na kartici <strong>Obveznik</strong> provjeri podatke koji se ne prepisuju sami: broj zaposlenih i sati rada za tekuću godinu, te dokumente koji se predaju (bilješke, odluke).</li>\n</ol>\n<h2>Pregled i ispravci</h2>\n<p>Najbrža provjera je usporedba stupaca: prethodna i tekuća godina trebaju imati sličan raspored po pozicijama. Pozicija koja je prošle godine imala iznos, a sad je prazna (ili obrnuto), znak je da je neko konto otišlo na krivo mjesto.</p>\n<table>\n<thead>\n<tr>\n<th>Kartica</th>\n<th>Što pogledati</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>RDG</td>\n<td>Prihodi i rashodi po pozicijama, usporedi s prošlom godinom.</td>\n</tr>\n<tr>\n<td>Bilanca</td>\n<td>Aktiva i pasiva; nijedna pozicija ne smije biti negativna (osim kapitala i rezervi).</td>\n</tr>\n<tr>\n<td>Dodatni</td>\n<td>Prihodi po djelatnosti, kamate, zajmovi, naknade zaposlenima.</td>\n</tr>\n<tr>\n<td>PD</td>\n<td>Nepriznati troškovi (reprezentacija, osobni automobili), potpore, preneseni gubitak.</td>\n</tr>\n<tr>\n<td>TZ</td>\n<td>Stopa članarine, umanjenje za potpomognuto područje, uplaćeni predujmovi.</td>\n</tr>\n<tr>\n<td>Temeljnica</td>\n<td>Mora pisati zeleno <strong>Duguje = potražuje</strong>.</td>\n</tr>\n<tr>\n<td>Kontrole</td>\n<td>Pogreške bi FINA odbila; provjere su upozorenja. Broj se stalno vidi gore u statusu.</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Plava polja</strong> upisuješ ili ispravljaš ručno. <strong>Siva polja</strong> su zbrojevi i računaju se sama. Gdje iznos dolazi s druge kartice, uz njega piše odakle (npr. <em>PD</em>, <em>temeljnica</em>), a klik vodi tamo.</p>\n<p>Kod AOP 051, 121 i 145 podebljani iznos je konačan; ručno se ispravlja malo polje ispod njega (stanje prije zaključnih knjiženja).</p>\n<p>Stopa članarine TZ određuje se sama po djelatnosti. Ako je upišeš ručno, ostaje dok ne klikneš <strong>vrati automatsku stopu</strong>.</p>\n<h2>Izvoz i predaja</h2>\n<p>Aplikacija ne slaže novu Excel datoteku, nego popuni FINA-in obrazac: upiše referentnu stranicu, Bilancu, RDG i Dodatne podatke, a formule, kontrole i skriveni list ostaju netaknuti.</p>\n<ol>\n<li>Klikni zeleni gumb <strong>Izvezi FINA GFI</strong> (ili karticu <strong>GFI</strong>) i odaberi prazan FINA-in GFI-POD obrazac. Ako kontrole javljaju pogreške, aplikacija prvo pita želiš li nastaviti.</li>\n<li>Spremi ponuđenu datoteku (naziv je <em>GFI-POD_naziv firme_godina.xls</em>). Original obrasca ostaje prazan.</li>\n<li>Otvori datoteku u Excelu. Dok je u zaštićenom prikazu, list Kont može javljati pogreške: to je normalno, jer Excel tada ne računa.</li>\n<li>Klikni <strong>Omogući uređivanje</strong>. Excel preračuna sve formule i kontrolni broj, i pogreške nestanu.</li>\n<li>Pogledaj list <strong>Kont</strong>: treba pokazivati isto što i kartica Kontrole u aplikaciji.</li>\n<li>Spremi s <strong>Ctrl+S</strong> i ostavi format <strong>.xls</strong> (Excel 97-2003). Ne spremaj kao .xlsx.</li>\n<li>Predaj spremljenu datoteku kroz <strong>e-RGFI</strong>.</li>\n</ol>\n<h2>Spremanje, mapiranje i česti problemi</h2>\n<p><strong>Spremanje.</strong> Gumb <strong>Spremi u datoteku</strong> napravi datoteku <em>naziv firme_godina_zavrsni.json</em> sa svim podacima klijenta, uključujući učitanu bruto bilancu. <strong>Učitaj</strong> vraća točno to stanje. Za svakog klijenta drži svoju datoteku, jer aplikacija u pregledniku pamti samo zadnjeg.</p>\n<p><strong>Mapiranje konta.</strong> Na dnu kartice Uvoz su dva seta pravila: za RDG i Bilancu, te za Dodatne podatke. Pravilo vrijedi za sva konta koja počinju tim brojem, a duže pravilo ima prednost (4613 pred 46). Pravila se pamte za sve klijente, pa se svako novo konto razvrstava samo jednom.</p>\n<table>\n<thead>\n<tr>\n<th>Problem</th>\n<th>Rješenje</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Konto je crveno u tablici uvoza</td>\n<td>Odaberi mu poziciju u retku, ili dodaj pravilo za njegovu skupinu.</td>\n</tr>\n<tr>\n<td>Aktiva i pasiva se ne slažu</td>\n<td>Provjeri ima li crvenih konta; zatim je li bilanca stanje prije zaključnih knjiženja.</td>\n</tr>\n<tr>\n<td>Negativna pozicija u Bilanci (kontrola 48)</td>\n<td>Konto ima saldo na krivoj strani (npr. preplaćena plaća); provjeri knjiženja ili prebaci iznos na suprotnu poziciju.</td>\n</tr>\n<tr>\n<td>Prihodi po djelatnostima (kontrola 67)</td>\n<td>Aplikacija ih stavlja na poziciju iz prošle godine, ili po NKD-u; ispravi na kartici Dodatni podaci.</td>\n</tr>\n<tr>\n<td>Stopa TZ je 0</td>\n<td>Djelatnost nije na zakonskom popisu; ako firma pretežno radi nešto drugo, upiši stopu ručno.</td>\n</tr>\n<tr>\n<td>PDF se ne učitava</td>\n<td>Mora biti PDF ispisan iz programa, ne skeniran; računalo mora biti na internetu.</td>\n</tr>\n<tr>\n<td>U Excelu su pogreške na listu Kont</td>\n<td>Klikni Omogući uređivanje; ako ostanu, usporedi s karticom Kontrole.</td>\n</tr>\n</tbody>\n</table>";

  if (!g) { g = h('div', { id: 'gate', role: 'dialog', 'aria-modal': 'true' }); document.body.append(g); }
  g.hidden = false;
  const card = h('div', { class: 'gatecard' }, h('img', { src: 'icons/icon-192.png', alt: '', width: 64, height: 64 }), h('h2', {}, 'Završni račun'));
  if (kind === 'pwd') {
    const p1 = h('input', { type: 'password', autocomplete: 'new-password', placeholder: 'nova lozinka' });
    const p2 = h('input', { type: 'password', autocomplete: 'new-password', placeholder: 'ponovi novu lozinku' });
    const err = h('p', { class: 'pill bad', hidden: true });
    const ok = h('p', { class: 'okline', hidden: true }, '✓ Lozinka je promijenjena. Sljedeći put se prijavite novom lozinkom.');
    const save = async () => {
      err.hidden = true;
      if (p1.value.length < 8) { err.textContent = 'Lozinka mora imati barem 8 znakova.'; err.hidden = false; return; }
      if (p1.value !== p2.value) { err.textContent = 'Lozinke se ne podudaraju.'; err.hidden = false; return; }
      sbtn.disabled = true;
      const { error } = await sbClient.auth.updateUser({ password: p1.value });
      sbtn.disabled = false;
      if (error) { err.textContent = /fetch|network/i.test(error.message || '') ? LIC_MSG.offline : /same|different/i.test(error.message || '') ? 'Nova lozinka mora biti drugačija od stare.' : 'Promjena nije uspjela: ' + error.message; err.hidden = false; return; }
      ok.hidden = false; p1.value = ''; p2.value = ''; sbtn.hidden = true; close.textContent = 'Zatvori';
    };
    const sbtn = h('button', { class: 'btn primary', type: 'button', onclick: save }, 'Spremi novu lozinku');
    const close = h('button', { class: 'src', type: 'button', style: 'margin-top:8px', onclick: hideGate }, 'Odustani');
    p2.addEventListener('keydown', (e) => { if (e.key === 'Enter') save(); });
    card.append(h('p', { class: 'lead' }, 'Promjena lozinke za ' + (LIC.email || 'Vaš račun')), err, ok,
      h('label', {}, 'Nova lozinka', p1), h('label', {}, 'Ponovi novu lozinku', p2), sbtn, close);
    g.replaceChildren(card); setTimeout(() => p1.focus(), 50); return;
  }
  if (kind === 'loading') card.append(h('p', { class: 'lead' }, 'Provjera licence…'));
  else if (kind === 'offline') {
    card.append(h('p', { class: 'pill bad' }, LIC_MSG.offline),
      h('button', { class: 'btn primary', type: 'button', onclick: () => start() }, 'Pokušaj ponovno'));
  } else {
    const em = h('input', { type: 'email', autocomplete: 'username', placeholder: 'e-mail', value: LIC.email || '' });
    const pw = h('input', { type: 'password', autocomplete: 'current-password', placeholder: 'lozinka' });
    const err = h('p', { class: 'pill bad', hidden: !msg }, msg || '');
    const go = async () => {
      err.hidden = true;
      if (!navigator.onLine) { err.textContent = LIC_MSG.offline; err.hidden = false; return; }
      btn.disabled = true; btn.textContent = 'Prijava…';
      const { error } = await sbClient.auth.signInWithPassword({ email: em.value.trim(), password: pw.value });
      btn.disabled = false; btn.textContent = 'Prijava';
      if (error) {
        const m = String(error.message || error.code || '');
        err.textContent = /fetch|network/i.test(m) ? LIC_MSG.offline
          : /invalid login credentials/i.test(m) ? 'Pogrešan e-mail ili lozinka.'
          : /not confirmed/i.test(m) ? 'E-mail adresa nije potvrđena. Javite se podršci.'
          : /disabled/i.test(m) ? 'Prijava e-mailom je isključena na serveru (Supabase → Authentication → Email).'
          : /api key|apikey/i.test(m) ? 'Neispravan ključ aplikacije (Supabase API key).'
          : 'Prijava nije uspjela: ' + m;
        err.hidden = false; console.warn('Supabase prijava:', error); return;
      }
      LIC.email = em.value.trim();
      const r = await checkLicence(); applyLicence(r);
      if (r.ok) hideGate(); else { err.textContent = LIC_MSG[r.reason] || 'Licencu nije moguće provjeriti.'; err.hidden = false; }
    };
    const btn = h('button', { class: 'btn primary', type: 'button', onclick: go }, 'Prijava');
    pw.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
    em.addEventListener('keydown', (e) => { if (e.key === 'Enter') pw.focus(); });
    card.append(h('p', { class: 'lead' }, 'Prijavite se korisničkim podacima koje ste dobili uz licencu.'), err,
      h('label', {}, 'E-mail', em), h('label', {}, 'Lozinka', pw), btn,
      h('button', { class: 'src', type: 'button', style: 'margin-top:10px', onclick: () => { LIC.demo = true; renderLicence(); hideGate(); } }, 'Isprobaj demo (samo ručni unos)'),
      installBtn(),
      h('p', { class: 'note', style: 'border:none;padding:8px 0 0;text-align:center' }, 'Licenca vrijedi za jedno računalo. Podaci iz bilanci ostaju na Vašem računalu.'));
    setTimeout(() => (em.value ? pw : em).focus(), 50);
  }
  g.replaceChildren(card);
}
function hideGate() { const g = document.getElementById('gate'); if (g) g.hidden = true; renderLicence(); }
async function start() {
  showGate('loading');
  if (!navigator.onLine) { showGate('offline'); return; }
  if (!sbClient) sbClient = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
  let session = null;
  try { session = (await sbClient.auth.getSession()).data.session; } catch (e) { showGate('offline'); return; }
  if (!session) {
    if (new URLSearchParams(location.search).has('demo')) { LIC.demo = true; renderLicence(); hideGate(); return; }
    showGate('login'); return;
  }
  LIC.email = session.user && session.user.email || '';
  const r = await checkLicence(); applyLicence(r);
  if (r.ok) hideGate(); else if (r.reason === 'offline') showGate('offline'); else showGate('login', LIC_MSG[r.reason]);
}
window.addEventListener('offline', () => { if (LIC.ok) { LIC.checkedAt = 0; } });
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});

// ---------- Administracija licenci (samo za administratora) ----------
let IS_ADMIN = false;
async function checkAdmin() { try { const { data } = await sbClient.rpc('is_admin'); IS_ADMIN = data === true; } catch (e) { IS_ADMIN = false; } renderLicence(); }
async function showAdmin() {
  let g = document.getElementById('gate');
  if (!g) { g = h('div', { id: 'gate', role: 'dialog', 'aria-modal': 'true' }); document.body.append(g); }
  g.hidden = false;
  const msg = h('p', { class: 'lead', 'aria-live': 'polite', style: 'margin:0' });
  const tb = h('tbody');
  const fd = (s) => s ? String(s).slice(0, 10).split('-').reverse().join('.') + '.' : '';
  const plusYear = (iso) => { const d = iso ? new Date(iso) : new Date(); const base = d < new Date() ? new Date() : d; base.setFullYear(base.getFullYear() + 1); return base.toISOString().slice(0, 10); };
  async function load() {
    msg.textContent = 'Učitavam…';
    const { data, error } = await sbClient.rpc('admin_list');
    if (error) { msg.textContent = 'Greška: ' + error.message; return; }
    msg.textContent = '';
    tb.replaceChildren(...data.map(u => {
      const until = h('input', { type: 'date', value: u.valid_until || '', style: 'padding:4px 6px' });
      const max = h('input', { type: 'number', min: 1, value: u.max_devices || 1, style: 'width:56px;padding:4px 6px' });
      const save = async (v) => {
        const { error } = await sbClient.rpc('admin_set_licence', { p_email: u.email, p_until: v || until.value, p_max: +max.value || 1 });
        msg.textContent = error ? 'Greška: ' + error.message : `✓ Spremljeno za ${u.email}`; if (!error) load();
      };
      const expired = u.valid_until && u.valid_until < new Date().toISOString().slice(0, 10);
      return h('tr', {},
        h('td', {}, h('b', {}, u.email), h('div', { class: 'adj', style: 'justify-content:flex-start' }, u.last_sign_in ? 'zadnja prijava ' + fd(u.last_sign_in) : 'nije se još prijavio')),
        h('td', {}, until, u.valid_until ? h('div', { class: 'adj', style: 'justify-content:flex-start;color:' + (expired ? 'var(--err)' : 'inherit') }, expired ? 'istekla' : 'vrijedi') : h('div', { class: 'adj', style: 'justify-content:flex-start' }, 'nema licence')),
        h('td', {}, `${u.devices || 0} / `, max),
        h('td', { style: 'white-space:nowrap' },
          h('button', { class: 'btn', type: 'button', onclick: () => save() }, 'Spremi'), ' ',
          h('button', { class: 'btn', type: 'button', onclick: () => save(plusYear(u.valid_until)) }, '+1 godina'), ' ',
          h('button', { class: 'btn', type: 'button', disabled: !u.devices, onclick: async () => {
            if (!confirm(`Odvezati računalo za ${u.email}? Licenca će se vezati na računalo s kojeg se sljedeći put prijavi.`)) return;
            const { error } = await sbClient.rpc('admin_reset_devices', { p_email: u.email });
            msg.textContent = error ? 'Greška: ' + error.message : `✓ Računalo odvezano za ${u.email}`; if (!error) load();
          } }, 'Odveži računalo')));
    }));
  }
  const card = h('div', { class: 'gatecard', style: 'width:min(980px,100%);max-height:90vh;overflow:auto' },
    h('h2', {}, 'Administracija licenci'),
    h('p', { class: 'note', style: 'border:none;padding:0;text-align:center' }, 'Novog korisnika najprije otvori u Supabaseu (Authentication → Users → Add user, uz Auto Confirm). Ovdje mu zatim upišeš do kad vrijedi licenca i klikneš Spremi.'),
    msg,
    h('div', { class: 'sheet', style: 'margin:0' }, h('table', {}, h('thead', {}, h('tr', {}, h('th', {}, 'Korisnik'), h('th', {}, 'Licenca do'), h('th', {}, 'Računala'), h('th', {}, ''))), tb)),
    h('button', { class: 'src', type: 'button', onclick: hideGate }, 'Zatvori'));
  g.replaceChildren(card);
  load();
}

build();
start();
</script>
</body>
</html>
