  --ink:#1d2a3f; --ink2:#4a5770; --paper:#fbfbf8; --sheet:#ffffff; --rule:#d8dce4; --soft:#eef1f5;
  --auto:#0e6b63; --autobg:#e7f4f2; --man:#a8540a; --manbg:#fdf1e3; --bad:#b42318; --badbg:#fdecea; --ok:#2e7d32; --okbg:#e8f4e9;
  --sum:#f2f4f7; --accent:#1f4e8c;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e6eaf1; --ink2:#a7b1c2; --paper:#13171e; --sheet:#1a2029; --rule:#2e3644; --soft:#222a35;
    --auto:#5cc8bb; --autobg:#14302d; --man:#f0a35a; --manbg:#3a2814; --bad:#ff8a80; --badbg:#3b1b1a; --ok:#81c784; --okbg:#1a3320;
    --sum:#202733; --accent:#8fb6ee; color-scheme: dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
body{padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:20;background:var(--sheet);border-bottom:1px solid var(--rule);padding-top:env(safe-area-inset-top,0px)}
.bar{max-width:1180px;margin:0 auto;padding:12px 20px 0;display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
.brand{flex:1 1 320px;min-width:0}
.brand h1{font:500 21px/1.2 "IBM Plex Serif",Georgia,serif;margin:0}
.brand p{margin:2px 0 0;color:var(--ink2);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:4px}
nav.tabs{max-width:1180px;margin:0 auto;padding:10px 20px 0;display:flex;gap:2px;overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px 9px;cursor:pointer;color:var(--ink2);white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
nav.tabs .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;font-size:12px;line-height:18px;text-align:center;background:var(--badbg);color:var(--bad);font-weight:600}
nav.tabs .badge.ok{background:var(--okbg);color:var(--ok)}
main{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
h2{font:500 19px/1.3 "IBM Plex Serif",Georgia,serif;margin:0 0 6px}
h3{font-size:15px;margin:22px 0 8px}
.lead{color:var(--ink2);margin:0 0 18px;max-width:72ch}
.btn{border:1px solid var(--rule);background:var(--sheet);padding:7px 13px;border-radius:6px;cursor:pointer}
.btn:hover{border-color:var(--ink2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.pri{color:#0f1622}}
.btn:focus-visible,input:focus-visible,select:focus-visible,nav.tabs button:focus-visible,[contenteditable]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px 20px}
.fld label{display:block;font-size:13px;color:var(--ink2);margin-bottom:3px}
.fld input,.fld select{width:100%;padding:7px 9px;border:1px solid var(--rule);border-radius:6px;background:var(--sheet)}
.fld .hint{font-size:12.5px;color:var(--ink2);margin-top:3px;min-height:1em}
.fld.wide{grid-column:1/-1}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:18px 20px;margin-bottom:18px}
.drop{display:block;border:1.5px dashed var(--rule);border-radius:8px;padding:18px;text-align:center;cursor:pointer;background:var(--soft)}
.drop.over{border-color:var(--accent)}
.drop b{display:block}
.drop span{font-size:13.5px;color:var(--ink2)}
.msg{margin:10px 0 0;font-size:14px}
.msg.err{color:var(--bad)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.tools{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:0 0 12px;font-size:14px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px;margin-right:14px}
.sw{width:14px;height:14px;border-radius:3px;display:inline-block;border:1px solid var(--rule)}
.tablewrap{overflow-x:auto;background:var(--sheet);border:1px solid var(--rule);border-radius:8px}
table.f{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
table.f th{position:sticky;top:0;background:var(--soft);text-align:left;font-weight:600;font-size:12.5px;color:var(--ink2);padding:8px 8px;border-bottom:1px solid var(--rule)}
table.f td{padding:3px 8px;border-bottom:1px solid var(--rule);vertical-align:middle}
table.f td.kt{width:62px;color:var(--ink2);font-variant-numeric:tabular-nums}
table.f td.aop{width:46px;color:var(--ink2);text-align:center;font-variant-numeric:tabular-nums}
table.f td.num{width:160px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.f td.ix{width:64px;text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums}
table.f th.r{text-align:right}
table.f tr.sum td{background:var(--sum);font-weight:600}
table.f tr.sec td{background:var(--soft);font-weight:600;letter-spacing:.02em;padding:8px}
table.f tr.lvl1 td.op{font-weight:600}
table.f.hide0 tr.z{display:none}
.num-in{width:128px;text-align:right;padding:3px 6px;border:1px solid transparent;border-radius:4px;background:transparent;font-variant-numeric:tabular-nums}
.num-in:hover{border-color:var(--rule)}
.num-in.auto{background:var(--autobg);color:var(--auto)}
.num-in.man{background:var(--manbg);color:var(--man);font-weight:600}
.num-in.bad{outline:2px solid var(--bad)}
.rst{border:0;background:none;color:var(--man);cursor:pointer;padding:0 0 0 3px;font-size:14px}
.chk{list-style:none;padding:0;margin:0}
.chk li{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--rule)}
.chk .st{flex:0 0 96px;font-weight:600;font-size:13.5px}
.chk .st.ok{color:var(--ok)} .chk .st.err{color:var(--bad)} .chk .st.warn{color:var(--man)}
.chk .d{flex:1}
.chk .d small{display:block;color:var(--ink2)}
table.um{border-collapse:collapse;width:100%;font-size:14px}
table.um td{padding:5px 6px;border-bottom:1px solid var(--rule)}
table.um td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.um select{max-width:340px;padding:4px;border:1px solid var(--rule);border-radius:5px;background:var(--sheet)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 16px;font-size:14px}
.kv dt{color:var(--ink2)} .kv dd{margin:0;font-variant-numeric:tabular-nums}
.doc{background:#fff;color:#1a1a1a;border:1px solid var(--rule);border-radius:4px;padding:48px 56px;max-width:820px;margin:0 auto;font:15px/1.55 "IBM Plex Serif",Georgia,serif;min-height:400px}
.doc h1{font-size:18px;text-align:center;margin:18px 0 2px}
.doc h2{font-size:15px;text-align:center;margin:0 0 18px;font-weight:500}
.doc h4{text-align:center;margin:16px 0 6px;font-size:15px}
.doc table{border-collapse:collapse;width:100%;font-size:13.5px;margin:6px 0 12px}
.doc th,.doc td{border:1px solid #bbb;padding:3px 6px}
.doc td.n,.doc th.n{text-align:right;white-space:nowrap}
.doctabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.doctabs .btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.note{font-size:13.5px;color:var(--ink2);border-left:3px solid var(--rule);padding:2px 0 2px 12px;margin:12px 0}
.sumline{display:flex;gap:24px;flex-wrap:wrap;margin:6px 0 16px;font-size:14px}
.sumline b{font-variant-numeric:tabular-nums}
.ok{color:var(--ok)} .err{color:var(--bad)}
@media print{header.top,nav.tabs,.noprint{display:none!important} main{padding:0} .doc{border:0;padding:0}}
@media (prefers-reduced-motion:no-preference){.flash{animation:fl 1.2s ease-out}@keyframes fl{from{background:var(--autobg)}to{background:transparent}}}

/* Prijava i licenca (kao u Završnom računu) */
.lic{margin:4px 0 0;font-size:12px;color:var(--ink2)}
.brand p.lic{white-space:normal;overflow:visible}
.lic.warn{color:var(--man);font-weight:600}
.lic .user{color:var(--ink2)}
.src{display:inline-block;margin-left:6px;font-size:12px;font-weight:500;color:var(--accent);background:none;border:none;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
a.btn{text-decoration:none;color:inherit;display:inline-block}
#gate{position:fixed;inset:0;z-index:100;background:rgba(17,22,28,.55);display:grid;place-items:center;padding:16px;backdrop-filter:blur(3px);overflow-y:auto}
#gate[hidden]{display:none}
.gatecard{background:var(--sheet);border-radius:14px;padding:26px 28px;width:min(400px,100%);display:flex;flex-direction:column;gap:10px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.gatecard img{align-self:center;border-radius:14px}
.gatecard h2{text-align:center;font-size:20px;margin:0}
.gatecard .lead{text-align:center;margin:0}
.gatecard label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2)}
.gatecard input{border:1px solid var(--rule);background:var(--soft);color:var(--ink);border-radius:6px;padding:9px 10px;font-size:15px}
.gatecard input:focus{outline:none;border-color:var(--accent);background:var(--sheet)}
.gatecard .btn.primary{padding:10px;font-size:15px;background:var(--accent);border-color:var(--accent);color:#fff}
.gatecard .src{align-self:center}
.gatecard .note{font-size:12.5px;color:var(--ink2)}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:500}
.pill.bad{background:var(--badbg);color:var(--bad)}
.okline{margin:4px 0;color:var(--ok);font-weight:600}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .gatecard .btn.primary{color:#0f1622}}
</style>
</head>

async function pdfLines(file) {

  const out = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const tc = await (await pdf.getPage(p)).getTextContent();
    const rows = [];
    for (const it of tc.items) {
      if (!it.str || !it.str.trim()) continue;
      // stranica može biti zakrenuta (položeni ispis): retke slažemo po smjeru teksta
      const [a, b] = it.transform, n = Math.hypot(a, b) || 1, dx = a / n, dy = b / n;
      const px = it.transform[4], py = it.transform[5];
      const x = px * dx + py * dy, y = -px * dy + py * dx;
      let row = rows.find((r) => Math.abs(r.y - y) < 2.5);
      if (!row) { row = { y, items: [] }; rows.push(row); }
      row.items.push({ x, s: it.str });
    }
    rows.sort((a, b) => b.y - a.y);
    for (const r of rows) out.push(r.items.sort((a, b) => a.x - b.x).map((i) => i.s).join(' '));

}
