ader><main><div class="nav"><button data-tab="dashboard" class="on">Pregled mjeseca</button><button data-tab="matrix">Excel tablica</button><button data-tab="calendar">Kalendar</button><button data-tab="types">Obrasci</button><button data-tab="companies">Tvrtke</button><button data-tab="history">Promjene i podsjetnici</button><button data-tab="backup">Sigurnosne kopije</button></div><div class="utility-bar"><button id="theme-toggle" onclick="toggleTheme()" aria-label="Promijeni svijetlu ili tamnu temu">☀️ Svijetla tema</button><span class="muted sm" id="backup-indicator"></span></div><div id="app"></div></main><script>
const SEED=[];
const K='moje-tvrtke-v1';
const THEME_KEY='moje-tvrtke-theme',SNAP_KEY='moje-tvrtke-local-snapshots';
let theme=localStorage.getItem(THEME_KEY)==='light'?'light':'dark';
document.documentElement.dataset.theme=theme;
function toggleTheme(){theme=theme==='dark'?'light':'dark';localStorage.setItem(THEME_KEY,theme);document.documentElement.dataset.theme=theme;updateUtility()}
function updateUtility(){
 const t=document.getElementById('theme-toggle');if(t)t.textContent=theme==='dark'?'☀️ Svijetla tema':'🌙 Tamna tema';
 const b=document.getElementById('backup-indicator');if(b){let snaps=readSnapshots();b.textContent=snaps.length?'Lokalna zaštitna kopija: '+new Date(snaps[0].time).toLocaleString('hr-HR'):'Preporuka: preuzmi JSON sigurnosnu kopiju';}
}
function readSnapshots(){try{const x=JSON.parse(localStorage.getItem(SNAP_KEY)||'[]');return Array.isArray(x)?x:[]}catch{return []}}
function makeSnapshot(reason){
 const payload=JSON.stringify(db);
 const list=readSnapshots();const stamp=new Date().toISOString();
 if(list[0]&&list[0].data===payload)return true;
 list.unshift({id:stamp,time:stamp,reason,data:payload});
 try{localStorage.setItem(SNAP_KEY,JSON.stringify(list.slice(0,5)));return true}
 catch(e){
  // On quota pressure preserve newest snapshot, but never overwrite the main dataset.
  try{localStorage.setItem(SNAP_KEY,JSON.stringify(list.slice(0,1)));return true}
  catch{return false}
 }
}
function snapshotDownload(snapshotId){
 const snap=readSnapshots().find(s=>s.id===snapshotId);if(!snap)return alert('Kopija nije dostupna.');
 download(JSON.stringify({version:1,exported:snap.time,source:'local-snapshot',data:JSON.parse(snap.data)},null,2),'moje-tvrtke-zastitna-'+snap.time.slice(0,10)+'.json','application/json');
}
function restoreSnapshot(snapshotId){
 const snap=readSnapshots().find(s=>s.id===snapshotId);if(!snap)return alert('Kopija nije dostupna.');
 let parsed;try{parsed=JSON.parse(snap.data)}catch{return alert('Neispravna kopija.')}
 if(!Array.isArray(parsed.companies)||!parsed.records||typeof parsed.records!=='object')return alert('Kopija nije ispravna.');
 if(!confirm('Vratiti ovu lokalnu kopiju? Sadašnji podaci bit će zamijenjeni. Prije nastavka napravit će se zaštitna kopija.'))return;
 makeSnapshot('Prije vraćanja kopije');
 db=parsed;normalizeRestoredData();save();render();
}
function normalizeRestoredData(){
 db.customTypes=Array.isArray(db.customTypes)?db.customTypes:[];
 db.profiles=Array.isArray(db.profiles)?db.profiles:DEFAULT_PROFILES.map(p=>({...p,types:[...p.types]}));
 db.personalNotes=Array.isArray(db.personalNotes)?db.personalNotes:[];
 db.reminders=Array.isArray(db.reminders)?db.reminders:[];
 db.deadlines=db.deadlines&&typeof db.deadlines==='object'?db.deadlines:{};
 db.calendarTasks=Array.isArray(db.calendarTasks)?db.calendarTasks:[];
 selected=db.companies[0]?.id;
}
const TYPES=[['PDV','PDV'],['PDV-S','PDV-S'],['JOPPD','JOPPD'],['VIRMANI','Virmani po PDV-u'],['EIZ','e-Izvještavanje'],['PPMIPO','PP-MI-PO'],['GFI','GFI-POD'],['PD','PD'],['TZ','TZ'],['DOH','DOH'],['SUME','Šume'],['OPZ','OPZ-STAT'],['OTHER','Druga obveza']];
let db;try{db=JSON.parse(localStorage.getItem(K))}catch(e){};if(!db||!Array.isArray(db.companies)){db={companies:SEED.map((name,i)=>({id:'c'+i,name,from:'',to:'',reason:'',events:[],rules:[],notes:''})),records:{},reminders:[]}}
db.customTypes=Array.isArray(db.customTypes)?db.customTypes:[];
const DEFAULT_PROFILES=[{id:'doo-pdv',name:'d.o.o. u sustavu PDV-a',types:['PDV','JOPPD','TZ','GFI','PD']},{id:'doo-nepdv',name:'d.o.o. izvan PDV-a',types:['GFI','PD','TZ','JOPPD']},{id:'obrt-doh',name:'Obrt na dohodak – izvan PDV-a',types:['DOH','JOPPD','TZ']},{id:'obrt-doh-pdv',name:'Obrt na dohodak – u PDV-u',types:['PDV','DOH','JOPPD','TZ']},{id:'obrt-pausal',name:'Paušalni obrt',types:[]}];
// Predlošci su samo početni prijedlozi, nikad pravna procjena obveza.

function easterSunday(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),n=h+l-7*m+114;return new Date(y,Math.floor(n/31)-1,n%31+1)}
function croatianHolidays(y){const fixed=[[1,1,'Nova godina'],[1,6,'Sveta tri kralja'],[5,1,'Praznik rada'],[5,30,'Dan državnosti'],[6,22,'Dan antifašističke borbe'],[8,5,'Dan pobjede i domovinske zahvalnosti'],[8,15,'Velika Gospa'],[11,1,'Svi sveti'],[11,18,'Dan sjećanja'],[12,25,'Božić'],[12,26,'Sveti Stjepan']].map(([m,d,name])=>({date:new Date(y,m-1,d),name}));const e=easterSunday(y),add=(days,name)=>({date:new Date(y,e.getMonth(),e.getDate()+days),name});return [...fixed,add(0,'Uskrs'),add(1,'Uskrsni ponedjeljak'),add(60,'Tijelovo')].sort((a,b)=>a.date-b.date)}

function bulkSubmit(){const keys=[...document.querySelectorAll('tr:not([hidden]) .taskcheck:checked')].map(x=>x.value);if(!keys.length)return alert('Najprije označi obveze.');const available=new Set(tasks().filter(isUnresolved).map(x=>x.key));if(keys.some(k=>!available.has(k)))return alert('Neke obveze više nisu dostupne. Osvježi pregled.');if(!confirm('Označiti '+keys.length+' obveza kao PREDANO s današnjim datumom ('+fmtDate(today())+')?'))return;for(const key of keys){db.records[key]={...(db.records[key]||{}),status:'submitted',date:today()}}save();render()}
function dashboard(){const allTasks=tasks(),t=onlyUnresolved?allTasks.filter(isUnresolved):allTasks,companyOptions=[...new Map(t.map(x=>[x.c.id,x.c.name])).entries()].sort((a,b)=>a[1].localeCompare(b[1],'hr')),done=allTasks.filter(x=>['confirmed','none'].includes(db.records[x.key]?.status)).length;return `<div id="liveclock">${clockMarkup()}</div><div class="weather-bar">☀️ <b>Dubrovnik</b> · <span id="weather">Učitavanje vremena…</span></div>${notesPanel()}${deadlinePanel()}<div class="panel"><div class="row"><h2>Mjesečni pregled</h2><div class="stack"><select id="month">${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${month===i+1?'selected':''}>${new Date(2026,i,1).toLocaleString('hr-HR',{month:'long'})}</option>`).join('')}</select><input id="year" type="number" min="2000" max="2100" value="${year}" style="width:100px"><button onclick="year=+document.getElementById('year').value;month=+document.getElementById('month').value;render()">Prikaži</button></div></div><div class="cardgrid"><div class="metric"><span class="muted">Obveza</span><strong>${allTasks.length}</strong></div><div class="metric"><span class="muted">Potvrđeno</span><strong>${done}</strong></div><div class="metric"><span class="muted">Preostalo</span><strong>${allTasks.length-done}</strong></div><div class="metric"><span class="muted">Napredak</span><strong>${allTasks.length?Math.round(100*done/allTasks.length):0}%</strong></div></div><p class="note">Obveze se prikazuju prema mjesecu evidencije. Rokove i datume stvarnih predaja unosiš zasebno; aplikacija ne potvrđuje automatski zakonske rokove.</p><div class="company-finder"><div><label for="dashboardCompany">Brzi odabir tvrtke</label><select id="dashboardCompany" onchange="filterDashboardCompanies()"><option value="">Sve tvrtke</option>${companyOptions.map(([id,name])=>`<option value="${esc(id)}">${esc(name)}</option>`).join('')}</select></div><div><label for="dashboardSearch">Pretraži naziv tvrtke</label><input id="dashboardSearch" type="search" placeholder="Upiši dio naziva…" oninput="filterDashboardCompanies()"></div><button onclick="resetDashboardFilter()">Prikaži sve</button><span class="muted sm" id="dashboardCount" aria-live="polite">Prikazano ${companyOptions.length} tvrtki · ${t.length} obveza</span></div><div class="bulkbar"><label><input id="selectAllTasks" type="checkbox" onchange="selectAllTasks(this.checked)"> Odaberi sve neriješene</label><button class="primary" onclick="bulkSubmit()">✓ Označi odabrane kao predano danas</button><span id="bulkCount" class="quick-msg">0 odabrano</span></div><label class="filter-toggle"><input type="checkbox" ${onlyUnresolved?'checked':''} onchange="toggleUnresolved()"> Samo neriješene obveze</label><div class="tablewrap"><table><thead><tr><th>Odabir</th><th>Tvrtka</th><th>Obveza</th><th>Status</th><th>Datum</th><th>Napomena</th><th>Radnja</th></tr></thead><tbody>${t.map(x=>{let r=db.records[x.key]||{},s=r.status||'pending';return `<tr data-company-id="${esc(x.c.id)}" data-company-name="${esc(x.c.name.toLocaleLowerCase('hr'))}" class="${s==='confirmed'?'taskdone':''}"><td>${isUnresolved(x)?`<input class="taskcheck" type="checkbox" value="${esc(x.key)}" aria-label="Odaberi ${esc(x.c.name)} ${esc(nameOf(x.r.type))}" onchange="bulkSelection()">`:''}</td><td>${esc(x.c.name)}</td><td>${esc(nameOf(x.r.type))}</td><td><span class="pill ${s==='confirmed'?'ok':s==='submitted'?'warn':''}">${s==='confirmed'?'Potvrđeno':s==='submitted'?'Predano':s==='none'?'Nema':'Čeka'}</span></td><td>${esc(fmtDate(r.date)||'—')}</td><td>${esc(r.note||'')}</td><td><div class="quick-actions">${isUnresolved(x)?`<button onclick="quickSubmit('${esc(x.key)}')" title="Upiši predano i današnji datum">✓ Predano danas</button>`:''}<button onclick="editTask('${esc(x.key)}')">Uredi</button></div></td></tr>`}).join('')||`<tr><td colspan="7">${db.companies.length?'Nema obveza za ovaj mjesec. Obveze se dodaju u kartici Tvrtke.':'Još nema tvrtki. Dodaj prvu tvrtku i odaberi njezine obveze.'} <button class="primary" onclick="tab='companies';${db.companies.length?'':'wizardStart();'}render()">${db.companies.length?'Otvori Tvrtke':'+ Dodaj prvu tvrtku'}</button></td></tr>`}</tbody></table></div></div>${holidayPanel()}`}
function filterDashboardCompanies(){const sel=document.getElementById('dashboardCompany'),search=document.getElementById('dashboardSearch');if(!sel||!search)return;const id=sel.value,q=search.value.trim().toLocaleLowerCase('hr');let rows=0,companies=new Set();document.querySelectorAll('tr[data-company-id]').forEach(tr=>{const match=(!id||tr.dataset.companyId===id)&&(!q||tr.dataset.companyName.includes(q));tr.hidden=!match;if(!match){const cb=tr.querySelector('.taskcheck');if(cb)cb.checked=false}if(match){rows++;companies.add(tr.dataset.companyId)}});const count=document.getElementById('dashboardCount');if(count)count.textContent=`Prikazano ${companies.size} tvrtki · ${rows} obveza${rows===0?' — nema rezultata':''}`}
function resetDashboardFilter(){document.getElementById('dashboardCompany').value='';document.getElementById('dashboardSearch').value='';filterDashboardCompanies()}
function matrix(){const all=tasks(),ym=monthKey(year,month),by=new Map();for(const t of all){if(!by.has(t.c.id))by.set(t.c.id,new Map());let a=by.get(t.c.id);if(!a.has(t.r.type))a.set(t.r.type,[]);a.get(t.r.type).push(t)}const cols=[...TYPES,...db.customTypes.map(x=>[x.code,x.name])].filter(([code])=>all.some(t=>t.r.type===code));const cs=db.companies.filter(c=>active(c,ym)&&by.has(c.id));return `<div class="panel"><div class="row"><h2>Excel pregled obveza</h2><div class="stack"><select id="month">${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${month===i+1?'selected':''}>${new Date(2026,i,1).toLocaleString('hr-HR',{month:'long'})}</option>`).join('')}</select><input id="year" type="number" min="2000" max="2100" value="${year}" style="width:95px"><button onclick="year=+document.getElementById('year').value;month=+document.getElementById('month').value;render()">Prikaži</button></div></div><div style="padding:12px 14px;margin:12px 0;border:1px solid #496887;border-radius:10px;background:#1b3047"><strong>Mjesec predaje: ${new Date(year,month-1,1).toLocaleString('hr-HR',{month:'long',year:'numeric'})}</strong><div style="margin-top:5px">Redovni mjesečni PDV i PDV-S: <b>razdoblje ${new Date(year,month-2,1).toLocaleString('hr-HR',{month:'long',year:'numeric'})}</b> (ako je obveza mjesečna).${[1,4,7,10].includes(month)?` Tromjesečni PDV: <b>${Math.floor(((month+10)%12)/3)+1}. tromjesečje ${month===1?year-1:year}.</b>`:''} JOPPD: razdoblje ovisi o vrsti primitka i isplati. e-Izvještavanje: prema posebnom pravilu.</div><div class="muted sm" style="margin-top:5px">Ovo je informativna oznaka. Razdoblje i rok pojedine prijave provjeri prema stvarnoj obvezi; statusi i postojeći zapisi nisu promijenjeni.</div></div><p class="muted sm">Redovi su tvrtke, stupci su obveze. Tamna ćelija = nije dodijeljeno; žuta = čeka; zelena = potvrđeno; siva = nema obveze u tom mjesecu. Klik na aktivnu ćeliju otvara status i datum. Ako postoje dvije obveze iste vrste, prikazuje se njihov broj.</p>${cs.length?'':'<p class="note">Za ovaj mjesec nema tvrtki s obvezama.</p>'}<div class="matrixwrap"><table class="matrix"><thead><tr><th>Tvrtka</th>${cols.map(x=>`<th>${esc(x[1])}</th>`).join('')}</tr></thead><tbody>${cs.map(c=>`<tr><td><b>${esc(c.name)}</b></td>${cols.map(([code])=>{let list=by.get(c.id)?.get(code)||[];if(!list.length)return '<td class="na" title="Nema definirane obveze">—</td>';let states=list.map(t=>db.records[t.key]?.status||'pending');let state=states.every(s=>s==='none')?'none':states.every(s=>s==='confirmed'||s==='none')?'confirmed':states.some(s=>s==='submitted'||s==='confirmed')?'submitted':'pending';let last=list.map(t=>db.records[t.key]?.date||'').filter(Boolean).sort().at(-1)||'';return `<td class="${state}"><button onclick="matrixCell('${esc(c.id)}','${esc(code)}')" title="Otvori obvezu">${state==='confirmed'?'✓ Potvrđeno':state==='submitted'?'◐ Djelomično':state==='none'?'— Nema':'○ Čeka'}${list.length>1?' ('+list.length+')':''}${last?`<div class="cell-date">${esc(fmtDate(last))}</div>`:''}</button></td>`}).join('')}</tr>`).join('')}</tbody></table></div><p class="muted sm">Stupci se automatski pojavljuju za obveze definirane u odabranom mjesecu. Postojeći podaci i način spremanja ostaju isti.</p></div>`}
function matrixCell(cid,code){let a=tasks().filter(t=>t.c.id===cid&&t.r.type===code);if(a.length===1){editTask(a[0].key);return}if(!a.length)return;let n=prompt('Više obveza iste vrste. Odaberi redni broj (1–'+a.length+'):', '1');if(n===null)return;let i=Number(n)-1;if(Number.isInteger(i)&&i>=0&&i<a.length)editTask(a[i].key);else alert('Neispravan odabir')}
let wizard=null;
function wizardStart(cid=''){const c=cid?db.companies.find(x=>x.id===cid):null;wizard={step:0,editing:!!c,companyId:c?.id||null,name:c?.name||'',from:c?.from||'',to:c?.to||'',notes:c?.notes||'',contact:c?.contact||'',phone:c?.phone||'',email:c?.email||'',contactNote:c?.contactNote||'',reason:c?.reason||'',rules:c?c.rules.map(r=>({...r})):[],copyFrom:''};tab='wizard';render()}
function wizardRead(){if(!wizard)return false;const w=wizard;if(w.step===0){w.name=document.getElementById('wname').value.trim();w.from=isoDate(document.getElementById('wfrom').value);w.to=isoDate(document.getElementById('wto').value);w.notes=document.getElementById('wnotes').value;w.contact=document.getElementById('wcontact').value.trim();w.phone=document.getElementById('wphone').value.trim();w.email=document.getElementById('wemail').value.trim();w.contactNote=document.getElementById('wcontactNote').value.trim();if(w.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(w.email))return alert('Provjeri kontakt e-mail.'),false;w.reason=document.getElementById('wreason').value;if(!w.name)return alert('Upiši naziv tvrtke.'),false;if(w.from===null||w.to===null)return alert('Datum mora biti dd.mm.gggg.'),false;if(w.from&&w.to&&w.to<w.from)return alert('Kraj suradnje ne može biti prije početka.'),false}if(w.step===1){const chosen=[...document.querySelectorAll('.w-type:checked')].map(x=>x.value);w.rules=w.rules.filter(r=>chosen.includes(r.type));for(const type of chosen)if(!w.rules.some(r=>r.type===type)){const d=ruleDefaults(type);w.rules.push({id:id(),type,freq:d.freq,from:w.from||'',to:'',dueMonth:d.dueMonth})}}if(w.step===2){for(const r of w.rules){r.freq=document.getElementById('wf_'+r.id).value;r.dueMonth=+document.getElementById('wm_'+r.id).value;r.from=isoDate(document.getElementById('ws_'+r.id).value);r.to=isoDate(document.getElementById('we_'+r.id).value);if(r.from===null||r.to===null)return alert('Provjeri datum za '+nameOf(r.type)),false;if(r.from&&r.to&&r.to<r.from)return alert('Datum završetka obveze prethodi početku.'),false}}return true}
function wizardMove(n){if(n>0&&!wizardRead())return;wizard.step=Math.max(0,Math.min(4,wizard.step+n));render()}
function wizardCopy(){const src=db.companies.find(c=>c.id===document.getElementById('wcopy').value);if(!src)return;if(wizard.rules.length&&!confirm('Zamijeniti trenutačni izbor obveza kopijom druge tvrtke?'))return;wizard.rules=src.rules.map(r=>({...r,id:id()}));render()}
function wizardFinish(){if(!wizardRead())return;const w=wizard;let c=w.editing?db.companies.find(c=>c.id===w.companyId):null;if(w.editing&&!c)return alert('Tvrtka nije pronađena.');if(!c){c={id:id(),name:'',from:'',to:'',reason:'',notes:'',events:[],rules:[]};db.companies.push(c)}Object.assign(c,{name:w.name,from:w.from,to:w.to,reason:w.reason,notes:w.notes,contact:w.contact,phone:w.phone,email:w.email,contactNote:w.contactNote});const keep=new Set(w.rules.map(r=>r.id));const removed=(c.rules||[]).filter(r=>!keep.has(r.id));const used=removed.filter(r=>Object.keys(db.records||{}).some(k=>k.startsWith(c.id+'|'+r.id+'|')));if(used.length){alert('Nije moguće ukloniti obvezu koja već ima evidentirane statuse: '+used.map(r=>nameOf(r.type)).join(', ')+'. Za promjenu koristi datum završetka obveze.');return}c.rules=w.rules.map(r=>({...r}));selected=c.id;filter='all';save();wizard=null;tab='companies';render();if(confirm('Tvrtka je spremljena. Želiš dodati sljedeću tvrtku?'))wizardStart()}
function wizardView(){if(!wizard)return '<p>Čarobnjak nije pokrenut.</p>';const w=wizard;const names=['Osnovni podaci','Odabir obveza','Učestalost i datumi','Pregled postavki','Spremanje'];const selectedTypes=new Set(w.rules.map(r=>r.type));const known=[...allTypes(),...w.rules.filter(r=>!allTypes().some(t=>t[0]===r.type)).map(r=>[r.type,nameOf(r.type)])];let body='';if(w.step===0)body=`<p class="wiz-help">Unesi podatke o klijentu. Datume možeš ostaviti praznima.</p><div class="fields"><div><label>Naziv tvrtke / obrta</label><input id="wname" value="${esc(w.name)}"></div><div><label>Početak suradnje</label><input id="wfrom" placeholder="dd.mm.gggg." value="${esc(fmtDate(w.from))}"></div><div><label>Kraj suradnje</label><input id="wto" placeholder="dd.mm.gggg." value="${esc(fmtDate(w.to))}"></div><div><label>Razlog prestanka</label><select id="wreason">${['','Tvrtka ugašena','Prešao drugom knjigovođi','Mirovanje','Ostalo'].map(x=>`<option value="${esc(x)}" ${w.reason===x?'selected':''}>${esc(x||'— Nije primjenjivo —')}</option>`).join('')}</select></div><div><label>Kontakt osoba</label><input id="wcontact" autocomplete="name" value="${esc(w.contact||'')}" placeholder="Ime i prezime"></div><div><label>Mobitel</label><input id="wphone" type="tel" autocomplete="tel" value="${esc(w.phone||'')}" placeholder="+385..."></div><div><label>Kontakt e-mail</label><input id="wemail" type="email" autocomplete="email" value="${esc(w.email||'')}" placeholder="kontakt@tvrtka.hr"></div><div><label>Napomena za kontakt</label><input id="wcontactNote" value="${esc(w.contactNote||'')}" placeholder="Npr. dokumentaciju šalje do 10."></div></div><label>Bilješke</label><textarea id="wnotes" rows="2">${esc(w.notes)}</textarea>`;
if(w.step===1)body=`<p class="wiz-help">Označi samo obveze koje ova tvrtka ima. Već spremljene obveze ostaju označene.</p><div class="fields"><div><label>Gotovi profil tvrtke (neobavezno)</label><select id="wprofile" onchange="wizardProfile()"><option value="">— Odaberi profil —</option>${profileOptions()}</select></div><div style="align-self:end"><button onclick="profileManage()">Uredi profile</button></div></div><p class="muted sm"><span id="profileMessage">Odabirom profila kvačice se odmah označavaju.</span> Profili su predlošci, ne automatska zakonska procjena. Provjeri obveze za svaku tvrtku prije spremanja.</p><div class="fields"><div><label>Preuzmi obveze druge tvrtke (ne kopira statuse)</label><select id="wcopy"><option value="">Odaberi tvrtku...</option>${db.companies.filter(c=>c.id!==w.companyId).map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}</select></div><div style="align-self:end"><button onclick="wizardCopy()">Kopiraj postavke</button></div></div>${known.map(([code,name])=>`<label class="wiz-choice"><input class="w-type" type="checkbox" value="${esc(code)}" ${selectedTypes.has(code)?'checked':''}> ${esc(name)}</label>`).join('')}`;
if(w.step===2)body=`<p class="wiz-help">Odredi kada se obveza pojavljuje u mjesečnoj evidenciji. Datumi su početak i kraj primjene pravila, ne datumi predaje obrasca.</p>${w.rules.length?w.rules.map(r=>`<div class="wiz-card"><h3>${esc(nameOf(r.type))}</h3><div class="fields"><div><label>Učestalost</label><select id="wf_${r.id}">${[['monthly','Mjesečno'],['quarterly','Tromjesečno'],['yearly','Godišnje'],['once','Jednokratno']].map(([v,n])=>`<option value="${v}" ${r.freq===v?'selected':''}>${n}</option>`).join('')}</select></div><div><label>Mjesec predaje (godišnje)</label><select id="wm_${r.id}">${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${Number(r.dueMonth)===i+1?'selected':''}>${i+1}</option>`).join('')}</select></div><div><label>Od datuma</label><input id="ws_${r.id}" placeholder="dd.mm.gggg." value="${esc(fmtDate(r.from))}"></div><div><label>Do datuma</label><input id="we_${r.id}" placeholder="dd.mm.gggg." value="${esc(fmtDate(r.to))}"></div></div></div>`).join(''):'<p>Nema odabranih obveza. Možeš se vratiti i dodati ih.</p>'}`;
if(w.step===3)body=`<p class="wiz-help">Provjeri podatke prije spremanja. Povijest predaja i statusi ostaju sačuvani.</p><p><b>Tvrtka:</b> ${esc(w.name)}</p><p><b>Kontakt:</b> ${esc(w.contact||'—')} · ${esc(w.phone||'—')} · ${esc(w.email||'—')}</p><p><b>Suradnja:</b> ${esc(fmtDate(w.from)||'bez datuma')} – ${esc(fmtDate(w.to)||'aktivno')}</p><p><b>Obveze (${w.rules.length}):</b></p>${w.rules.map(r=>`<p class="note">${esc(nameOf(r.type))} · ${esc(({monthly:'mjesečno',quarterly:'tromjesečno',yearly:'godišnje',once:'jednokratno'})[r.freq]||r.freq)} · ${esc(fmtDate(r.from)||'bez početnog datuma')}</p>`).join('')}`;
if(w.step===4)body=`<p>Spremni smo! Klikni <b>Spremi tvrtku</b> za potvrdu. Nakon spremanja možeš dodati sljedeću tvrtku ili se vratiti na postojeću evidenciju.</p><p class="wiz-help">Kod izmjene postojeće tvrtke ne brišemo evidenciju statusa. Uklanjanje obveze s poviješću bit će blokirano.</p>`;
return `<div class="panel"><div class="row"><h2>${w.editing?'Uredi tvrtku kroz čarobnjaka':'Čarobnjak · Nova tvrtka'}</h2><button onclick="wizard=null;tab='companies';render()">Odustani</button></div><div class="muted sm">Korak ${w.step+1} od 5</div><div class="wiz-steps">${names.map((n,i)=>`<span class="${i<=w.step?'on':''}" title="${n}"></span>`).join('')}</div><h3>${names[w.step]}</h3>${body}<div class="wiz-actions"><button ${w.step===0?'disabled':''} onclick="wizardMove(-1)">← Natrag</button>${w.step===4?'<button class="primary" onclick="wizardFinish()">✓ Spremi tvrtku</button>':'<button class="primary" onclick="wizardMove(1)">Dalje →</button>'}</div></div>`}
function companies(){let c=find();return `<div class="panel"><div class="row"><h2>Registar tvrtki</h2><button class="primary" onclick="wizardStart()">+ Nova tvrtka</button></div><div class="fields"><div><label>Prikaži</label><select onchange="filter=this.value;render()"><option value="active" ${filter==='active'?'selected':''}>Aktivne na današnji datum</option><option value="all" ${filter==='all'?'selected':''}>Sve tvrtke</option><option value="inactive" ${filter==='inactive'?'selected':''}>Arhivirane</option></select></div><div><label>Odaberi tvrtku</label><select onchange="selected=this.value;edit=false;render()">${db.companies.filter(c=>filter==='all'||(filter==='active'?active(c,today().slice(0,7)):!active(c,today().slice(0,7)))).map(c=>`<option value="${esc(c.id)}" ${selected===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div></div></div>${c?`<div class="panel"><div class="row"><h2>${esc(c.name)}</h2><button onclick="wizardStart(selected)">🪄 Uredi kroz čarobnjaka</button><span class="pill ${active(c,today().slice(0,7))?'ok':'warn'}">${active(c,today().slice(0,7))?'U evidenciji':'Arhiva'}</span></div><div class="fields"><div><label>Naziv tvrtke / obrta</label><input id="cname" value="${esc(c.name)}" placeholder="Naziv tvrtke ili obrta"></div><div><label>Početak suradnje (prazno = nepoznato)</label><input id="cfrom" type="text" inputmode="numeric" placeholder="dd.mm.gggg." value="${fmtDate(esc(c.from))}"></div><div><label>Kraj suradnje (prazno = aktivno)</label><input id="cto" type="text" inputmode="numeric" placeholder="dd.mm.gggg." value="${fmtDate(esc(c.to))}"></div><div><label>Razlog prestanka</label><select id="creason"><option value="">—</option>${['Tvrtka ugašena','Prešao drugom knjigovođi','Mirovanje','Ostalo'].map(v=>`<option ${c.reason===v?'selected':''}>${v}</option>`).join('')}</select></div></div><div class="fields"><div><label>Kontakt osoba</label><input id="ccontact" value="${esc(c.contact||'')}"></div><div><label>Mobitel</label><input id="cphone" type="tel" value="${esc(c.phone||'')}"></div><div><label>Kontakt e-mail</label><input id="cemail" type="email" value="${esc(c.email||'')}"></div><div><label>Napomena za kontakt</label><input id="ccontactNote" value="${esc(c.contactNote||'')}"></div></div><div class="contact-actions">${c.contact?`<span>👤 ${esc(c.contact)}</span>`:''}${c.phone?`<a href="tel:${encodeURIComponent(c.phone.replace(/[^+0-9]/g,''))}">📞 ${esc(c.phone)}</a>`:''}${c.email?`<a href="mailto:${encodeURIComponent(c.email)}">✉️ ${esc(c.email)}</a>`:''}${c.contactNote?`<span>📝 ${esc(c.contactNote)}</span>`:''}</div><label>Bilješke o tvrtki</label><textarea id="cnotes" rows="2">${esc(c.notes)}</textarea><p><button class="primary" onclick="saveCompany()">Spremi podatke</button></p><h3>Obveze tvrtke</h3><p class="muted sm">Dodaj pravilo za svaku vrstu prijave. Datum početka i završetka omogućuje ulazak i izlazak iz PDV-a ili promjene zaposlenih.</p><div class="tablewrap"><table><tr><th>Obveza</th><th>Učestalost</th><th>Od</th><th>Do</th><th>Godišnji mjesec</th><th></th></tr>${c.rules.map(r=>`<tr><td>${esc(nameOf(r.type))}</td><td>${esc(({monthly:'Mjesečno',quarterly:'Tromjesečno',yearly:'Godišnje',once:'Jednokratno'})[r.freq])}</td><td>${esc(fmtDate(r.from)||'—')}</td><td>${esc(fmtDate(r.to)||'—')}</td><td>${r.freq==='yearly'?r.dueMonth:'—'}</td><td><button onclick="editRule('${r.id}')">Uredi</button> <button style="border-color:#9f5252;color:#ffb5b5" onclick="removeRule('${r.id}')">Ukloni</button></td></tr>`).join('')}</table></div><div class="fields"><div><label>Obveza</label><select id="rtype" onchange="applyRuleDefaults()">${allTypes().map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')}</select></div><div><label>Učestalost</label><select id="rfreq"><option value="monthly">Mjesečno</option><option value="quarterly">Tromjesečno</option><option value="yearly">Godišnje</option><option value="once">Jednokratno</option></select></div><div><label>Od datuma</label><input type="text" inputmode="numeric" placeholder="dd.mm.gggg." id="rfrom"></div><div><label>Do datuma</label><input type="text" inputmode="numeric" placeholder="dd.mm.gggg." id="rto"></div><div><label>Mjesec predaje (godišnje)</label><select id="rdue">${Array.from({length:12},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join('')}</select></div></div><button class="primary" onclick="addRule()">+ Dodaj obvezu</button><h3>Dnevnik promjena</h3><div class="fields"><div><label>Datum promjene</label><input type="text" inputmode="numeric" placeholder="dd.mm.gggg." id="evdate" value="${fmtDate(today())}"></div><div><label>Vrsta promjene</label><select id="evtype">${['Ulazak u PDV','Izlazak iz PDV-a','Zapošljavanje','Prestanak zaposlenja','Prestanak suradnje','Ponovni početak suradnje','Drugo'].map(x=>`<option>${x}</option>`).join('')}</select></div><div><label>Opis / što provjeriti</label><input id="evnote" placeholder="Npr. posljednji JOPPD"></div></div><button onclick="addEvent()">+ Spremi promjenu</button><div>${c.events.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(e=>`<p class="note"><b>${esc(fmtDate(e.date))}</b> · ${esc(e.type)} — ${esc(e.note)}</p>`).join('')}</div></div>`:''}`}


// Kalendar objedinjuje evidenciju, rokove, osobne zadatke i hrvatske blagdane.
function calMove(delta){calMonth+=delta;if(calMonth<1){calMonth=12;calYear--}if(calMonth>12){calMonth=1;calYear++}calSelected='';render()}
function calPick(day){calSelected=[calYear,String(calMonth).padStart(2,'0'),String(day).padStart(2,'0')].join('-');render()}
function calOpenMonth(){year=calYear;month=calMonth;tab='dashboard';render()}
function calTasksForMonth(y,m){
 const ym=monthKey(y,m),out=[];
 for(const c of db.companies){
  if(!active(c,ym))continue;
  for(const r of c.rules||[]){
   if(r.from&&r.from.slice(0,7)>ym||r.to&&r.to.slice(0,7)<ym)continue;
   if(r.freq==='yearly'&&Number(r.dueMonth||1)!==m)continue;
   if(r.freq==='quarterly'&&![1,4,7,10].includes(m))continue;
   if(r.freq==='once'&&r.from?.slice(0,7)!==ym)continue;
   out.push({c,r,key:[c.id,r.id,ym].join('|')});
  }
 }
 return out;
}
function calRecurringOn(t,iso){
 if(!t.start||iso<t.start)return false;
 if(t.until&&iso>t.until)return false;
 const a=new Date(t.start+'T12:00:00'),d=new Date(iso+'T12:00:00');
 if(!Number.isFinite(+a)||!Number.isFinite(+d))return false;
 if(t.repeat==='daily')return true;
 if(t.repeat==='weekly')return a.getDay()===d.getDay();
 if(t.repeat==='monthly')return a.getDate()===d.getDate();
 return iso===t.start;
}
function calTaskDone(t,iso){return !!(t.completed&&t.completed[iso])}
function calAddTask(){
 const text=prompt('Novi zadatak / podsjetnik za kalendar:');if(text===null)return;
 if(!text.trim())return alert('Upiši naziv zadatka.');
 const raw=prompt('Datum početka (dd.mm.gggg.)',fmtDate(calSelected||today()));if(raw===null)return;
 const start=isoDate(raw);if(!start)return alert('Neispravan datum.');
 const rep=prompt('Ponavljanje: 0 = samo jednom, D = svaki dan, T = svaki tjedan, M = svaki mjesec','0');
 if(rep===null)return;
 const repeat=({'0':'once','D':'daily','T':'weekly','M':'monthly'})[rep.trim().toUpperCase()];
 if(!repeat)return alert('Odaberi 0, D, T ili M.');
 let until='';
 if(repeat!=='once'){
  const rawEnd=prompt('Završetak ponavljanja (dd.mm.gggg. ili prazno = bez kraja)','');
  if(rawEnd===null)return;
  until=isoDate(rawEnd);if(until===null)return alert('Neispravan datum završetka.');
  if(until&&until<start)return alert('Završetak je prije početka.');
 }
 db.calendarTasks.push({id:id(),text:text.trim(),start,until,repeat,completed:{}});
 calYear=+start.slice(0,4);calMonth=+start.slice(5,7);calSelected=start;save();render();
}
function calToggleTask(taskId,date){
 const t=db.calendarTasks.find(x=>x.id===taskId);if(!t)return;
 t.completed=t.completed||{};if(t.completed[date])delete t.completed[date];else t.completed[date]=true;
 save();render();
}
function calDeleteTask(taskId){
 if(!confirm('Izbrisati zadatak i sva njegova ponavljanja?'))return;
 db.calendarTasks=db.calendarTasks.filter(t=>t.id!==taskId);save();render();
}
function calSubmit(key){
 const record=db.records[key]||{};
 if(['submitted','confirmed','none'].includes(record.status||''))return alert('Ova obveza više nije na čekanju.');
 if(!confirm('Označiti ovu obvezu kao predanu na današnji datum?'))return;
 db.records[key]={...record,status:'submitted',date:today()};save();render();
}
function calOpenRecord(key){
 const parts=key.split('|');year=+parts[2].slice(0,4);month=+parts[2].slice(5,7);
 tab='dashboard';render();
}
function calDayKey(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function calBridges(holidays){
 const ideas=[];
 for(const h of holidays){
  const wd=h.date.getDay(),date=calDayKey(h.date);
  if(wd===1||wd===5)ideas.push({date,text:'Produženi vikend bez godišnjeg (3 dana)'});
  else if(wd===2||wd===4)ideas.push({date,text:'Uz 1 dan godišnjeg moguća su 4 dana odmora'});
  else if(wd===3)ideas.push({date,text:'Uz 2 dana godišnjeg moguće je 5 dana odmora'});
 }
 return ideas;
}
function calendarView(){
 const ym=monthKey(calYear,calMonth),now=today(),all=[];
 for(const [key,r] of Object.entries(db.records||{})){
  if(!r||!/^\d{4}-\d\d-\d\d$/.test(r.date||'')||!['submitted','confirmed'].includes(r.status))continue;
  const parts=key.split('|');if(parts.length!==3)continue;
  const c=db.companies.find(c=>String(c.id)===parts[0]);if(!c)continue;
  const rule=(c.rules||[]).find(x=>String(x.id)===parts[1]);
  all.push({date:r.date,company:c.name,type:rule?nameOf(rule.type):'Arhivirana obveza',status:r.status,note:r.note||'',period:parts[2],key});
 }
 const monthly=all.filter(x=>x.date.startsWith(ym)),byDay=new Map();
 for(const e of monthly){if(!byDay.has(e.date))byDay.set(e.date,[]);byDay.get(e.date).push(e)}
 const pending=new Map();
 // Rok iz prethodnog mjeseca može se pomaknuti u ovaj (vikend/blagdan), zato gledamo oba mjeseca
 const prevY=calMonth===1?calYear-1:calYear,prevM=calMonth===1?12:calMonth-1;
 const calSources=[...calTasksForMonth(prevY,prevM).map(x=>({x,y:prevY,m:prevM})),...calTasksForMonth(calYear,calMonth).map(x=>({x,y:calYear,m:calMonth}))];
 for(const {x,y:srcY,m:srcM} of calSources){
  const status=db.records[x.key]?.status||'pending';
  if(['submitted','confirmed','none'].includes(status))continue;
  const due=deadlineDate(srcY,srcM,x.r.type);if(!due)continue;
  const date=calDayKey(due);
  if(!date.startsWith(ym))continue;
  if(!pending.has(date))pending.set(date,[]);
  pending.get(date).push({...x,date});
 }
 const holidays=croatianHolidays(calYear).filter(h=>h.date.getMonth()+1===calMonth);
 const holidayByDay=new Map(holidays.map(h=>[calDayKey(h.date),h]));
 const bridges=calBridges(holidays);
 const count=new Date(calYear,calMonth,0).getDate(),first=(new Date(calYear,calMonth-1,1).getDay()+6)%7;
 const notes=db.personalNotes.filter(n=>n.due&&n.due.startsWith(ym));
 const custom=db.calendarTasks||[];
 const taskByDay=new Map();
 for(let day=1;day<=count;day++){
  const date=ym+'-'+String(day).padStart(2,'0');
  const matching=custom.filter(t=>calRecurringOn(t,date));
  if(matching.length)taskByDay.set(date,matching);
 }
 const cells=Array.from({length:first},()=>'<div class="cal-empty"></div>');
 for(let d=1;d<=count;d++){
  const date=ym+'-'+String(d).padStart(2,'0'),h=holidayByDay.get(date),entries=byDay.get(date)||[],dues=pending.get(date)||[];
  const overdue=dues.length&&date<now,personal=notes.filter(n=>n.due===date),customDay=taskByDay.get(date)||[];
  const weekend=[0,6].includes(new Date(calYear,calMonth-1,d).getDay());
  cells.push(`<button class="cal-day ${calSelected===date?'cal-selected':''} ${h?'cal-holiday':weekend?'cal-weekend':''}" onclick="calPick(${d})" title="${esc(h?.name||'')}" aria-label="${d}. ${calMonth}.; ${entries.length} predaja; ${dues.length} otvorenih rokova${h?'; '+esc(h.name):''}"><span>${d}</span><span class="cal-dots">${entries.length?'<i class="cal-dot"></i>':''}${dues.length?`<i class="cal-dot ${overdue?'cal-red':'cal-yellow'}"></i>`:''}${personal.length||customDay.length?'<i class="cal-dot cal-blue"></i>':''}</span>${h?`<small class="cal-holiday-name">${esc(h.name)}</small>`:entries.length||dues.length?`<small>${entries.length?'✓'+entries.length+' ':''}${dues.length?'⌛'+dues.length:''}</small>`:''}</button>`);
 }
 const picked=byDay.get(calSelected)||[],dues=pending.get(calSelected)||[],holiday=holidayByDay.get(calSelected);
 const dayTasks=taskByDay.get(calSelected)||[],dayNotes=notes.filter(n=>n.due===calSelected);
 const monthLabel=new Date(calYear,calMonth-1,1).toLocaleDateString('hr-HR',{month:'long',year:'numeric'});
 const unique=new Set(monthly.map(e=>e.company));
 const openCount=[...pending.values()].reduce((sum,a)=>sum+a.length,0);
 const finished=custom.reduce((sum,t)=>sum+[...taskByDay].filter(([date,arr])=>arr.includes(t)&&calTaskDone(t,date)).length,0);
 const holidayText=holiday?`<div class="cal-holiday-banner"><strong>🇭🇷 ${esc(holiday.name)}</strong> · Neradni dan u Hrvatskoj${bridges.find(b=>b.date===calSelected)?`<div>🏖️ ${esc(bridges.find(b=>b.date===calSelected).text)}</div>`:''}</div>`:'';
 return `<div class="panel"><div class="row"><div><h2>📅 Kalendar · posao i odmor</h2><p class="muted sm">Predaje, rokovi, zadaci i hrvatski blagdani na jednom mjestu. Zakonske rokove provjeri prema važećim pravilima.</p></div><div class="stack"><button onclick="calOpenMonth()">Mjesečni pregled</button><button class="primary" onclick="calAddTask()">+ Novi zadatak</button></div></div>
 <div class="cal-top"><button onclick="calMove(-1)" aria-label="Prethodni mjesec">‹</button><h3>${esc(monthLabel)}</h3><button onclick="calMove(1)" aria-label="Sljedeći mjesec">›</button><button onclick="calYear=new Date().getFullYear();calMonth=new Date().getMonth()+1;calSelected=today();render()">Danas</button></div>
 <div class="cal-grid">${['Pon','Uto','Sri','Čet','Pet','Sub','Ned'].map(x=>`<div class="cal-week">${x}</div>`).join('')}${cells.join('')}</div>
 <div class="cal-stats"><span>🟢 Predano / potvrđeno</span><span>🟡 Čeka rok</span><span>🔴 Rok prošao</span><span>🔵 Zadaci / podsjetnici</span><span>🇭🇷 Blagdan</span></div>
 <div class="cal-stats"><span>✓ ${monthly.length} predaja/potvrda</span><span>🏢 ${unique.size} tvrtki</span><span>⌛ ${openCount} otvorenih obveza s rokovima</span><span>☑ ${finished} završenih zadataka</span></div>
 ${holidays.length?`<div class="cal-holidays-list"><strong>🏖️ Blagdani ovog mjeseca</strong>${holidays.map(h=>`<p><button onclick="calPick(${h.date.getDate()})">${fmtDate(calDayKey(h.date))} · ${esc(h.name)}</button> <span class="muted sm">${esc(bridges.find(b=>b.date===calDayKey(h.date))?.text||([0,6].includes(h.date.getDay())?'Pada na vikend':'Neradni dan'))}</span></p>`).join('')}</div>`:'<p class="muted sm">Ovaj mjesec nema hrvatskih državnih blagdana i neradnih dana.</p>'}</div>
 <div class="panel"><div class="row"><h3>${esc(calSelected?fmtDate(calSelected):'Odaberi dan')}</h3><button onclick="calAddTask()">+ Zadatak</button></div>
 ${holidayText}
 ${picked.length?`<h4>✓ Evidentirane predaje i potvrde</h4>${picked.sort((a,b)=>a.company.localeCompare(b.company,'hr')).map(e=>`<div class="cal-event"><div><strong>${esc(e.company)}</strong> · ${esc(e.type)}<div class="muted sm">${e.status==='confirmed'?'Potvrđeno':'Predano'} · Mjesec: ${esc(e.period)}${e.note?' · '+esc(e.note):''}</div></div><button onclick="calOpenRecord('${esc(e.key)}')">Otvori evidenciju</button></div>`).join('')}`:''}
 ${dues.length?`<h4>${calSelected<now?'🔴 Zakašnjele':'🟡 Otvorene'} obveze s rokom</h4>${dues.map(x=>`<div class="cal-event"><div><strong>${esc(x.c.name)}</strong> · ${esc(nameOf(x.r.type))}<div class="muted sm">Rok: ${fmtDate(x.date)} · Mjesec evidencije: ${esc(x.key.split('|')[2])}</div></div><div class="stack"><button onclick="calOpenRecord('${esc(x.key)}')">Otvori</button><button class="primary" onclick="calSubmit('${esc(x.key)}')">✓ Predano danas</button></div></div>`).join('')}`:''}
 ${dayTasks.length?`<h4>🔵 Planirani zadaci</h4>${dayTasks.map(t=>`<div class="cal-event"><div><strong>${esc(t.text)}</strong><div class="muted sm">${({once:'Jednokratno',daily:'Svaki dan',weekly:'Tjedno',monthly:'Mjesečno'})[t.repeat]||'Zadatak'}</div></div><div class="stack"><button onclick="calToggleTask('${esc(t.id)}','${calSelected}')">${calTaskDone(t,calSelected)?'↩ Vrati':'✓ Gotovo'}</button><button onclick="calDeleteTask('${esc(t.id)}')">Ukloni</button></div></div>`).join('')}`:''}
 ${dayNotes.length?`<h4>📝 Podsjetnici s početne ploče</h4>${dayNotes.map(n=>`<div class="cal-event"><div>${esc(n.text)} ${n.done?'✓':''}</div><button onclick="togglePersonalNote('${esc(n.id)}')">${n.done?'Vrati':'✓ Gotovo'}</button></div>`).join('')}`:''}
 ${!picked.length&&!dues.length&&!holiday&&!dayTasks.length&&!dayNotes.length?'<p class="muted">Za ovaj dan nema evidentiranih aktivnosti.</p>':''}
 <p class="muted sm">Kalendar koristi posljednji spremljeni datum statusa; ranija predaja nakon promjene u „Potvrđeno” nije zasebno arhivirana. Novi zadaci spremaju se samo na ovom uređaju i uključeni su u JSON kopiju.</p></div>`;
}

function history(){let all=db.companies.flatMap(c=>c.events.map(e=>({...e,company:c.name}))).sort((a,b)=>b.date.localeCompare(a.date));return `<div class="panel"><h2>Promjene i podsjetnici</h2><p class="note">Podsjetnici su vidljivi kada otvoriš aplikaciju. U ovoj verziji nema automatskih obavijesti dok je aplikacija zatvorena.</p><div>${all.map(e=>`<p class="note"><b>${esc(fmtDate(e.date))}</b> · <b>${esc(e.company)}</b> · ${esc(e.type)}<br>${esc(e.note)}</p>`).join('')||'Nema unesenih promjena.'}</div></div>`}
function backup(){
 const snaps=readSnapshots();
 return `<div class="panel"><h2>🛡️ Sigurnosne kopije</h2>
 <p>Podaci ostaju na ovom uređaju. JSON kopija na računalu ili USB-u jedina je zaštita ako se izbrišu podaci preglednika ili izgubi uređaj.</p>
 <div class="stack"><button class="primary" onclick="exportJson()">⬇ Preuzmi kompletnu JSON kopiju</button><button onclick="document.getElementById('import').click()">⬆ Uvezi JSON kopiju</button><input id="import" type="file" accept=".json,application/json" class="hidden" onchange="importJson(this)"><button onclick="exportCsv()">CSV za Excel (trenutni mjesec)</button></div>
 <p class="note">Prije uvoza ili vraćanja aplikacija pokušava spremiti zaštitnu kopiju postojećih podataka. Lokalna zaštitna kopija nije zamjena za preuzeti JSON.</p></div>
 <div class="panel"><div class="row"><div><h3>Zaštitne kopije na ovom uređaju</h3><p class="muted sm">Do 5 kopija u pregledniku. Spremaju se prije uvoza/vraćanja i ručno na zahtjev.</p></div><button onclick="manualSnapshot()">+ Spremi sada</button></div>
 ${snaps.length?snaps.map(x=>`<div class="cal-event"><div><strong>${new Date(x.time).toLocaleString('hr-HR')}</strong><div class="muted sm">${esc(x.reason)}</div></div><div class="stack"><button onclick="snapshotDownload('${esc(x.id)}')">Preuzmi</button><button onclick="restoreSnapshot('${esc(x.id)}')">Vrati</button></div></div>`).join(''):'<p class="muted">Još nema lokalnih zaštitnih kopija.</p>'}
 </div>`;
}
function manualSnapshot(){if(makeSnapshot('Ručno spremanje')){alert('Lokalna zaštitna kopija spremljena. Za sigurnost izvezi i JSON datoteku.');render()}else alert('Nema dovoljno prostora u pregledniku. Odmah preuzmi JSON kopiju.')}
function addCompany(){let n=prompt('Naziv nove tvrtke');if(!n?.trim())return;let c={id:id(),name:n.trim(),from:'',to:'',reason:'',notes:'',events:[],rules:[]};db.companies.push(c);selected=c.id;filter='all';save();render()}
function saveCompany(){let c=find();let newName=document.getElementById('cname').value.trim();if(!newName){alert('Unesi naziv tvrtke.');return}c.name=newName;c.from=getDate('cfrom');c.to=getDate('cto');if(c.from===null||c.to===null){alert('Datum mora biti dd.mm.gggg.');return}if(c.from&&c.to&&c.to<c.from){alert('Datum završetka je prije početka.');return}c.reason=document.getElementById('creason').value;c.notes=document.getElementById('cnotes').value;c.contact=document.getElementById('ccontact').value.trim();c.phone=document.getElementById('cphone').value.trim();c.email=document.getElementById('cemail').value.trim();c.contactNote=document.getElementById('ccontactNote').value.trim();if(c.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c.email)){alert('Provjeri kontakt e-mail.');return}save();render()}
function addRule(){let c=find(),type=document.getElementById('rtype').value,freq=document.getElementById('rfreq').value,from=getDate('rfrom'),to=getDate('rto'),dueMonth=+document.getElementById('rdue').value;if(from===null||to===null){alert('Datum mora biti dd.mm.gggg.');return}if(from&&to&&to<from){alert('Provjeri datume');return}c.rules.push({id:id(),type,freq,from,to,dueMonth});save();render()}
function editRule(rid){let r=find().rules.find(r=>r.id===rid);let end=prompt('Datum završetka pravila (dd.mm.gggg.; prazno = bez završetka):',fmtDate(r.to));if(end===null)return;end=isoDate(end);if(end===null){alert('Datum mora biti dd.mm.gggg.');return}r.to=end;save();render()}
function removeRule(rid){let c=find();if(!c)return;let r=c.rules.find(x=>x.id===rid);if(!r)return;const matching=Object.keys(db.records||{}).filter(k=>k.includes(rid));if(matching.length){alert('Ova obveza već ima '+matching.length+' spremljenih zapisa predaje. Radi očuvanja povijesti ne može se ukloniti. Upotrijebi Uredi i datum završetka.');return}if(!confirm('Ukloniti obvezu "'+nameOf(r.type)+'" za '+c.name+'?\n\nOvo koristi samo za pogrešno dodane duplikate bez predaja. Ostale obveze i povijest ostaju sačuvani.'))return;c.rules=c.rules.filter(x=>x.id!==rid);save();render()}
function addEvent(){let c=find(),date=getDate('evdate'),type=document.getElementById('evtype').value,note=document.getElementById('evnote').value;if(!date){alert('Unesi ispravan datum dd.mm.gggg.');return}c.events.push({id:id(),date,type,note});save();render()}
function editTask(key){const old=db.records[key]||{};const choices=[['pending','Čeka'],['submitted','Predano'],['confirmed','Potvrđeno'],['none','Nema']];const shade=document.createElement('div');shade.className='status-overlay';shade.innerHTML=`<div class="status-dialog" role="dialog" aria-modal="true" aria-labelledby="status-title"><h3 id="status-title">Odaberi status obveze</h3><p class="muted sm">Klikni kvačicu uz željeni status. Datum i napomena ostaju u sljedećim koracima.</p><div class="status-choices">${choices.map(([value,label])=>`<label class="status-choice"><input type="radio" name="task-status" value="${value}" ${value===(old.status||'pending')?'checked':''}><span>${label}</span></label>`).join('')}</div><div class="status-actions"><button type="button" data-action="cancel">Odustani</button><button type="button" class="primary" data-action="next">Dalje →</button></div></div>`;document.body.appendChild(shade);const close=()=>shade.remove();shade.querySelector('[data-action="cancel"]').onclick=close;shade.addEventListener('click',e=>{if(e.target===shade)close()});shade.querySelector('[data-action="next"]').onclick=()=>{const status=shade.querySelector('input[name="task-status"]:checked')?.value;if(!status)return;close();let date=prompt('Datum statusa (dd.mm.gggg.)',fmtDate(old.date||today()));if(date===null)return;date=isoDate(date);if(date===null){alert('Datum mora biti dd.mm.gggg.');return}let note=prompt('Napomena',old.note||'');if(note===null)return;db.records[key]={status,date,note};save();render()};shade.querySelector('input[name="task-status"]:checked')?.focus()}

function download(content,filename,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function exportJson(){download(JSON.stringify({version:1,exported:today(),data:db},null,2),'moje-tvrtke-kopija-'+today()+'.json','application/json')}
async function importJson(el){let f=el.files[0];if(!f)return;try{let v=JSON.parse(await f.text());if(!v.data||!Array.isArray(v.data.companies)||(typeof v.data.records!=='object'||v.data.records===null||Array.isArray(v.data.records)))throw Error('Nepoznat format');if(!confirm('Zamijeniti sve trenutačne podatke u aplikaciji?'))return;if(!makeSnapshot('Prije uvoza JSON kopije')){if(!confirm('Lokalna zaštitna kopija nije uspjela (moguće nedovoljno prostora). Nastaviti bez nje?'))return;}db=v.data;db.customTypes=Array.isArray(db.customTypes)?db.customTypes:[];db.profiles=Array.isArray(db.profiles)?db.profiles:DEFAULT_PROFILES.map(p=>({...p,types:[...p.types]}));for(const profile of db.profiles){if(profile.id==='obrt-doh'&&profile.name==='Obrt na dohodak'&&JSON.stringify(profile.types)===JSON.stringify(['DOH'])){profile.name='Obrt na dohodak – izvan PDV-a';profile.types=['DOH','JOPPD','TZ']}}
if(!db.profiles.some(p=>p.id==='obrt-doh-pdv'))db.profiles.push({...DEFAULT_PROFILES.find(p=>p.id==='obrt-doh-pdv'),types:['PDV','DOH','JOPPD','TZ']});
for(const profile of db.profiles){const legacy=LEGACY_PROFILE_TYPES[profile.id];const standard=DEFAULT_PROFILES.find(p=>p.id===profile.id);if(legacy&&standard&&profile.name===standard.name&&Array.isArray(profile.types)&&profile.types.length===legacy.length&&profile.types.every((t,i)=>t===legacy[i]))profile.types=[...standard.types]}for(const profile of db.profiles){if(profile.id==='obrt-doh'&&profile.name==='Obrt na dohodak'&&JSON.stringify(profile.types)===JSON.stringify(['DOH'])){profile.name='Obrt na dohodak – izvan PDV-a';profile.types=['DOH','JOPPD','TZ']}}if(!db.profiles.some(p=>p.id==='obrt-doh-pdv'))db.profiles.push({...DEFAULT_PROFILES.find(p=>p.id==='obrt-doh-pdv'),types:['PDV','DOH','JOPPD','TZ']});db.personalNotes=Array.isArray(db.personalNotes)?db.personalNotes:[];db.deadlines=db.deadlines&&typeof db.deadlines==='object'?db.deadlines:{};db.calendarTasks=Array.isArray(db.calendarTasks)?db.calendarTasks:[];selected=db.companies[0]?.id;save();render()}catch(e){alert('Uvoz nije uspio: '+e.message)}}
function exportCsv(){let rows=[['Tvrtka','Mjesec','Obveza','Status','Datum','Napomena']];tasks().forEach(t=>{let r=db.records[t.key]||{};rows.push([t.c.name,monthKey(year,month),nameOf(t.r.type),r.status||'pending',r.date||'',r.note||''])});download('\ufeff'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\r\n'),'moje-tvrtke-'+monthKey(year,month)+'.csv','text/csv;charset=utf-8')}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});render();setInterval(tickClock,1000);
</script><script>(function(){const splash=document.getElementById('startup-splash');function hide(){splash?.classList.add('hide');setTimeout(()=>splash?.remove(),450)}window.addEventListener('load',()=>setTimeout(hide,1500),{once:true});setTimeout(hide,3000);if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('Offline instalacija nije dostupna:',e)));})();</script></body></html>
